<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rückwärtsgang Dev</title>
<!-- Rückwärtsgang without lobby or phones: bots "speak" little melodies and imitate them backwards, not quite
     right. Click the page once to unlock the sound.
     ?modus=alle|einzeln  ?aufnahme=zugleich|reihum  ?anzahl=1..8 (words, mode alle)  ?runden=1..3 (mode einzeln)
     ?woerter=liste|frei  ?stufe=leicht|mittel|schwer  ?wertung=an|aus  ?n=1..8
     ?phone=1  adds the real phone UI as player 1. On localhost the browser allows the live microphone, so you
               can play a whole turn at the desk with the computer's microphone.
     ?only=1   the phone alone (for screenshots)   ?host=0  the phone is not the host
     ?first=1  the phone's player goes first   ?nolive=1  no live microphone (as on the home Wi-Fi)
     ?drive=listen|reveal  a bot records for the phone's player up to that phase
     ?autorec=1  presses the phone's record button by itself (needs a faked microphone)
     ?sim=<ms> fast-forwards with a fake clock -->
<style>
  html, body { margin:0; height:100%; font-family:system-ui,sans-serif; color:#fff; background:#1a1a24;
               -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center; gap:14px; }
  /* identisch zur canvas-Regel in screen.html */
  #c { background:#0d0d1a; border-radius:10px; box-shadow:0 0 50px rgba(120,90,255,.18); min-width:0; flex:1 1 auto;
       max-width:calc(100vw - 20px); max-height:calc(100vh - 20px); width:auto; height:auto; object-fit:contain; }
  body:not(.phone) #c { width:min(calc(100vw - 20px), calc((100vh - 20px) * 1.6)); flex:none; }
  /* die Shell-Klassen aus controller.html */
  #phone { display:none; position:relative; width:390px; max-width:100%; height:min(100%, 844px); flex:none; touch-action:none; overflow:hidden; }
  body.phone #phone { display:block; }
  body.only #c { display:none; } body.only #phone { width:100%; height:100%; }
  .view { display:none; flex-direction:column; height:100%; box-sizing:border-box; }
  .view.on { display:flex; }
  .bar { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .word { font-size:22px; font-weight:800; }
  .btn { border:none; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:700; background:#3a3a48; color:#fff; }
  .btn.go { background:#30d158; color:#06250f; flex:1; }
  .btn:disabled { opacity:.5; }
  .muted { opacity:.75; font-size:15px; }
  #abortBtn { position:absolute; top:8px; right:8px; z-index:1000; display:none; border:none; border-radius:10px;
              padding:8px 12px; font-weight:800; font-size:15px; background:#ff3b30; color:#fff; }
</style>
</head>
<body>
<div id="phone"><button id="abortBtn">✕ Abbrechen</button></div>
<canvas id="c" width="960" height="600"></canvas>
<script>window.__AC_ROLE__ = 'screen';</script>
<script src="core/sfx.js"></script>
<script src="core/mic.js"></script>
<script src="core/voiceclip.js"></script>
<script src="core/game-registry.js"></script>
<script>
  // Shell-Stubs für beide Seiten: der Fernseher und (mit ?phone=1) ein Handy auf derselben Seite
  const q = new URLSearchParams(location.search);
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const NAMES = ['Anna', 'Ben', 'Cleo', 'Dino', 'Eva', 'Finn', 'Gül', 'Hugo'];
  const COLORS = ['#ff2d55', '#0a84ff', '#30d158', '#ffd60a', '#bf5af2', '#ff9f0a', '#64d2ff', '#ff6482'];
  const players = {};
  const N = Math.max(1, Math.min(8, +q.get('n') || 3));
  for (let i = 1; i <= N; i++) players[i] = { color: COLORS[i - 1], name: NAMES[i - 1], named: true };
  const nameOf = (id) => players[id] ? players[id].name : 'Spieler ' + id;
  const shortName = nameOf;
  const HUMAN = q.get('phone') ? 1 : null;
  const hostId = () => (q.get('host') === '0' ? 2 : 1);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function setBanner(t) { console.log('BANNER:', t); }
  function reportWinners(ids) { console.log('Sieger:', ids); }
  function endToLobby(m) { document.title = 'LOBBY:' + m; console.log('endToLobby:', m); }
  function rr(o, x, y, w, h, r) { o.beginPath(); o.moveTo(x + r, y); o.arcTo(x + w, y, x + w, y + h, r); o.arcTo(x + w, y + h, x, y + h, r); o.arcTo(x, y + h, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath(); }
  function fitFont(o, text, max, start) { let f = start; o.font = 'bold ' + f + 'px system-ui,sans-serif'; while (o.measureText(text).width > max && f > 10) { f -= 2; o.font = 'bold ' + f + 'px system-ui,sans-serif'; } }
  const $ = (id) => document.getElementById(id);
  const VIEWS = [];
  function showView(v) { VIEWS.forEach(n => $('v-' + n).classList.toggle('on', n === v)); }
  let timerInt = null;
  function startTimer(ms, el) { clearInterval(timerInt); const end = Date.now() + ms, upd = () => { el.textContent = Math.max(0, Math.ceil((end - Date.now()) / 1000)); }; upd(); timerInt = setInterval(upd, 200); }
  function stopTimer() { clearInterval(timerInt); }
  const AirConsole = { SCREEN: 0 };
  const copy = (d) => JSON.parse(JSON.stringify(d));
  const ac = { message(to, d) {
    if (to === 0) { if (window.__game) window.__game.onMessage(HUMAN, copy(d)); }
    else if (to === HUMAN && window.CONTROLLERS.rueckwaerts) window.CONTROLLERS.rueckwaerts.onMessage(copy(d));
  } };
</script>
<script src="games/rueckwaerts/meta.js"></script>
<script src="games/rueckwaerts/words.js"></script>
<script src="games/rueckwaerts/rules.js"></script>
<script src="games/rueckwaerts/screen.js"></script>
<script src="games/rueckwaerts/controller.js"></script>
<script>
  const logError = console.error.bind(console);
  function devFail(msg) {
    let box = document.getElementById('devFail');
    if (!box) {
      box = document.createElement('pre'); box.id = 'devFail';
      box.style.cssText = 'position:fixed; left:0; top:0; right:0; margin:0; padding:14px; z-index:2000; background:#400; color:#fff; font:bold 15px monospace; white-space:pre-wrap;';
      document.body.appendChild(box);
    }
    box.textContent += msg + '\n';
    logError(msg);
  }
  console.error = (...a) => devFail(a.join(' '));
  window.addEventListener('error', (e) => devFail('JS-Fehler: ' + e.message));
  try {
    const simMs = parseInt(q.get('sim') || '0', 10);
    let fake = 1000;
    if (simMs > 0) performance.now = () => fake;

    $('phone').appendChild($('v-rueckwaerts'));
    if (HUMAN) document.body.classList.add('phone');
    if (q.get('only')) document.body.classList.add('only');
    $('abortBtn').style.display = HUMAN && hostId() === 1 ? 'block' : 'none';

    const game = window.GAMES.rueckwaerts();
    window.__game = game;
    game.start(Object.keys(players).map(Number), { modus: q.get('modus') || 'alle', aufnahme: q.get('aufnahme') || 'zugleich', anzahl: +q.get('anzahl') || 3,
      woerter: q.get('woerter') || 'liste', stufe: q.get('stufe') || 'mittel', runden: +q.get('runden') || 1, wertung: q.get('wertung') || 'aus' });
    const dbg = () => game._debug();
    const say = (id, m) => game.onMessage(id, m);
    if (q.get('nolive')) window.Mic.canLive = () => false;          // look at the phone as it is on the home Wi-Fi
    if (HUMAN && q.get('first')) for (let i = 0; i < 8 && dbg().state.phase.id !== HUMAN; i++) say(hostId(), { t: 'rwNext' });
    if (HUMAN) window.CONTROLLERS.rueckwaerts.activate();

    // ---- a bot's "voice": a few syllables, each a tone that rises or falls. Different for every bot and turn ----
    const RATE = VoiceClip.RATE;
    function melody(seed) {
      const n = 3 + seed % 3, len = Math.round(RATE * 0.26), x = new Float32Array(n * len);
      for (let k = 0; k < n; k++) {
        const f0 = 180 + ((seed * 37 + k * 91) % 9) * 45, f1 = f0 * (k % 2 ? 0.7 : 1.5);
        let ph = 0;
        for (let i = 0; i < len; i++) { const t = i / len; ph += 2 * Math.PI * (f0 + (f1 - f0) * t) / RATE; x[k * len + i] = 0.7 * Math.sin(ph) * Math.min(1, t * 12) * Math.pow(1 - t, 0.6); }
      }
      return x;
    }
    // the imitation: the reverse, a little off in speed and with a wobble, as a person would manage
    function imitate(x, seed) {
      const r = VoiceClip.reverse(x), k = 0.9 + (seed % 5) * 0.05, out = new Float32Array(Math.floor(r.length / k));
      for (let i = 0; i < out.length; i++) out[i] = r[Math.min(r.length - 1, Math.floor(i * k))] * (0.8 + 0.2 * Math.sin(i / 900));
      return out;
    }

    // ---- bots ----
    const botIds = Object.keys(players).map(Number).filter(id => id !== HUMAN);
    let lastKey = '', keyAt = 0, done = false, did = {};
    function bots(now) {
      const st = dbg().state, ph = st.phase, key = ph.kind + ':' + st.t + ':' + (ph.at || 0) + ':' + (ph.turn || 0);
      if (key !== lastKey) { lastKey = key; keyAt = now; done = false; did = {}; }
      const age = now - keyAt, id = ph.id, seed = (id || 0) * 7 + st.t * 13;
      // ?drive=listen|reveal: a bot also records for the phone's player until that phase is reached (for screenshots)
      const drive = q.get('drive'), driven = id === HUMAN && drive && ph.kind !== drive && !(drive === 'listen' && ph.kind === 'reveal');
      if (!done && (botIds.includes(id) || driven)) {
        if (ph.kind === 'say' && age > 1500) { done = true; say(id, { t: 'rwClip', pcm: VoiceClip.pack(melody(seed)) }); }
        else if (ph.kind === 'listen' && !dbg().game.busy(now) && age > dbg().game.total() + 1200) { done = true; say(id, { t: 'rwClip', pcm: VoiceClip.pack(imitate(dbg().clips[ph.a].x, seed)) }); }
        else if (ph.kind === 'reveal' && age > dbg().game.total() + 1500) { done = true; say(id, { t: 'rwDone' }); }
      }
      // mode "alle": every bot imitates the speaker's word, claps for the others, and the speaker says go
      if (st.cfg.modus === 'alle') {
        if (ph.kind === 'listen' && !done && botIds.includes(id) && age > dbg().game.total() + 900) { done = true; say(id, { t: 'rwDone' }); }
        if (ph.kind === 'rec') botIds.forEach((b, k) => {
          if (did[b] || (ph.turn !== null && ph.turn !== b) || age < (ph.turn !== null ? 1200 : 1500 + k * 1100)) return;
          did[b] = 1; say(b, { t: 'rwClip', pcm: VoiceClip.pack(imitate(dbg().clips[ph.a].x, b * 7 + st.t * 13)) });
        });
        if (ph.kind === 'show' && dbg().game.playing(now) === null && age > 700) botIds.forEach((b, k) => { if (Math.random() < 0.06 + 0.03 * ((b + ph.i) % 3)) say(b, { t: 'rwClap' }); });
        return;
      }
      if (!done && ph.kind === 'vote' && age > 1500) { done = true; botIds.forEach((b, k) => { const o = dbg().game.view(b, now).options; if (o.length) say(b, { t: 'rwVote', i: o[k % o.length].i }); }); }
    }
    // ?autorec=1: press the phone's record button whenever it is ready and stop after 1.5 s. With a browser that
    // fakes the microphone (Firefox: media.navigator.streams.fake) this runs the whole chain without a person
    let pressing = false;
    function autorec() {
      const b = $('rwRec');
      if (pressing || b.style.display === 'none' || b.disabled || window.Mic.recording()) return;
      pressing = true; b.click();
      setTimeout(() => { if (window.Mic.recording()) b.click(); pressing = false; }, 1500);
    }
    function frame() { bots(performance.now()); if (q.get('autorec')) autorec(); game.render(); }
    if (simMs > 0) for (let t = 0; t < simMs; t += 16.7) { fake += 16.7; frame(); }
    (function loop() { if (simMs > 0) fake += 16.7; frame(); requestAnimationFrame(loop); })();
    document.title = 'RUECKWAERTS-RUNNING';
  } catch (e) { devFail('Boot-Fehler: ' + (e.stack || e.message)); }
</script>
</body>
</html>
