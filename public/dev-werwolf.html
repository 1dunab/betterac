<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Werwolf TV Dev</title>
<!-- TV harness for Werwolfnacht: stubbed shell, bot phones that answer the glue's messages.
     ?n=5..16 players  &fast=0.1 (WW_TIME_SCALE)  &seed=2 (deterministic Math.random)
     &sim=<ms>&freeze=1 fake clock, run <ms> ahead, then stop   &until=<phase[.sub]>&after=<ms> run until a phase
     (roles night.A night.B dawn hunter day vote.collect vote.reveal runoff.collect verdict end), then <ms> more
     &view=roster|chronik (end screen)  &reveal=0  &voice=1  &talk=<s>  &again=1 (host rematches)
     The page title shows the current phase ("WW:day") so screenshots can be targeted:
     firefox --headless --no-remote --profile /tmp/ffp --window-size=1000,720 \
       --screenshot out.png "http://localhost:3000/dev-werwolf.html?n=8&fast=0.1&until=dawn&after=1500&freeze=1&seed=2" -->
<style>
  html,body { margin:0; background:#0a0a14; }
  /* keep identical to the canvas rule in screen.html */
  canvas { background:#0d0d1a; border-radius:10px; box-shadow:0 0 50px rgba(120,90,255,.18);
           max-width:calc(100vw - 20px); max-height:calc(100vh - 84px); width:auto; height:auto; }
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<script>window.__AC_ROLE__ = 'screen';</script>
<script src="core/sfx.js"></script>
<script src="core/game-registry.js"></script>
<script>
  // ---- query ----
  const q = new URLSearchParams(location.search);
  const N = Math.max(5, Math.min(16, parseInt(q.get('n') || '8', 10) || 8));
  window.WW_TIME_SCALE = parseFloat(q.get('fast') || '1') || 1;
  const simMs = parseInt(q.get('sim') || '0', 10), until = q.get('until'), afterMs = parseInt(q.get('after') || '0', 10);
  const freeze = q.get('freeze') === '1';
  if (q.get('seed')) {                       // deterministic Math.random (mulberry32)
    let a = parseInt(q.get('seed'), 10) | 0;
    Math.random = function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  let fake = 1000;
  if (simMs > 0 || until) performance.now = () => fake;   // fake clock for fast-forwarding

  // ---- shell stubs ----
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const COLORS = ['#ff2d55', '#0a84ff', '#30d158', '#ffd60a', '#bf5af2', '#64d2ff', '#ff9f0a', '#ac8e68', '#ff6482', '#a2f45a', '#5e5ce6', '#ffb340', '#40c8e0', '#ff7aa8', '#8be9a8', '#d0a0ff'];
  const NAMES = ['Anna', 'Ben', 'Cleo', 'Dennis', 'Emil', 'Finn', 'Greta', 'Hannes', 'Ida', 'Jonas', 'Kira', 'Lukas', 'Mia', 'Nele', 'Oskar', 'Paula'];
  const players = {};
  const IDS = [];
  for (let i = 1; i <= N; i++) { players[i] = { color: COLORS[i - 1], name: NAMES[i - 1], named: true }; IDS.push(i); }
  const nameOf = (id) => players[id] ? players[id].name : 'Spieler ' + id;
  const shortName = nameOf;
  const hostId = () => { const k = Object.keys(players).map(Number); return k.length ? Math.min(...k) : null; };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function setBanner(t) { console.log('BANNER:', t); }
  function reportWinners(ids) { console.log('Sieger:', ids); window.__winners = ids; }
  function endToLobby(m) { document.title = 'LOBBY:' + m; console.log('endToLobby:', m); }
  function rr(o, x, y, w, h, r) { o.beginPath(); o.moveTo(x + r, y); o.arcTo(x + w, y, x + w, y + h, r); o.arcTo(x + w, y + h, x, y + h, r); o.arcTo(x, y + h, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath(); }
  function fitFont(o, text, max, start) { let f = start; o.font = 'bold ' + f + 'px system-ui,sans-serif'; while (o.measureText(text).width > max && f > 10) { f -= 2; o.font = 'bold ' + f + 'px system-ui,sans-serif'; } return f; }

  // ---- bots: a tiny scheduler on performance.now() (works with the fake clock too) ----
  const events = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const later = (ms, fn) => events.push({ due: performance.now() + ms * window.WW_TIME_SCALE, fn });
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const toGame = (id, d) => { if (window.__game) window.__game.onMessage(id, d); };
  const log = [];
  const ac = {
    message(id, d) {
      log.push([id, d]); if (log.length > 400) log.shift();
      const g = window.__game;
      if (d.t === 'wwRole') later(rnd(300, 3000), () => toGame(id, { t: 'wwReady' }));
      else if (d.t === 'wwTask') {
        later(rnd(600, 5000), () => {
          const o = d.options.map((p) => p.id);
          if (d.kind === 'cupid') { const a = shuffle(o.slice()); toGame(id, { t: 'wwAct', targets: [a[0], a[1]] }); }
          else if (d.kind === 'witch') toGame(id, { t: 'wwAct', heal: !!d.canHeal && Math.random() < 0.5, poison: d.canPoison && Math.random() < 0.25 ? pick(o) : null });
          else toGame(id, { t: 'wwAct', target: pick(o) });
        });
      } else if (d.t === 'wwPhase' && d.phase === 'day' && d.alive) {
        if (Math.random() < 0.7) later(rnd(1000, 9000), () => toGame(id, { t: 'wwTalkReady' }));
      } else if (d.t === 'wwBallot') {
        later(rnd(500, 6000), () => toGame(id, { t: 'wwVote', target: Math.random() < 0.1 ? null : pick(d.options).id }));
      } else if (d.t === 'wwShootTask') {
        later(rnd(800, 4000), () => toGame(id, { t: 'wwShoot', target: pick(d.options).id }));
      } else if (d.t === 'wwEnd' && d.host && q.get('again') === '1') {
        later(rnd(9000, 12000), () => toGame(id, { t: 'wwAgain' }));
      }
    }
  };
  function runBots() {
    const t = performance.now();
    for (let i = events.length - 1; i >= 0; i--) if (events[i].due <= t) { const e = events.splice(i, 1)[0]; e.fn(); }
  }

  function devFail(msg) {
    ctx.fillStyle = '#300'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'left';
    String(msg).match(/.{1,70}/g).forEach((line, i) => ctx.fillText(line, 20, 60 + i * 30));
    console.error(msg);
  }
  window.addEventListener('error', (e) => devFail('JS-Fehler: ' + e.message));
</script>
<script src="games/werwolf/meta.js"></script>
<script src="games/werwolf/rules.js"></script>
<script src="games/werwolf/narrator.js"></script>
<script src="games/werwolf/village.js"></script>
<script src="games/werwolf/screen.js"></script>
<script>
  try {
    const cfg = {};
    const sch = window.GAME_META.werwolf.settings;
    for (const k in sch) cfg[k] = sch[k].default;
    cfg.voice = q.get('voice') === '1' ? 'on' : 'off';
    if (q.get('reveal') === '0') cfg.reveal = 'off';
    cfg.talk = parseInt(q.get('talk') || '60', 10);

    const game = window.GAMES.werwolf();
    window.__game = game;
    game.start(IDS, cfg);
    if (q.get('view')) game._endView(q.get('view'));

    const key = () => { const d = game._debug(); return d.phase + (d.sub ? '.' + d.sub : ''); };
    const step = (dt) => { fake += dt; runBots(); game.render(); document.title = 'WW:' + key(); };
    const DT = 16.7;

    if (until) {
      let n = 0;
      while (key() !== until && key().split('.')[0] !== until && n++ < 400000) step(DT);
      const extra = Math.max(afterMs, 0);
      for (let t = 0; t < extra; t += DT) step(DT);
      if (!freeze) (function loop() { step(DT); requestAnimationFrame(loop); })();
    } else if (simMs > 0) {
      for (let t = 0; t < simMs; t += DT) step(DT);
      if (!freeze) (function loop() { step(DT); requestAnimationFrame(loop); })();
    } else {
      (function loop() { runBots(); game.render(); document.title = 'WW:' + key(); requestAnimationFrame(loop); })();
    }
    if (!document.title.startsWith('WW:')) document.title = 'WW:' + key();
  } catch (e) { devFail('Boot-Fehler: ' + (e.stack || e.message)); }
</script>
</body>
</html>
