            ?fire=unload,strike,... (fire those events once after warm-up)  ?events=1 (fake mode: run the scripted fx events, default on)
     headless:  firefox --headless --no-remote --profile /tmp/p --window-size=1600,1000 --screenshot out.png \

</head>

      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(4, 24, ctx.measureText(txt).width + 10, 18); ctx.fillStyle = '#fd9'; ctx.fillText(txt, 9, 28);
    }
    if (fxWarn.length) { ctx.font = '12px monospace'; fxWarn.slice(0, 2).forEach((w, i) => { const l = w.replace(/\s+/g, ' ').slice(0, 190); ctx.fillStyle = 'rgba(120,0,0,.8)'; ctx.fillRect(4, 46 + i * 16, ctx.measureText(l).width + 10, 16); ctx.fillStyle = '#fff'; ctx.fillText(l, 9, 48 + i * 16); }); }
    ctx.restore();
  }

  // ---- UI ----
  const bar = document.getElementById('bar'), fxbar = document.getElementById('fxbar');
  if (P('ui', '1') === '0') { bar.style.display = 'none'; fxbar.style.display = 'none'; }
  const mkBtn = (txt, fn, parent, cls) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = fn; if (cls) b.className = cls; (parent || bar).appendChild(b); return b; };
  const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = 1; sl.step = 0.005; sl.value = O.dayT; sl.style.width = '180px';
  const lbl = document.createElement('label'); lbl.append('dayT ', sl); const dv = document.createElement('span'); lbl.append(dv); bar.appendChild(lbl);
  const showDay = () => { dv.textContent = O.dayT.toFixed(2); sl.value = O.dayT; }; showDay();
  sl.oninput = () => { O.dayT = parseFloat(sl.value); showDay(); };
  const evBtns = {};
  for (const e of ['none', 'sturm', 'drachen', 'nacht']) evBtns[e] = mkBtn(e, () => { O.event = e; O.evT0 = tick * DT; for (const k in evBtns) evBtns[k].classList.toggle('on', k === e); }, bar, e === O.event ? 'on' : '');
  const bShield = mkBtn('Schild', () => { O.shield = !O.shield; bShield.classList.toggle('on', O.shield); if (O.shield) view.event({ t: 'shieldOn' }, stateNow()); }, bar, O.shield ? 'on' : '');
  const bQ = mkBtn('Qualität: ' + quality, () => { quality = quality === 'high' ? 'low' : 'high'; view.setQuality(quality); cv.width = view.W; cv.height = view.H; bQ.textContent = 'Qualität: ' + quality; }, bar);
  mkBtn('Intro', () => { introT0 = vnow; O.sink = false; view.sinkT0 = null; });
  const bP = mkBtn('Pause', () => { paused = !paused; bP.classList.toggle('on', paused); }, bar, paused ? 'on' : '');
  const hz = document.createElement('input'); hz.type = 'range'; hz.min = 0; hz.max = 100; hz.value = O.herz; hz.style.width = '90px'; hz.oninput = () => { O.herz = parseFloat(hz.value); };
  const hl = document.createElement('label'); hl.append('Herz ', hz); bar.appendChild(hl);
  const bA = mkBtn('Tag läuft', () => { O.auto = !O.auto; bA.classList.toggle('on', O.auto); }, bar, O.auto ? 'on' : '');
  if (SRC === 'sim') { sl.disabled = hz.disabled = true; for (const k in evBtns) evBtns[k].disabled = true; }
  const NAMES = ['unload', 'harvest', 'spray', 'strikeWarn', 'strike', 'stun', 'shieldOn', 'shieldOff', 'dragonFire', 'harpoon', 'cannon', 'buildDone', 'horn', 'sink', 'dock', 'undock', 'drop', 'pickup', 'fireStart', 'fireOut', 'ruined', 'repair', 'gust', 'herzLow', 'dragonSpawn', 'dragonHit', 'dragonFlee', 'warn', 'eventStart', 'eventEnd', 'buildStart'];
  for (const n of NAMES) mkBtn(n, () => { const e = manualEvent(n, stateNow()); if (e) { if (n === 'sink') { O.sink = true; } view.event(e, stateNow()); } }, fxbar);

  // ---- run ----
  const target = parseFloat(P('t', '0')), bench = parseInt(P('bench', '0'), 10) | 0;
  const fireList = P('fire', '').split(',').filter(Boolean);
  const fireNow = () => { for (const n of fireList) { if (n === 'dispose') { view.dispose(); document.title = 'DISPOSED'; throw new Error('disposed ok (expected stop)'); }
    if (n === 'qswitch') { quality = quality === 'high' ? 'low' : 'high'; view.setQuality(quality); cv.width = view.W; cv.height = view.H; continue; } const e = manualEvent(n, stateNow()); if (e) { if (n === 'sink') O.sink = true; view.event(e, stateNow()); } } };
  if (target > 0 || bench > 0) {
    // virtual-clock fast-forward: step the source, only render the last second or so
    const N = Math.round(target * 30), RENDER_FROM = Math.max(0, N - 45);
    for (let i = 0; i < N; i++) {
      const evs = advance(); vnow += 1000 / 30;
      if (i >= RENDER_FROM - 30) for (const e of evs) view.event(e, stateNow());
      if (i >= RENDER_FROM) drawFrame(1, 1000 / 30, i === RENDER_FROM);
    }
    if (N === 0 || RENDER_FROM === N) drawFrame(1, 33, true);
    fireNow();
    if (fireList.length) for (let k = 0; k < parseInt(P('fireframes', '20'), 10); k++) { advance(); vnow += 1000 / 30; drawFrame(1, 1000 / 30, false); }
    if (bench > 0) {
      for (let k = 0; k < 20; k++) { advance(); vnow += 1000 / 30; drawFrame(1, 1000 / 30, false); }
      const ts = []; let calls = 0, tris = 0, cpu = [];
      for (let k = 0; k < bench; k++) {
        const evs = advance(); vnow += 1000 / 30; for (const e of evs) view.event(e, stateNow());
        const t0 = performance.now(); drawFrame(1, 1000 / 30, false); gl.finish(); ts.push(performance.now() - t0); calls = Math.max(calls, view.drawCalls); tris = Math.max(tris, view.triangles); cpu.push(view.lastMs);
      }
      const avg = ts.reduce((a, b) => a + b, 0) / ts.length, mx = Math.max(...ts), c = cpu.reduce((a, b) => a + b, 0) / cpu.length;
      hud(); ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(4, 26, 520, 20); ctx.fillStyle = '#ff9'; ctx.font = '13px monospace'; ctx.textBaseline = 'top';
      const msg = `BENCH ${quality} n=${bench} avg ${avg.toFixed(1)}ms max ${mx.toFixed(0)}ms (cpu ${c.toFixed(1)}) calls ${calls} tris ${tris}`;
      ctx.fillText(msg, 9, 30); console.log(msg); document.title = msg;
    } else { hud(); document.title = 'SKVIEW-READY'; }
    if (P('live', '0') === '1' && bench === 0) loop();
  } else {
    drawFrame(1, 33, true); fireNow(); loop();
    document.title = 'SKVIEW-RUNNING';
  }
  function loop() {
    let last = performance.now(), acc = 0;
    (function f() {
      const n = performance.now(), dt = Math.min(100, n - last); last = n;
      if (!paused) {
        vnow += dt; acc += dt / 1000;
        if (O.auto && SRC === 'fake') { O.dayT = (O.dayT + dt / 60000) % 1; showDay(); }
        let steps = 0;
        while (acc >= DT && steps++ < 6) { acc -= DT; for (const e of advance()) view.event(e, stateNow()); }
        if (acc > DT * 3) acc = 0;
      }
      drawFrame(clamp(acc / DT, 0, 1), paused ? 0 : dt, false);
      hud();
      requestAnimationFrame(f);
    })();
  }
} catch (e) { devFail('Boot-Fehler: ' + (e.stack || e.message)); }
</script>
</body>
