<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Meingame Dev</title>
<!-- TEMPLATE dev harness: copy to public/dev-<yourkey>.html and adapt.
     Runs your screen module standalone (no lobby, no phones): shell globals
     are stubbed, bots send inputs, and ?sim=<ms> fast-forwards the game with
     a fake clock — perfect for headless screenshots:
     firefox --headless --no-remote --profile /tmp/ffp --window-size=980,620 \
       --screenshot out.png "http://localhost:3000/dev-meingame.html?sim=20000" -->
<style>
  html,body { margin:0; background:#0a0a14; }
  /* keep identical to the canvas rule in screen.html — surfaces CSS conflicts early */
  canvas { background:#0d0d1a; border-radius:10px; box-shadow:0 0 50px rgba(120,90,255,.18);
           max-width:calc(100vw - 20px); max-height:calc(100vh - 84px); width:auto; height:auto; }
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<script>window.__AC_ROLE__ = 'screen';</script>
<script src="core/game-registry.js"></script>
<script>
  // ---- shell stubs ----
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const players = {
    1: { color: '#ff2d55', name: 'Anna', named: true },
    2: { color: '#0a84ff', name: 'Ben', named: true },
    3: { color: '#30d158', name: 'Cleo', named: true }
  };
  const nameOf = (id) => players[id] ? players[id].name : 'Spieler ' + id;
  const shortName = nameOf;
  const hostId = () => 1;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function setBanner(t) { console.log('BANNER:', t); }
  function endToLobby(m) { document.title = 'LOBBY:' + m; console.log('endToLobby:', m); }
  function rr(o, x, y, w, h, r) { o.beginPath(); o.moveTo(x + r, y); o.arcTo(x + w, y, x + w, y + h, r); o.arcTo(x + w, y + h, x, y + h, r); o.arcTo(x, y + h, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath(); }
  const ac = { message() {} };

  function devFail(msg) {
    ctx.fillStyle = '#300'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'left';
    String(msg).match(/.{1,70}/g).forEach((line, i) => ctx.fillText(line, 20, 60 + i * 30));
    console.error(msg);
  }
  window.addEventListener('error', (e) => devFail('JS-Fehler: ' + e.message));
</script>
<!-- your game (rename the folder!): -->
<script src="games/_template/meta.js"></script>
<script src="games/_template/screen.js"></script>
<script>
  try {
    const q = new URLSearchParams(location.search);
    const simMs = parseInt(q.get('sim') || '0', 10);
    let fake = 1000;
    if (simMs > 0) performance.now = () => fake;   // fake clock for fast-forwarding

    const game = window.GAMES.meingame();
    window.__game = game;
    game.start([1, 2, 3], { ziel: 30 });

    // ---- bots: simulate phone inputs via game.onMessage / _debug() ----
    function bots() {
      for (const id of [1, 2, 3]) {
        if (Math.random() < (id === 3 ? 0.05 : 0.12)) game.onMessage(id, { t: 'mgClick' });
      }
    }

    if (simMs > 0) {
      for (let t = 0; t < simMs; t += 16.7) { fake += 16.7; bots(); game.render(); }
      (function loop() { fake += 16.7; bots(); game.render(); requestAnimationFrame(loop); })();
    } else {
      for (let i = 0; i < 5; i++) game.render();
      (function loop() { bots(); game.render(); requestAnimationFrame(loop); })();
    }
    document.title = 'DEV-RUNNING';
  } catch (e) { devFail('Boot-Fehler: ' + (e.stack || e.message)); }
</script>
</body>
</html>
