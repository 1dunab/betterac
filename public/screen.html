<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawing Evolution — Screen</title>
<style>
  html,body { margin:0; background:#0a0a14; color:#eee; font-family:system-ui,sans-serif; height:100%; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px; }
  #info { font-size:14px; opacity:.75; }
  canvas { background:#0d0d1a; border-radius:10px; max-width:100%; box-shadow:0 0 50px rgba(120,90,255,.18); }
  #saveBtn { display:none; border:none; border-radius:12px; padding:12px 20px; font-size:16px; font-weight:700;
             background:#30d158; color:#06250f; cursor:pointer; }
  #saveBtn:active { filter:brightness(1.1); }
</style>
</head>
<body>
<div id="wrap">
  <div id="info">Drawing Evolution — öffne <b>/controller.html</b> auf den Handys</div>
  <canvas id="c" width="960" height="600"></canvas>
  <button id="saveBtn">💾 Evolution als Bild speichern</button>
</div>

<script>window.__AC_ROLE__ = 'screen';</script>
<script src="airconsole-local.js"></script>
<script>
  const ac = new AirConsole();
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const saveBtn = document.getElementById('saveBtn');

  const COLORS = ['#ff2d55','#0a84ff','#30d158','#ffd60a','#bf5af2','#64d2ff','#ff9f0a','#ac8e68'];

  const WORD_PACKS = {
    casual: [
      'Sonne','Mond','Baum','Haus','Auto','Fahrrad','Pizza','Banane','Roboter','Rakete',
      'Drache','Burg','Regenbogen','Schneemann','Krone','Geist','Vulkan','Insel','Leuchtturm','Brille',
      'Gitarre','Trommel','Fußball','Eistüte','Kaktus','Pilz','Ampel','Regenschirm','Kerze','Geschenk',
      'Ballon','Anker','Kompass','Schatzkarte','Brücke','Windmühle','Zelt','Heißluftballon','Ufo','Planet',
      'Komet','Blitz','Schneeflocke','Einhorn','Meerjungfrau','Hexe','Zauberer','Ritter','Pirat','Astronaut'
    ],
    tiere: [
      'Hund','Katze','Elefant','Giraffe','Löwe','Tiger','Affe','Zebra','Krokodil','Schlange',
      'Frosch','Pinguin','Eule','Fuchs','Bär','Igel','Eichhörnchen','Wal','Hai','Delfin',
      'Krake','Qualle','Schildkröte','Pferd','Kuh','Schwein','Schaf','Huhn','Ente','Biene',
      'Schmetterling','Marienkäfer','Spinne','Fledermaus','Kamel','Känguru','Faultier','Flamingo','Pfau','Eisbär'
    ],
    laender: [
      'Deutschland','Frankreich','Italien','Spanien','Portugal','England','Irland','Niederlande','Belgien','Schweiz',
      'Österreich','Griechenland','Türkei','Ägypten','Marokko','Nigeria','Kenia','Südafrika','Brasilien','Argentinien',
      'Mexiko','Kanada','USA','Kuba','Japan','China','Indien','Thailand','Australien','Neuseeland',
      'Russland','Schweden','Norwegen','Island','Polen','Finnland'
    ],
    versaut: [
      'Tanga','Stringtanga','Kondom','Dildo','Vibrator','Handschellen','Peitsche','Strapse','Reizwäsche','Dessous',
      'Stripperstange','Striptease','Lapdance','Zungenkuss','Knutschfleck','Morgenlatte','Nackedei','Hintern','Busen','Sexpuppe',
      'Liebesschaukel','Rotlichtviertel','Sexshop','Pornoheft','Domina','FKK-Strand','Nacktbaden','Höschen','Spanner','Aktmodell'
    ]
  };
  const MODE_LABELS = { casual: 'Casual', tiere: 'Tiere 🐾', laender: 'Länder 🌍', versaut: 'Versaut 🌶️', custom: 'Eigene Wörter ✍️' };
  const VALID_MODES = ['casual', 'tiere', 'laender', 'versaut', 'custom'];

  const RECAP_STEP_MS = 2600;

  let players = {};        // id -> {color, name, named}
  let state = 'lobby';     // lobby | collect | play | preRecap | recap
  let settings = { drawTime: 60, guessTime: 30, mode: 'casual' };

  let gameOrder = [], N = 0;
  let chains = [];
  let round = 0, subPhase = 'draw', assign = {}, subm = {};
  let deadline = 0, phaseMs = 1;
  let collectSubm = {};
  let recapChain = 0, recapShown = 1, recapAccum = 0;
  let banner = '', bannerUntil = 0;

  // --- Helfer ---
  const connectedIds = () => Object.keys(players).map(Number);
  const namedIds = () => connectedIds().filter(id => players[id].named);
  const nameOf = (id) => (players[id] && players[id].name) ? players[id].name : ('Spieler ' + id);
  const shortName = (id) => { const nm = nameOf(id); return nm.length > 9 ? nm.slice(0, 8) + '…' : nm; };
  const hostId = () => { const n = namedIds(); if (n.length) return Math.min(...n); const c = connectedIds(); return c.length ? Math.min(...c) : null; };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const chainFor = (p, r) => ((p - r) % N + N) % N;
  function setBanner(t, ms) { banner = t; bannerUntil = performance.now() + (ms || 4000); }

  // --- Lobby / Reset / Phasen-Mitteilungen ---
  function lobbyMsg(id, h) {
    return { t: 'lobby', host: id === h, color: players[id].color, player: id, name: nameOf(id),
             drawTime: settings.drawTime, guessTime: settings.guessTime, mode: settings.mode, playerCount: namedIds().length };
  }
  function sendLobby() { const h = hostId(); namedIds().forEach(id => ac.message(id, lobbyMsg(id, h))); }
  function sendLobbyOne(id) { if (players[id] && players[id].named) ac.message(id, lobbyMsg(id, hostId())); }
  function sendPreRecap() { const h = hostId(); connectedIds().forEach(id => ac.message(id, { t: 'prerecap', host: id === h })); }
  function sendRecapViews() { const h = hostId(); connectedIds().forEach(id => ac.message(id, { t: 'recap', host: id === h })); }
  function resetToLobby(keepChains) { state = 'lobby'; gameOrder = []; if (!keepChains) chains = []; sendLobby(); }
  function abortToLobby(msg) { setBanner(msg, 6000); resetToLobby(false); }

  // --- Spielstart ---
  function beginGame() {
    gameOrder = namedIds().sort((a, b) => a - b);
    N = gameOrder.length;
    if (N < 2) { resetToLobby(false); return; }
    connectedIds().filter(id => !gameOrder.includes(id)).forEach(id => ac.message(id, { t: 'wait' }));
    if (settings.mode === 'custom') enterCollect();
    else {
      const pack = WORD_PACKS[settings.mode] || WORD_PACKS.casual;
      const words = shuffle(pack.slice()).slice(0, N);
      chains = gameOrder.map((id, c) => [{ type: 'word', by: null, word: words[c] }]);
      state = 'play'; startRound(0);
    }
  }

  function enterCollect() { state = 'collect'; collectSubm = {}; gameOrder.forEach(id => ac.message(id, { t: 'prompt' })); }
  let collectClosing = false;
  function finalizeCollect() {
    if (collectClosing) return; collectClosing = true;
    const fallback = shuffle(WORD_PACKS.casual.slice());
    chains = gameOrder.map((id, c) => {
      let w = (collectSubm[id] || '').trim();
      if (!w) w = fallback[c % fallback.length];
      return [{ type: 'word', by: id, word: w }];
    });
    collectClosing = false;
    state = 'play'; startRound(0);
  }

  function startRound(r) {
    round = r;
    subPhase = r % 2 === 0 ? 'draw' : 'guess';
    assign = {};
    gameOrder.forEach((id, p) => { assign[id] = chainFor(p, r); });
    subm = {};
    phaseMs = (subPhase === 'draw' ? settings.drawTime : settings.guessTime) * 1000;
    deadline = performance.now() + phaseMs;
    gameOrder.forEach(id => {
      const last = chains[assign[id]][chains[assign[id]].length - 1];
      if (subPhase === 'draw') ac.message(id, { t: 'draw', word: last.word, ms: phaseMs });
      else ac.message(id, { t: 'guess', strokes: last.strokes || [], ms: phaseMs });
    });
  }

  function submit(id, payload) {
    if (!gameOrder.includes(id) || (subm[id] && subm[id].done)) return;
    subm[id] = Object.assign({ done: true }, payload);
    ac.message(id, { t: 'wait' });
    if (gameOrder.every(p => subm[p] && subm[p].done)) finalizeRound();
  }

  let closing = false;
  function finalizeRound() {
    if (closing) return; closing = true;
    gameOrder.forEach(id => {
      const c = assign[id], s = subm[id];
      if (subPhase === 'draw') chains[c].push({ type: 'drawing', by: id, strokes: (s && s.strokes) || [] });
      else chains[c].push({ type: 'word', by: id, word: ((s && s.text) || '').trim() || '—' });
    });
    closing = false;
    if (round + 1 < N) startRound(round + 1);
    else { state = 'preRecap'; sendPreRecap(); }
  }

  function startRecap() { state = 'recap'; recapChain = 0; recapShown = 1; recapAccum = 0; sendRecapViews(); }
  function advanceRecap() {
    if (state !== 'recap') return;
    recapAccum = 0;
    const len = chains[recapChain].length;
    if (recapShown < len) recapShown++;
    else if (recapChain < N - 1) { recapChain++; recapShown = 1; }
    else { setBanner('🎉 Fertig! Bild speichern oder neue Runde starten.', 8000); resetToLobby(true); }
  }

  // --- Events ---
  ac.onConnect = (id) => {
    players[id] = { color: COLORS[(id - 1) % COLORS.length], name: 'Spieler ' + id, named: false };
    ac.message(id, { t: 'ask_name' });
    connectedIds().filter(o => o !== id).forEach(o => sendLobbyOne(o));
  };
  ac.onDisconnect = (id) => {
    const wasPlayer = gameOrder.includes(id);
    delete players[id];
    if ((state === 'play' || state === 'collect') && wasPlayer) abortToLobby('Ein Spieler hat die Verbindung verloren — zurück zur Lobby.');
    else if (state === 'preRecap') sendPreRecap();
    else if (state === 'recap') sendRecapViews();
    else if (state === 'lobby') sendLobby();
  };
  ac.onMessage = (id, d) => {
    if (!d || !d.t) return;
    if (d.t === 'name') {
      if (players[id]) { players[id].name = ((d.name || '').trim().slice(0, 14)) || ('Spieler ' + id); players[id].named = true; }
      if (state === 'lobby') sendLobby(); else ac.message(id, { t: 'wait' });
    } else if (d.t === 'config' && id === hostId()) {
      settings.drawTime = clamp(d.drawTime | 0, 10, 180);
      settings.guessTime = clamp(d.guessTime | 0, 10, 120);
      if (VALID_MODES.includes(d.mode)) settings.mode = d.mode;
      if (state === 'lobby') sendLobby();
    } else if (d.t === 'start' && id === hostId() && state === 'lobby') {
      if (namedIds().length >= 2) beginGame();
    } else if (d.t === 'word' && state === 'collect') {
      if (gameOrder.includes(id) && collectSubm[id] === undefined) {
        collectSubm[id] = (d.text || '').trim();
        ac.message(id, { t: 'wait' });
        if (gameOrder.every(p => collectSubm[p] !== undefined)) finalizeCollect();
      }
    } else if (d.t === 'drawing' && state === 'play' && subPhase === 'draw') {
      submit(id, { strokes: d.strokes });
    } else if (d.t === 'guess' && state === 'play' && subPhase === 'guess') {
      submit(id, { text: d.text });
    } else if (d.t === 'startRecap' && id === hostId() && state === 'preRecap') {
      startRecap();
    } else if (d.t === 'advance' && state === 'recap') {
      advanceRecap();
    } else if (d.t === 'save' && id === hostId()) {
      downloadEvolution();
    }
  };

  // --- generisches Zeichnen ---
  function drawStrokesOn(o, strokes, bx, by, bw, bh) {
    o.save(); o.fillStyle = '#fff'; o.fillRect(bx, by, bw, bh);
    o.beginPath(); o.rect(bx, by, bw, bh); o.clip();
    o.lineCap = 'round'; o.lineJoin = 'round';
    for (const s of (strokes || [])) {
      if (!s.p || !s.p.length) continue;
      o.strokeStyle = s.c; o.lineWidth = Math.max(1, s.w * bw);
      o.beginPath(); o.moveTo(bx + s.p[0][0] * bw, by + s.p[0][1] * bh);
      for (let i = 1; i < s.p.length; i++) o.lineTo(bx + s.p[i][0] * bw, by + s.p[i][1] * bh);
      if (s.p.length === 1) o.lineTo(bx + s.p[0][0] * bw + 0.5, by + s.p[0][1] * bh);
      o.stroke();
    }
    o.restore();
  }
  function rr(o, x, y, w, h, r) { o.beginPath(); o.moveTo(x + r, y); o.arcTo(x + w, y, x + w, y + h, r); o.arcTo(x + w, y + h, x, y + h, r); o.arcTo(x, y + h, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath(); }
  function fitFont(o, text, max, start) { let f = start; o.font = 'bold ' + f + 'px system-ui,sans-serif'; while (o.measureText(text).width > max && f > 10) { f -= 2; o.font = 'bold ' + f + 'px system-ui,sans-serif'; } return f; }

  function captionFor(e, i) {
    const who = e.by === null ? '' : nameOf(e.by);
    return (i === 0) ? (e.by === null ? 'Startwort' : (who + 's Wort'))
      : (e.type === 'drawing' ? (who + ' zeichnete') : (who + ' riet'));
  }

  // --- Evolution als PNG ---
  function buildEvolutionCanvas() {
    const margin = 40, titleH = 90, gap = 20, capH = 30, rowPad = 34, W = 1400;
    const maxN = Math.max(2, ...chains.map(c => c.length));
    const cw = Math.min(170, Math.floor((W - 2 * margin - (maxN - 1) * gap) / maxN));
    const rowH = cw + capH + rowPad;
    const H = titleH + chains.length * rowH + margin;
    const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
    const o = oc.getContext('2d');
    o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
    o.fillStyle = '#111'; o.textAlign = 'center'; o.textBaseline = 'middle';
    o.font = 'bold 42px system-ui,sans-serif'; o.fillText('Drawing Evolution', W / 2, titleH / 2);
    chains.forEach((ch, ci) => {
      const n = ch.length, totalW = n * cw + (n - 1) * gap;
      let x = (W - totalW) / 2; const y = titleH + ci * rowH;
      for (let i = 0; i < n; i++) {
        const e = ch[i];
        if (e.type === 'drawing') {
          o.strokeStyle = '#ccc'; o.lineWidth = 2; rr(o, x, y, cw, cw, 10); o.stroke();
          drawStrokesOn(o, e.strokes, x + 2, y + 2, cw - 4, cw - 4);
        } else {
          o.fillStyle = i === 0 ? '#fff6d6' : '#eef'; rr(o, x, y, cw, cw, 12); o.fill();
          o.strokeStyle = i === 0 ? '#e0b400' : '#bbc'; o.lineWidth = 2; rr(o, x, y, cw, cw, 12); o.stroke();
          o.fillStyle = '#111'; o.textAlign = 'center'; o.textBaseline = 'middle';
          o.font = 'bold ' + fitFont(o, e.word, cw - 16, 26) + 'px system-ui,sans-serif';
          o.fillText(e.word, x + cw / 2, y + cw / 2);
        }
        o.fillStyle = '#555'; o.font = '14px system-ui,sans-serif'; o.textAlign = 'center'; o.textBaseline = 'middle';
        o.fillText(captionFor(e, i), x + cw / 2, y + cw + capH / 2);
        if (i < n - 1) { o.fillStyle = '#999'; o.font = 'bold 22px system-ui,sans-serif'; o.fillText('→', x + cw + gap / 2, y + cw / 2); }
        x += cw + gap;
      }
    });
    return oc;
  }
  function downloadEvolution() {
    if (!chains.length) return;
    const a = document.createElement('a');
    a.href = buildEvolutionCanvas().toDataURL('image/png');
    a.download = 'drawing-evolution.png';
    document.body.appendChild(a); a.click(); a.remove();
  }
  saveBtn.addEventListener('click', downloadEvolution);

  // --- Render ---
  function chips(yPos) {
    const totalW = gameOrder.length * 120; let x = cv.width / 2 - totalW / 2 + 60;
    gameOrder.forEach(id => {
      const done = (state === 'collect') ? (collectSubm[id] !== undefined) : (subm[id] && subm[id].done);
      ctx.fillStyle = players[id] ? players[id].color : '#888'; ctx.globalAlpha = done ? 1 : 0.4;
      ctx.beginPath(); ctx.arc(x, yPos, 22, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(done ? '✓' : '…', x, yPos);
      ctx.fillStyle = '#bbb'; ctx.font = '13px system-ui,sans-serif'; ctx.fillText(shortName(id), x, yPos + 36);
      x += 120;
    });
  }

  function renderLobby() {
    ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px system-ui,sans-serif'; ctx.fillText('Drawing Evolution', cv.width / 2, 60);
    ctx.fillStyle = '#aaa'; ctx.font = '18px system-ui,sans-serif'; ctx.fillText('Modus: ' + (MODE_LABELS[settings.mode] || settings.mode), cv.width / 2, 96);
    ctx.fillStyle = '#888'; ctx.font = '16px system-ui,sans-serif'; ctx.fillText('Zeichenzeit ' + settings.drawTime + 's · Ratezeit ' + settings.guessTime + 's', cv.width / 2, 124);
    const list = namedIds().sort((a, b) => a - b), h = hostId();
    const joining = connectedIds().length - list.length;
    ctx.font = 'bold 22px system-ui,sans-serif';
    list.forEach((id, i) => {
      const y = 184 + i * 42;
      ctx.fillStyle = players[id].color; ctx.beginPath(); ctx.arc(cv.width / 2 - 150, y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.textAlign = 'left'; ctx.fillStyle = '#eee'; ctx.fillText(nameOf(id) + (id === h ? '  (Host)' : ''), cv.width / 2 - 125, y);
    });
    if (joining > 0) { ctx.textAlign = 'center'; ctx.fillStyle = '#888'; ctx.font = '15px system-ui,sans-serif'; ctx.fillText(joining + ' tippt noch einen Namen…', cv.width / 2, cv.height - 86); }
    ctx.textAlign = 'center'; ctx.fillStyle = list.length >= 2 ? '#30d158' : '#ff9f0a'; ctx.font = '20px system-ui,sans-serif';
    ctx.fillText(list.length >= 2 ? 'Host tippt am Handy auf START' : 'Warte auf mind. 2 Spieler…', cv.width / 2, cv.height - 56);
  }

  function renderCollect() {
    ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#bf5af2'; ctx.font = 'bold 40px system-ui,sans-serif'; ctx.fillText('💭 Denkt euch ein Wort aus!', cv.width / 2, 120);
    const done = gameOrder.filter(id => collectSubm[id] !== undefined).length;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 48px system-ui,sans-serif'; ctx.fillText(done + ' / ' + N + ' eingereicht', cv.width / 2, 240);
    chips(390);
    ctx.fillStyle = '#777'; ctx.font = '16px system-ui,sans-serif'; ctx.fillText('Es geht weiter, sobald alle ein Wort haben', cv.width / 2, 480);
  }

  function renderPlay() {
    ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, cv.width, cv.height);
    const remaining = Math.max(0, deadline - performance.now()), secs = Math.ceil(remaining / 1000), frac = clamp(remaining / phaseMs, 0, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = subPhase === 'draw' ? '#ffd60a' : '#64d2ff'; ctx.font = 'bold 44px system-ui,sans-serif';
    ctx.fillText(subPhase === 'draw' ? '✏️  ZEICHNEN' : '❓  RATEN', cv.width / 2, 80);
    ctx.fillStyle = '#888'; ctx.font = '20px system-ui,sans-serif'; ctx.fillText('Runde ' + (round + 1) + ' / ' + N, cv.width / 2, 124);
    const cx = cv.width / 2, cy = 270, R = 80;
    ctx.lineWidth = 12; ctx.strokeStyle = '#222'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = subPhase === 'draw' ? '#ffd60a' : '#64d2ff'; ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 52px system-ui,sans-serif'; ctx.fillText(secs, cx, cy);
    chips(430);
    ctx.fillStyle = '#777'; ctx.font = '16px system-ui,sans-serif';
    ctx.fillText(subPhase === 'draw' ? 'Zeichnet euer Wort auf dem Handy!' : 'Ratet, was das Bild zeigt!', cv.width / 2, 510);
  }

  function renderPreRecap() {
    ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#30d158'; ctx.font = 'bold 46px system-ui,sans-serif'; ctx.fillText('✅ Alle Runden geschafft!', cv.width / 2, cv.height / 2 - 30);
    ctx.fillStyle = '#ddd'; ctx.font = '22px system-ui,sans-serif';
    ctx.fillText('Host (' + nameOf(hostId() || 1) + ') startet den Rückblick am Handy', cv.width / 2, cv.height / 2 + 28);
  }

  function renderRecap() {
    ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 34px system-ui,sans-serif'; ctx.fillText('🎬 Evolution ' + (recapChain + 1) + ' / ' + N, cv.width / 2, 56);
    const ch = chains[recapChain], n = ch.length, gap = 22;
    const cw = Math.min(150, Math.floor((cv.width - 80 - (n - 1) * gap) / n));
    const totalW = n * cw + (n - 1) * gap; let x = (cv.width - totalW) / 2; const y = 230, capY = y + cw + 28;
    for (let i = 0; i < n; i++) {
      const e = ch[i], shown = i < recapShown;
      if (shown) {
        if (e.type === 'drawing') {
          ctx.save(); ctx.strokeStyle = '#444'; ctx.lineWidth = 2; rr(ctx, x, y, cw, cw, 10); ctx.stroke(); ctx.restore();
          drawStrokesOn(ctx, e.strokes, x + 2, y + 2, cw - 4, cw - 4);
        } else {
          ctx.fillStyle = '#1a1a2e'; rr(ctx, x, y, cw, cw, 12); ctx.fill();
          ctx.strokeStyle = i === 0 ? '#ffd60a' : '#555'; ctx.lineWidth = 2; rr(ctx, x, y, cw, cw, 12); ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = 'bold ' + fitFont(ctx, e.word, cw - 16, 26) + 'px system-ui,sans-serif';
          ctx.fillText(e.word, x + cw / 2, y + cw / 2);
        }
        ctx.fillStyle = e.by === null ? '#ffd60a' : (players[e.by] ? players[e.by].color : '#aaa');
        ctx.font = '14px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(captionFor(e, i), x + cw / 2, capY);
      } else { ctx.fillStyle = '#15151f'; rr(ctx, x, y, cw, cw, 10); ctx.fill(); }
      if (i < n - 1) {
        ctx.fillStyle = i < recapShown - 1 ? '#888' : '#333'; ctx.font = 'bold 22px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('→', x + cw + gap / 2, y + cw / 2);
      }
      x += cw + gap;
    }
    ctx.fillStyle = '#777'; ctx.font = '16px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Läuft automatisch weiter · „Weiter" am Handy springt vor', cv.width / 2, cv.height - 50);
  }

  function render() {
    if (state === 'lobby') renderLobby();
    else if (state === 'collect') renderCollect();
    else if (state === 'play') renderPlay();
    else if (state === 'preRecap') renderPreRecap();
    else if (state === 'recap') renderRecap();
    if (performance.now() < bannerUntil && banner) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, cv.height / 2 - 34, cv.width, 68);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 24px system-ui,sans-serif';
      ctx.fillText(banner, cv.width / 2, cv.height / 2);
    }
    saveBtn.style.display = (chains.length > 0 && state !== 'play' && state !== 'collect') ? 'inline-block' : 'none';
  }

  setInterval(() => {
    const now = performance.now();
    if (state === 'play' && now >= deadline) finalizeRound();
    if (state === 'recap') { recapAccum += 120; if (recapAccum >= RECAP_STEP_MS) advanceRecap(); }
  }, 120);

  (function loop() { render(); requestAnimationFrame(loop); })();
  sendLobby();
</script>
</body>
</html>
