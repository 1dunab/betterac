<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Hub — Screen</title>
<style>
  html,body { margin:0; background:#0a0a14; color:#eee; font-family:system-ui,sans-serif; height:100%; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px; height:100%; box-sizing:border-box; }
  #info { font-size:14px; opacity:.75; }
  /* Interne Aufloesung bleibt 960x600; CSS skaliert proportional auf Fenstergroesse (Letterboxing). */
  canvas { background:#0d0d1a; border-radius:10px; box-shadow:0 0 50px rgba(120,90,255,.18);
           max-width:calc(100vw - 20px); max-height:calc(100vh - 84px); width:auto; height:auto; }
  #saveBtn { display:none; border:none; border-radius:12px; padding:12px 20px; font-size:16px; font-weight:700; background:#30d158; color:#06250f; cursor:pointer; }
  #saveBtn:active { filter:brightness(1.1); }
  #fsBtn, #muteBtn { position:fixed; top:10px; z-index:50; border:none; border-radius:10px; padding:8px 12px;
           font-size:18px; background:rgba(255,255,255,.12); color:#eee; cursor:pointer; transition:opacity .4s; }
  #fsBtn { right:10px; }
  #muteBtn { right:58px; }
  #fsBtn:hover, #muteBtn:hover { background:rgba(255,255,255,.25); }
  /* Nach 3s Maus-Ruhe: Cursor und Ecken-Buttons ausblenden (TV-Modus) */
  body.idle { cursor:none; }
  body.idle #fsBtn, body.idle #muteBtn { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<button id="fsBtn" title="Vollbild">⛶</button>
<button id="muteBtn" title="Ton an/aus">🔊</button>
<div id="wrap">
  <div id="info">Party Hub — öffne <b>/controller.html</b> auf den Handys</div>
  <canvas id="c" width="960" height="600"></canvas>
  <button id="saveBtn">💾 Evolution als Bild speichern</button>
</div>

<script>window.__AC_ROLE__ = 'screen';</script>
<script type="module">import * as THREE from './vendor/three.module.min.js'; window.THREE = THREE;</script>
<script src="vendor/qrcode.js"></script>
<script src="airconsole-local.js?v=20260920-ffa-1"></script>
<script src="core/wakelock.js"></script>
<script src="core/sfx.js"></script>
<script src="core/game-registry.js"></script>
<script>
  const ac = new AirConsole({ deferConnect: true });
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const saveBtn = document.getElementById('saveBtn');
  const COLORS = ['#ff2d55','#0a84ff','#30d158','#ffd60a','#bf5af2','#64d2ff','#ff9f0a','#ac8e68'];

  // ===== Shell-Status =====
  let players = {};                 // id -> {color, name, named}
  let shell = { state: 'lobby', selected: 'lightcycles' };
  const gameCfg = {};               // key -> aktuelle Settings-Werte (Schema in GAME_META)
  let active = null, activeKey = null;
  let banner = '', bannerUntil = 0;
  let nightScore = {};              // Abend-Wertung: id -> {name, pts} (Siege des Abends)
  let champion = null, confetti = [];

  const GAME_LIST = window.GAME_LIST;
  const GAME_META = window.GAME_META;
  const GAMES = window.GAMES;

  // ===== Shell-Helfer =====
  const connectedIds = () => Object.keys(players).map(Number);
  const namedIds = () => connectedIds().filter(id => players[id].named);
  const nameOf = (id) => (players[id] && players[id].name) ? players[id].name : ('Spieler ' + id);
  const shortName = (id) => { const n = nameOf(id); return n.length > 9 ? n.slice(0, 8) + '…' : n; };
  const hostId = () => { const n = namedIds(); if (n.length) return Math.min(...n); const c = connectedIds(); return c.length ? Math.min(...c) : null; };
  const minFor = (key) => (GAME_LIST.find(g => g.key === key) || {}).min || 1;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function setBanner(t, ms) { banner = t; bannerUntil = performance.now() + (ms || 5000); }

  // Settings: Schema kommt aus meta.js, hier nur Werte halten/clampen
  function cfgFor(key) {
    if (!gameCfg[key]) {
      const c = {}, s = (GAME_META[key] || {}).settings || {};
      for (const f in s) c[f] = s[f].default;
      gameCfg[key] = c;
    }
    return gameCfg[key];
  }
  function applyCfg(key, incoming) {
    const s = (GAME_META[key] || {}).settings || {}, c = cfgFor(key);
    for (const f in s) {
      if (!incoming || !(f in incoming)) continue;
      const def = s[f];
      if (def.type === 'number') c[f] = clamp(incoming[f] | 0, def.min, def.max);
      else if (def.type === 'text') c[f] = String(incoming[f] == null ? '' : incoming[f]).slice(0, def.max || 100);
      else if ((def.options || []).some(o => o.v === incoming[f])) c[f] = incoming[f];
    }
  }

  // Spieleabend-Wertung: Spiele melden hier ihre Sieger (+1 pro gewonnener Partie).
  // Team-/Co-op-Siege einfach mit mehreren IDs melden. Unbekannte IDs werden ignoriert.
  window.reportWinners = function (ids) {
    (ids || []).forEach(id => {
      if (!players[id]) return;
      const e = nightScore[id] || (nightScore[id] = { name: nameOf(id), pts: 0 });
      e.name = nameOf(id); e.pts++;
    });
  };
  function nightStandings() {
    return Object.keys(nightScore).map(id => nightScore[id]).sort((a, b) => b.pts - a.pts);
  }

  // generische Zeichen-Helfer (für Drawing-Render + PNG-Export)
  function drawStrokesOn(o, strokes, bx, by, bw, bh) {
    o.save(); o.fillStyle = '#fff'; o.fillRect(bx, by, bw, bh);
    o.beginPath(); o.rect(bx, by, bw, bh); o.clip();
    o.lineCap = 'round'; o.lineJoin = 'round';
    for (const s of (strokes || [])) {
      if (!s.p || !s.p.length) continue;
      o.strokeStyle = s.c; o.lineWidth = Math.max(1, s.w * bw);
      o.beginPath(); o.moveTo(bx + s.p[0][0] * bw, by + s.p[0][1] * bh);
      for (let i = 1; i < s.p.length; i++) o.lineTo(bx + s.p[i][0] * bw, by + s.p[i][1] * bh);
      if (s.p.length === 1) o.lineTo(bx + s.p[0][0] * bw + 0.5, by + s.p[0][1] * bh);
      o.stroke();
    }
    o.restore();
  }
  function rr(o, x, y, w, h, r) { o.beginPath(); o.moveTo(x + r, y); o.arcTo(x + w, y, x + w, y + h, r); o.arcTo(x + w, y + h, x, y + h, r); o.arcTo(x, y + h, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath(); }
  function fitFont(o, text, max, start) { let f = start; o.font = 'bold ' + f + 'px system-ui,sans-serif'; while (o.measureText(text).width > max && f > 10) { f -= 2; o.font = 'bold ' + f + 'px system-ui,sans-serif'; } return f; }

  // ===== Lobby-Snapshot: übersteht Screen-Reload (F5/Crash) im selben Tab =====
  let snapshot = null, snapshotApplied = false;
  try {
    const s = JSON.parse(sessionStorage.getItem('shellSnapshot') || 'null');
    if (s && s.players && Date.now() - s.t < 3 * 3600 * 1000) snapshot = s;
  } catch (e) {}
  function saveShellSnapshot() {
    try {
      const ps = {};
      connectedIds().forEach(id => { if (players[id].named) ps[id] = { name: players[id].name, color: players[id].color }; });
      sessionStorage.setItem('shellSnapshot', JSON.stringify({ t: Date.now(), players: ps, selected: shell.selected, cfg: gameCfg, night: nightScore }));
    } catch (e) {}
  }

  // ===== Shell-Nachrichten an Controller =====
  function sendLobby() {
    saveShellSnapshot();
    const h = hostId();
    namedIds().forEach(id => ac.message(id, {
      t: 'shell', cmd: 'lobby', host: id === h, name: nameOf(id), player: id,
      selected: shell.selected, games: GAME_LIST, cfg: cfgFor(shell.selected),
      playerCount: namedIds().length, minOk: namedIds().length >= minFor(shell.selected),
      night: Object.keys(nightScore).length > 0,
      roster: namedIds().sort((a, b) => a - b).map(p => ({ id: p, name: nameOf(p), color: players[p].color }))
    }));
  }
  function sendHostUpdate() { const h = hostId(); connectedIds().forEach(id => ac.message(id, { t: 'shell', cmd: 'host', host: id === h })); }

  // ===== Spielstart / Abbruch =====
  function startGame(key) {
    if (!GAMES[key]) return;
    activeKey = key; active = GAMES[key]();
    shell.state = 'playing';
    const h = hostId();
    namedIds().forEach(id => ac.message(id, { t: 'shell', cmd: 'enterGame', game: key, host: id === h }));
    sfx('whoosh');
    active.start(namedIds().sort((a, b) => a - b), cfgFor(key));
  }
  function endToLobby(msg) {
    if (active && active.stop) active.stop();
    active = null; activeKey = null; shell.state = 'lobby';
    sfx.ambient(null); // Spiel-Ambient endet mit dem Spiel
    if (msg) setBanner(msg, 6000);
    sendLobby();
  }

  // ===== Vollbild + Cursor-Auto-Hide (TV-Modus) =====
  document.getElementById('fsBtn').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) {}
  });
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.textContent = sfx.muted ? '🔇' : '🔊';
  muteBtn.addEventListener('click', () => {
    sfx.setMuted(!sfx.muted);
    muteBtn.textContent = sfx.muted ? '🔇' : '🔊';
    sfx('pop'); // hörbares Feedback beim Einschalten (und Autoplay-Freischaltung)
  });
  let idleTimer = null;
  function wakeUi() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  }
  document.addEventListener('mousemove', wakeUi);
  wakeUi();

  // ===== Events =====
  ac.onKicked = () => {
    document.getElementById('info').textContent = '⚠️ Ein anderer Screen hat übernommen — dieses Fenster ist inaktiv.';
  };
  ac.onConnect = (id) => {
    // Nach Screen-Reload: bekannte Spieler aus dem Snapshot wiederherstellen
    // statt alle neu nach Namen zu fragen (Spiel-Auswahl + Settings gleich mit)
    const snap = snapshot && snapshot.players[id];
    if (snap && !active) {
      if (!snapshotApplied) {
        snapshotApplied = true;
        if (snapshot.selected && GAMES[snapshot.selected]) shell.selected = snapshot.selected;
        if (snapshot.cfg) Object.keys(snapshot.cfg).forEach(k => { if (GAME_META[k]) applyCfg(k, snapshot.cfg[k]); });
        if (snapshot.night) nightScore = snapshot.night; // Abend-Wertung überlebt den Reload mit
      }
      players[id] = { color: snap.color || COLORS[(id - 1) % COLORS.length], name: String(snap.name || '').slice(0, 14) || ('Spieler ' + id), named: true };
      sendLobby();
      return;
    }
    players[id] = { color: COLORS[(id - 1) % COLORS.length], name: 'Spieler ' + id, named: false };
    ac.message(id, { t: 'shell', cmd: 'name' });
    connectedIds().filter(o => o !== id && players[o].named).forEach(o => { if (shell.state === 'lobby') sendLobby(); });
  };
  ac.onDisconnect = (id) => {
    const wasNamed = players[id] && players[id].named;
    delete players[id];
    if (active) {
      if (active.onDisconnect) active.onDisconnect(id);
      if (active) sendHostUpdate();           // Host könnte gewechselt haben
    } else if (shell.state === 'lobby' && wasNamed) sendLobby();
  };
  ac.onMessage = (id, d) => {
    if (!d) return;
    if (d.t === 'shellSync') {
      if (!players[id] || !players[id].named) return;
      if (!active) sendLobby();
      else if (active.canResume && active.canResume(id)) {
        ac.message(id, { t: 'shell', cmd: 'enterGame', game: activeKey, host: id === hostId() });
        active.onReconnect(id);
      }
    } else if (d.t === 'shellName') {
      if (players[id]) { players[id].name = ((d.name || '').trim().slice(0, 14)) || ('Spieler ' + id); players[id].named = true; sfx('pop'); }
      if (!active) sendLobby();
      else if (active.acceptsJoin) { active.onConnect && active.onConnect(id); ac.message(id, { t: 'shell', cmd: 'enterGame', game: activeKey, host: id === hostId() }); }
      else ac.message(id, { t: 'shell', cmd: 'spectate', host: id === hostId() });
    } else if (d.t === 'shellSelect' && id === hostId() && !active) {
      if (GAMES[d.game]) { shell.selected = d.game; sfx('tick'); sendLobby(); }
    } else if (d.t === 'shellConfig' && id === hostId() && !active) {
      if (d.game === shell.selected) { applyCfg(d.game, d.cfg); sendLobby(); }
    } else if (d.t === 'shellStart' && id === hostId() && !active) {
      if (namedIds().length >= minFor(shell.selected)) startGame(shell.selected);
    } else if (d.t === 'shellKick' && id === hostId() && !active) {
      // Host-Tool: Spieler entfernen (sich selbst nicht — Host-Wechsel liefe ins Leere)
      const tgt = d.id | 0;
      if (tgt !== id && players[tgt]) { setBanner(nameOf(tgt) + ' wurde vom Host entfernt', 5000); ac.kick(tgt); }
    } else if (d.t === 'shellRename' && id === hostId() && !active) {
      const tgt = d.id | 0, n = String(d.name || '').trim().slice(0, 14);
      if (players[tgt] && n) {
        players[tgt].name = n;
        if (nightScore[tgt]) nightScore[tgt].name = n; // Abend-Wertung folgt mit
        sendLobby();
      }
    } else if (d.t === 'shellNight' && id === hostId() && !active) {
      // Feierabend: Champion küren, Abend-Wertung zurücksetzen
      const st = nightStandings();
      if (st.length) {
        champion = { list: st.slice(0, 3), until: performance.now() + 9000 };
        confetti = Array.from({ length: 120 }, () => ({
          x: Math.random() * cv.width, y: -20 - Math.random() * cv.height,
          vy: 60 + Math.random() * 90, vx: (Math.random() - 0.5) * 40,
          size: 4 + Math.random() * 5, rot: Math.random() * Math.PI,
          color: COLORS[(Math.random() * COLORS.length) | 0]
        }));
        sfx('fanfare');
        nightScore = {};
        sendLobby(); // Snapshot + Feierabend-Button verschwindet
      }
    } else if (d.t === 'shellAbort' && id === hostId() && active) {
      endToLobby('');
    } else if (active && active.onMessage) {
      active.onMessage(id, d);
    }
  };

  // ===== Beitritts-QR: Handy-Kamera auf den TV halten statt IP abtippen =====
  let qrCanvas = null, joinUrl = '';
  function buildQr(host) {
    try {
      joinUrl = location.protocol + '//' + host + '/controller.html';
      const qr = qrcode(0, 'M');
      qr.addData(joinUrl);
      qr.make();
      const n = qr.getModuleCount(), cell = 4, pad = cell * 4; // Quiet Zone: 4 Module (Spec)
      qrCanvas = document.createElement('canvas');
      qrCanvas.width = qrCanvas.height = n * cell + pad * 2;
      const g = qrCanvas.getContext('2d');
      g.fillStyle = '#fff';
      g.fillRect(0, 0, qrCanvas.width, qrCanvas.height);
      g.fillStyle = '#000';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) g.fillRect(pad + c * cell, pad + r * cell, cell, cell);
      }
    } catch (e) { qrCanvas = null; }
  }
  if (/^(localhost|127\.)/.test(location.hostname) && typeof fetch === 'function') {
    // Screen läuft lokal auf dem Server-Rechner — LAN-IP für die Handys erfragen
    fetch('/info').then(r => r.json()).then(info => {
      if (info.ips && info.ips.length) buildQr(info.ips[0] + ':' + info.port);
      else buildQr(location.host);
    }).catch(() => buildQr(location.host));
  } else {
    buildQr(location.host);
  }

  // ===== Shell-Lobby-Render =====
  function renderLobby() {
    ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px system-ui,sans-serif'; ctx.fillText('🎉 Party Hub', cv.width / 2, 58);
    const sel = GAME_LIST.find(g => g.key === shell.selected) || GAME_LIST[0];
    ctx.fillStyle = '#bf5af2'; ctx.font = 'bold 26px system-ui,sans-serif'; ctx.fillText('Gewählt: ' + sel.label, cv.width / 2, 104);
    const schema = (GAME_META[shell.selected] || {}).settings || {};
    const parts = Object.keys(schema).map(f => {
      const def = schema[f], v = cfgFor(shell.selected)[f];
      if (def.when && !Object.entries(def.when).every(([key, value]) => cfgFor(shell.selected)[key] === value)) return null;
      if (def.type === 'choice') { const o = (def.options || []).find(o => o.v === v); return def.label + ': ' + (o ? o.label : v); }
      if (def.type === 'text') { const s = String(v || ''); return s ? (s.length > 40 ? s.slice(0, 39) + '…' : s) : null; }
      return def.label + ' ' + v + (def.unit || '');
    }).filter(Boolean);
    if (parts.length) {
      ctx.fillStyle = '#888'; ctx.font = '15px system-ui,sans-serif';
      ctx.fillText(parts.join(' · '), cv.width / 2, 134);
    }
    const list = namedIds().sort((a, b) => a - b), h = hostId();
    const joining = connectedIds().length - list.length;
    ctx.font = 'bold 20px system-ui,sans-serif';
    list.forEach((id, i) => {
      const col = 2, perCol = Math.ceil(list.length / col);
      const c = Math.floor(i / perCol), rIdx = i % perCol;
      const bx = cv.width / 2 - 200 + c * 220, y = 190 + rIdx * 40;
      ctx.fillStyle = players[id].color; ctx.beginPath(); ctx.arc(bx, y, 11, 0, Math.PI * 2); ctx.fill();
      ctx.textAlign = 'left'; ctx.fillStyle = '#eee'; ctx.fillText(nameOf(id) + (id === h ? ' ⭐' : ''), bx + 20, y);
      ctx.textAlign = 'center';
    });
    if (joining > 0) { ctx.fillStyle = '#888'; ctx.font = '15px system-ui,sans-serif'; ctx.fillText(joining + ' tippt noch einen Namen…', cv.width / 2, cv.height - 84); }
    // Beitritts-QR unten links
    if (qrCanvas) {
      const qx = 22, qy = cv.height - qrCanvas.height - 46;
      ctx.drawImage(qrCanvas, qx, qy);
      ctx.fillStyle = '#aaa'; ctx.font = 'bold 14px system-ui,sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('📱 Mitspielen:', qx, qy - 12);
      ctx.font = '12px system-ui,sans-serif'; ctx.fillStyle = '#777';
      ctx.fillText(joinUrl.replace(/^https?:\/\//, ''), qx, qy + qrCanvas.height + 16);
      ctx.textAlign = 'center';
    }
    const ok = list.length >= minFor(shell.selected);
    ctx.fillStyle = ok ? '#30d158' : '#ff9f0a'; ctx.font = '20px system-ui,sans-serif';
    ctx.fillText(ok ? '⭐ Host wählt das Spiel und tippt START' : ('Mind. ' + minFor(shell.selected) + ' Spieler für ' + sel.label + '…'), cv.width / 2, cv.height - 54);
    // Abend-Wertung rechts (Siege des Abends, Feierabend kürt den Champion)
    const st = nightStandings().slice(0, 8);
    if (st.length) {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffd60a'; ctx.font = 'bold 16px system-ui,sans-serif';
      ctx.fillText('🏆 Abend-Wertung', cv.width - 22, 180);
      ctx.font = '15px system-ui,sans-serif';
      st.forEach((e, i) => {
        ctx.fillStyle = i === 0 ? '#fff' : '#aaa';
        const n = e.name.length > 11 ? e.name.slice(0, 10) + '…' : e.name;
        ctx.fillText(n + '  ' + e.pts, cv.width - 22, 208 + i * 24);
      });
      ctx.textAlign = 'center';
    }
  }

  // ===== Feierabend: Champion-Zeremonie (9s, dann zurück zur Lobby) =====
  function renderChampion() {
    const now = performance.now();
    ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, cv.width, cv.height);
    confetti.forEach(p => {
      p.y += p.vy / 60; p.x += p.vx / 60; p.rot += 0.05;
      if (p.y > cv.height + 20) { p.y = -20; p.x = Math.random() * cv.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    });
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const top = champion.list[0];
    ctx.font = '80px system-ui,sans-serif'; ctx.fillText('👑', cv.width / 2, 150);
    ctx.fillStyle = '#ffd60a'; ctx.font = 'bold 28px system-ui,sans-serif';
    ctx.fillText('Champion des Abends', cv.width / 2, 230);
    ctx.fillStyle = '#fff'; fitFont(ctx, top.name, 700, 64);
    ctx.fillText(top.name, cv.width / 2, 300);
    ctx.fillStyle = '#aaa'; ctx.font = 'bold 24px system-ui,sans-serif';
    ctx.fillText(top.pts + (top.pts === 1 ? ' Sieg' : ' Siege'), cv.width / 2, 352);
    champion.list.slice(1).forEach((e, i) => {
      ctx.fillStyle = '#888'; ctx.font = 'bold 20px system-ui,sans-serif';
      ctx.fillText((i === 0 ? '🥈 ' : '🥉 ') + e.name + ' — ' + e.pts, cv.width / 2, 420 + i * 34);
    });
    if (now > champion.until) { champion = null; confetti = []; }
  }


  // ============================================================
  </script>

<script>
  // ===== Render-Schleife =====
  ac._connect();
  saveBtn.addEventListener('click', () => { if (active && active.save) active.save(); });
  (function loop() {
    if (active && active.render) active.render();
    else if (champion) renderChampion();
    else renderLobby();
    if (performance.now() < bannerUntil && banner) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, cv.height / 2 - 34, cv.width, 68);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 24px system-ui,sans-serif';
      ctx.fillText(banner, cv.width / 2, cv.height / 2);
    }
    if (active) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '13px system-ui,sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('Host kann am Handy abbrechen ✕', cv.width - 10, cv.height - 6); }
    saveBtn.style.display = (active && active.canSave && active.canSave()) ? 'inline-block' : 'none';
    requestAnimationFrame(loop);
  })();
</script>
