<title>Furt &amp; Fehde Phone Dev</title>
<!-- Phone dev page: runs the real Furt & Fehde controller.js (+ warmap.js, world.js) against a FAKE SCREEN that speaks the whole Phase 1 protocol
     (ffInfo with costs, rules, shared and bots · ffMap · ffLevel · ffPhase · ffYou with hunger, pacts, banners and food · ffBoard with ruins and the 13th field paused · ffAlert · ffToast · ffResult;
     it answers ffBuild/ffCancel/ffRecruit/ffBanner/ffHome/ffPact/ffPause/ffAgain). Costs come from FurtSim.CONST (sim.js), like the real glue sends them.
     Two modes in one file. The top page = fake screen + panel + an iframe sized like a phone; the iframe (same file, ?phone=1) is the phone,
     so orientation media queries are real.
     ?w=844&h=390 landscape (default) | ?w=390&h=844 portrait      ?seed=1 map seed      ?host=0 guest      ?lords=2|3|4 houses (2 = no pacts)      ?shared=Ben (a co-player in your house)
     Opened directly with ?phone=1 (on a real phone, or at the exact phone size for screenshots) the page runs phone AND fake screen in one window; the 🛠 button (bottom left) opens the panel.
     Presets (hide the panel unless panel=1; for headless screenshots):
       ?mode=bauen|truppen|banner|pakte  &L=0..1  &lord=0..3  &ghost=<building key>  &invalid=1 (ghost on a spot that breaks a rule)
       &drag=1 (freeze a banner-I drag at 62 % of the way to the Westfurt, with its route and snap label; drag=0.9 = 90 %, &to=<crossing id>)  &view=all|mine  &mud=1 (L just fell from 1: damp mud)  &crown=1 (👑, Ruhm 134)  &still=1 (no animation, frozen clocks)  &target=1..3
       &state=frieden|ebbe|fehde|letzte   phase chip: Burgfrieden 1:12 · Ebbe at L 0.6 · Fehde 7:00 · Letzte Minute 0:42 (the water level follows unless L= is given; &left=12 sets the seconds left)
       &state=pact (Pakte panel: active, offered, none)  &state=offer (Pakte panel with an incoming offer; &mode=bauen shows the prompt over the map instead)
       &ruin=kaserne (which own building is the ruin; default huette)  &state=card (card of the own Hof; &kind=holzfaeller|steinbruch|kaserne|… picks another)  &card=ruin|nowood|fire|<kind>  &state=cardruin (card of a ruin)
       &alert=attack|fire|hunger|plunder|crossing|pact|crown (also &state=alert)  &hunger=1 (no grain)
       &state=end (end screen as host, you come 2nd)  &state=endguest (as guest, you win)  &rank=1..4  &state=spectator (👀 Alle Burgen sind besetzt)
       &guide=1 (the ❓ guide, top)  &guide=gebaeude|korn|truppen|feuer|pakte|bots|ziel|ablauf (the guide scrolled to that section)
       &advice=1..10 (the advisor line shows tip n whatever the state says)   &food=low (the food balance turns red: +2 −9)   &card=paused (the card of a resting Steinbruch: 💤 ruht, ▶ Weiterarbeiten)
       &mode=banner&arm=1..3 (⚑ with that banner picked: gold ring and „Tippe aufs Ziel“)
       &place=brunnen (the well-coverage demo: a few more own wooden buildings out in the fields, two groups no well reaches yet, and the Brunnen ghost on the spot that protects the most of them; &dash=1 adds a Brunnen
         still being built, drawn dashed; &card=brunnen / &card=keep show the coverage with the card of the own Brunnen / castle open)
       &bench=drag (with &place=brunnen: 300 forced frames while the planned Brunnen jumps about, with and without the coverage layer; the result replaces the autotest line)
       &lager=1 (the 📦 Lager sheet is open; &lager=full: Korn and Stein are full, so their tips show)   &rules=0 (the fake screen sends no ffInfo.rules: the phone uses 12, 12, 30, 60, 60, 8, 4)
     ?wait=1 only activates the phone (waiting screen)
     ?auto=1 the fake clock drives the phases and the water (Burgfrieden → Ebbe → Fehde → Ende), &burg=20 a short truce, &speed=10 faster, &dauer=6 match minutes, &advance=130 fast-forwards 130 s before the first picture   ?legacy=1 sends only the Phase 0 messages (no costs, ffPhase, pacts; 9-field board rows)   ?costs=0 sends no costs (the phone falls back to the stale world.js drafts)
     ?autotest=1 plays the test steps through the real UI and prints AUTOTEST OK or the first failure (on screen + console)
     firefox --headless --no-remote --profile <dir> --window-size=844,390 --screenshot out.png "http://localhost:3984/dev-furtfehde-phone.html?phone=1&state=offer&still=1" -->
<style>
  html, body { margin:0; height:100%; font-family:system-ui,sans-serif; color:#fff; background:#1a1a24;
               -webkit-user-select:none; user-select:none; touch-action:none; }
  .view { display:none; flex-direction:column; height:100%; box-sizing:border-box; }
  .view.on { display:flex; }
  .bar { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .word { font-size:22px; font-weight:800; }
  canvas { background:#fff; flex:1; min-height:0; border-radius:10px; margin:0 10px; touch-action:none; }   /* the shell's global canvas rule: the game must override it */

  #abortBtn { position:fixed; top:6px; right:8px; z-index:1000; display:none; border:none; border-radius:10px;
              padding:8px 12px; font-weight:800; font-size:15px; background:#ff3b30; color:#fff; }
  #devErr { position:fixed; left:0; right:0; bottom:0; z-index:2000; margin:0; padding:8px 10px; background:#b00020; color:#fff;
            font:12px/1.35 monospace; white-space:pre-wrap; pointer-events:none; }
  #devErr:empty { display:none; }
  /* top page */
  body.top { display:flex; gap:12px; padding:10px; box-sizing:border-box; align-items:flex-start; overflow:hidden; }
  #frameWrap { flex:none; border:3px solid #444; border-radius:18px; overflow:hidden; background:#000; }
  #frameWrap iframe { display:block; border:0; }
  #panel { flex:1; min-width:280px; height:100%; overflow:auto; touch-action:auto; -webkit-user-select:text; user-select:text; font-size:14px; }
  body.nopanel #panel { display:none; } body.nopanel { justify-content:center; }
  body.phone .topOnly { display:none; }
  body.phone #panel { position:fixed; left:0; top:0; right:0; bottom:0; z-index:3000; display:none; background:rgba(16,16,24,.98); padding:12px; box-sizing:border-box; min-width:0; }
  body.phone.panelopen #panel { display:block !important; }
  #devToggle { display:none; position:fixed; left:3px; bottom:3px; z-index:2500; width:30px; height:30px; border:none; border-radius:15px; background:rgba(20,20,30,.45); color:#fff; font-size:15px; padding:0; }
  body.phone.standalone #devToggle { display:block; }
  #panel h3 { margin:10px 0 5px; font-size:13px; opacity:.7; }
  #panel .btn { margin:0 5px 5px 0; padding:7px 10px; font-size:13px; }
  #panel .btn.on { background:#0a84ff; }
  #panel a.btn { display:inline-block; text-decoration:none; }
  #panel input[type=range] { width:230px; vertical-align:middle; }
  #panel label { font-size:12px; opacity:.85; }
  #log { font:11px/1.35 monospace; background:#000; padding:6px; height:230px; overflow:auto; white-space:pre-wrap; }
  #perf { font:12px monospace; color:#7fe3ff; margin:4px 0; min-height:30px; }
  #autoRes { font:800 22px/1.2 system-ui; margin:6px 0; min-height:28px; white-space:pre-wrap; }
  #autoRes.ok { color:#30d158; } #autoRes.fail { color:#ff6b5e; }
</style>

<body>
<script>
  const q = new URLSearchParams(location.search);
  const IS_PHONE = q.get('phone') === '1';
  const STANDALONE = IS_PHONE && window.parent === window;   // ?phone=1 opened directly (a real phone): the page brings its own fake screen
  document.body.classList.add(IS_PHONE ? 'phone' : 'top');
  const PW = Math.max(200, Math.min(2000, +q.get('w') || 844)), PH = Math.max(200, Math.min(2000, +q.get('h') || 390));
// ========== phone mode: shell globals the controller expects ==========
if (IS_PHONE) {
  if (q.get('still') === '1') document.head.insertAdjacentHTML('beforeend', '<style>*{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}</style>');
  document.body.insertAdjacentHTML('afterbegin', '<button id="abortBtn">✕ Abbrechen</button>');
  const $ = (id) => document.getElementById(id);
  window.$ = $;
  window.VIEWS = [];
  window.showView = (v) => VIEWS.forEach(n => $('v-' + n).classList.toggle('on', n === v));
  window.myHost = q.get('host') !== '0';
  window.updateAbort = () => { $('abortBtn').style.display = myHost ? 'block' : 'none'; };
  window.AirConsole = { SCREEN: 0 };
  window.ac = { message(to, d) { try { parent.devFromPhone(JSON.parse(JSON.stringify(d))); } catch (e) {} } };
  window.devActivate = () => { window.CONTROLLERS.furtfehde.activate(); updateAbort(); };
  window.devToPhone = (d) => window.CONTROLLERS.furtfehde.onMessage(d);
  window.addEventListener('error', (e) => {
    document.title = 'ERROR: ' + e.message;
    const b = $('devErr') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'devErr' }));
    b.textContent += e.message + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno + '\n';
  });
}
  // load order matters: write the tags synchronously (shell globals above, then registry, world, map, controller; the fake screen also reads sim.js for the costs)
  if (IS_PHONE) document.write('<script src="core/game-registry.js"><\/script><script src="games/furtfehde/world.js"><\/script><script src="games/furtfehde/warmap.js"><\/script><script src="games/furtfehde/controller.js"><\/script>' + (STANDALONE ? '<script src="games/furtfehde/sim.js"><\/script>' : ''));
  else document.write('<script src="games/furtfehde/world.js"><\/script><script src="games/furtfehde/sim.js"><\/script>');
</script>

<!-- ========== top mode: fake screen + panel + iframe ========== -->

<button id="devToggle" title="Falscher Fernseher">🛠</button>
<div id="panel">
  <h3>🏰 Furt &amp; Fehde · Kriegstisch gegen einen falschen Fernseher <button class="btn" id="panelClose" style="float:right;margin:0">✕ zu</button></h3>

</div>

<script>
if (!IS_PHONE || STANDALONE) {
  const $ = (id) => document.getElementById(id);
  const FW = window.FurtWorld, FS = window.FurtSim;
  const STILL = q.get('still') === '1';
  const S0 = q.get('state') || '';
  const PRESET_KEYS = ['mode', 'ghost', 'invalid', 'drag', 'view', 'target', 'wait', 'mud', 'crown', 'state', 'alert', 'card', 'phase', 'hunger', 'rank', 'guide', 'advice', 'food', 'arm', 'place', 'lager', 'queue'];
  const preset = PRESET_KEYS.some((k) => q.has(k));
  if (preset && q.get('panel') !== '1' && q.get('autotest') !== '1' && !STANDALONE) document.body.classList.add('nopanel');
  if (STANDALONE) {
    document.body.classList.add('standalone');
    $('devToggle').onclick = () => document.body.classList.toggle('panelopen'); $('panelClose').onclick = () => document.body.classList.remove('panelopen');
    if (q.get('panel') === '1') document.body.classList.add('panelopen');
  } else $('panelClose').style.display = 'none';
  const wrap = $('frameWrap'); if (!STANDALONE) wrap.style.display = 'block';
  const log = $('log'), t0 = performance.now();

  // ---- the cast: houses by site, two humans and two bots; ?shared=Ben puts a co-player into house 0 ----
  const SITE_HOUSE = ['Haus Falkenstein', 'Haus Wolfsberg', 'Haus Eichenhain', 'Haus Hirschfurt'];
  const COLORS = ['#e0453a', '#3a7be0', '#e6b830', '#9a4ad8'];
  const CAST = [{ p: 'Anna' }, { p: 'Cara' }, { bot: '🤖 Graf Grimbart' }, { bot: '🤖 Gräfin Gundula' }];
  const NL = Math.max(2, Math.min(4, +q.get('lords') || 4));
  const SITES = NL === 2 ? [0, 3] : NL === 3 ? [0, 1, 3] : [0, 1, 2, 3];   // 4 houses → all sites, 3 → 0, 1, 3, 2 → the diagonal
  const LORDS = SITES.map((site, i) => ({ i, site, color: COLORS[i], emblem: i, bot: !!CAST[i].bot, players: CAST[i].p || '', botName: CAST[i].bot || '' }));
  let sharedWith = q.get('shared') ? (q.get('shared') === '1' ? 'Ben' : q.get('shared')) : '';
  const lordsMsg = () => LORDS.map((l) => ({ i: l.i, site: l.site, color: l.color, emblem: l.emblem, bot: l.bot,
    name: l.bot ? l.botName : SITE_HOUSE[l.site] + ' · ' + (l.i === 0 && sharedWith ? 'Anna & ' + sharedWith : l.players) }));
  const hname = (i) => { const l = LORDS[i]; return l.bot ? l.botName : SITE_HOUSE[l.site]; };

  // ---- costs: from FurtSim.CONST (the single source of truth), the way the real glue sends them in ffInfo.costs ----
  const FALLBACK = { build: { huette: { holz: 4 }, hof: { holz: 5 }, kornspeicher: { holz: 6 }, lager: { holz: 5 }, holzfaeller: { holz: 3 }, steinbruch: { holz: 6 }, kaserne: { holz: 8, stein: 8 }, wachturm: { holz: 2, stein: 10 }, brunnen: { stein: 4 } },
    units: { speer: { korn: 2, holz: 2 }, bogen: { korn: 2, holz: 3 }, ritter: { korn: 4, stein: 3 }, fackel: { korn: 1, holz: 1 } }, rebuild: 0.5 };
  function simCosts() {
    const C = FS && FS.CONST; if (!C || !C.BUILD || !C.UNIT) return FALLBACK;
    const out = { build: {}, units: {}, rebuild: C.REBUILD_COST == null ? 0.5 : C.REBUILD_COST };
    for (const k in C.BUILD) if (C.BUILD[k].cost) out.build[k] = C.BUILD[k].cost;
    for (const u in C.UNIT) if (C.UNIT[u].cost) out.units[u] = C.UNIT[u].cost;
    return out;
  }
  const RULES_FALLBACK = { bucketR: 12, keepWellR: 12, capKeep: 30, capKorn: 60, capLager: 60, keepHouses: 8, hutHouses: 4 };
  function simRules() {   // FurtSim.CONST → ffInfo.rules, like the real glue (screen.js)
    const C = FS && FS.CONST; if (!C || C.BUCKET_R == null) return RULES_FALLBACK;
    return { bucketR: C.BUCKET_R, keepWellR: C.KEEP_WELL_R, capKeep: C.CAP_KEEP, capKorn: C.CAP_KORN, capLager: C.CAP_LAGER, keepHouses: C.KEEP_HOUSES, hutHouses: C.HUT_HOUSES };
  }
  const LEGACY = q.get('legacy') === '1';   // ?legacy=1: only the Phase 0 messages (no costs, phase, pacts, hunger, banners in ffYou, 9-field board rows): the phone must still cope
  const COSTS = simCosts(), SEND_COSTS = q.get('costs') !== '0' && !LEGACY, RULES = simRules();
  let sendRules = q.get('rules') !== '0' && !LEGACY;   // false: an older screen without ffInfo.rules
  const RES = { korn: 'Korn', holz: 'Holz', stein: 'Stein' };

  // ---- the clock and the phases (sim seconds): frieden → ebbe (the water falls) → fehde → over ----
  const CC = (FS && FS.CONST) || {};
  const BURG = q.get('burg') != null ? +q.get('burg') : CC.BURGFRIEDEN_S || 120, EBB = CC.EBB_S || 25, T_EBBE = BURG, T_FEHDE = BURG + EBB, T_END = Math.max(T_FEHDE + 90, (+q.get('dauer') || 12) * 60);
  const PACT_S = CC.PACT_S || 180, OFFER_S = CC.OFFER_S || 30;
  const PHASE_AT = { frieden: Math.max(0, T_EBBE - 72), ebbe: T_EBBE + 10, fehde: T_END - 420, letzte: T_END - 42, over: T_END };
  const levelOf = (t) => t < T_EBBE ? 1 : t < T_FEHDE ? 1 - (t - T_EBBE) / EBB : 0;
  const phaseOf = (t) => t >= T_END ? 'over' : t >= T_FEHDE ? 'fehde' : t >= T_EBBE ? 'ebbe' : 'frieden';
  const endsAtOf = (ph) => ph === 'frieden' ? T_EBBE : ph === 'ebbe' ? T_FEHDE : T_END;

  const seed = +q.get('seed') || 1;
  const world = FW.make(seed);
  const BKEYS = Object.keys(FW.BUILDINGS), code = (k) => 1 + BKEYS.indexOf(k);
  let host = q.get('host') !== '0' && S0 !== 'endguest', me = Math.max(0, Math.min(NL - 1, +q.get('lord') || 0)), L = q.get('L') != null ? +q.get('L') : 0;
  let spectator = S0 === 'spectator' || q.get('spectator') === '1', speed = Math.max(0.1, +q.get('speed') || 1), phaseAuto = q.get('auto') === '1', ended = false;
  let stock, cap, pop, popCap, idle, ruhm, crown, hunger, queue, buildings, banners, nextId, rally = {}, pact = {}, simT = 0, phase = 'fehde';
  const PH0 = q.get('phase') || (['frieden', 'ebbe', 'fehde', 'letzte'].indexOf(S0) >= 0 ? S0 : '');
  if (PH0 && PHASE_AT[PH0] != null) {
    simT = PHASE_AT[PH0]; phase = PH0 === 'letzte' ? 'fehde' : PH0;
    if (q.get('left') != null && PH0 !== 'ebbe') simT = endsAtOf(phase) - Math.max(0, +q.get('left'));   // &left=12: seconds left in the phase (Burgfrieden 0:12 pulses orange)
    if (q.get('L') == null) L = levelOf(simT);
  }
  else if (L >= 0.999) { phase = 'frieden'; simT = PHASE_AT.frieden; }                                  // no phase asked for: it follows the water level
  else if (L > 0.001) { phase = 'ebbe'; simT = T_EBBE + (1 - L) * EBB; }
  else { phase = 'fehde'; simT = PHASE_AT.fehde; }
  const rng = FW.mulberry32(seed * 7 + 3);
  const verbose = () => $('verb').checked;
  const ph = () => STANDALONE ? window : $('phoneFrame') && $('phoneFrame').contentWindow;

  // ---- message log ----
  const sizeOf = (d) => JSON.stringify(d).length;
  function brief(d) {
    if (d.t === 'ffMap') return 'ffMap { grid: ' + (sizeOf(d.grid) / 1024).toFixed(1) + ' KB, sites: ' + d.sites.length + ', crossings: ' + d.crossings.length + ' }';
    if (d.t === 'ffBoard') return 'ffBoard { b: ' + d.b.length + ', banners: ' + d.banners.length + ' }';
    if (d.t === 'ffInfo') return 'ffInfo { lord: ' + d.lord + ', host: ' + d.host + ', shared: ' + JSON.stringify(d.shared) + ', lords: ' + d.lords.length + ', costs: ' + (d.costs ? 'ja' : 'nein') + ', rules: ' + (d.rules ? 'ja' : 'nein') + ' }';
    if (d.t === 'ffResult') return 'ffResult { ranking: ' + d.ranking.length + ' Zeilen }';
    return JSON.stringify(d).slice(0, 170);
  }
  function logLine(s) { log.textContent += s + '\n'; if (log.textContent.length > 40000) log.textContent = log.textContent.slice(-30000); log.scrollTop = log.scrollHeight; }
  const sent = [];   // every message the phone sent, for the autotest
  window.devFromPhone = function (d) {
    sent.push(d);
    logLine(((performance.now() - t0) / 1000).toFixed(2).padStart(7) + 's ← ' + JSON.stringify(d));
    handle(d);
  };
  function toPhone(d) {
    const w = ph(); if (!w || !w.devToPhone) return;
    const noisy = d.t === 'ffBoard' || d.t === 'ffYou' || d.t === 'ffLevel';
    if (!noisy || verbose()) logLine(((performance.now() - t0) / 1000).toFixed(2).padStart(7) + 's → ' + brief(d));
    w.devToPhone(JSON.parse(JSON.stringify(d)));
  }

  // ---- the fake screen's truth ----
  const keepOf = (s) => world.sites.find((x) => x.s === s);
  const bannerHome = (lord, n) => { const k = keepOf(LORDS[lord].site); return { x: k.x + (n - 2) * 7, y: k.y + 12.6 }; };
  function recount() {   // caps and housing from the finished buildings, like the sim: keep 30 + Kornspeicher +60 🌾 / Lagerplatz +60 🪵 and 🪨; keep 8 + 4 per Hütte
    const mine = buildings.filter((b) => b.lord === me && !b.ruined && b.build >= 1), n = (k) => mine.filter((b) => b.kind === k).length;
    cap = { korn: RULES.capKeep + n('kornspeicher') * RULES.capKorn, holz: RULES.capKeep + n('lager') * RULES.capLager, stein: RULES.capKeep + n('lager') * RULES.capLager };
    popCap = RULES.keepHouses + n('huette') * RULES.hutHouses;
  }
  const WORKERS = { hof: 1, holzfaeller: 1, steinbruch: 0 }, PAUSABLE = { hof: 1, holzfaeller: 1, steinbruch: 1 };   // the workplaces that can rest (docs R5)
  function resetState() {
    stock = { korn: 30, holz: 70, stein: 26 }; cap = { korn: 90, holz: 90, stein: 90 }; pop = 6; popCap = 12; idle = 3; ruhm = 20; crown = false; hunger = q.get('hunger') === '1';

      res.className = 'ok'; res.textContent = 'AUTOTEST OK'; const sub = document.createElement('div'); sub.style.cssText = 'font:600 12px system-ui;color:#9fd8aa'; sub.textContent = 'Schritte 1–22' + extra; res.appendChild(sub);
      console.log('AUTOTEST OK' + extra); document.title = 'AUTOTEST OK';
    } catch (e) {
      res.className = 'fail'; res.textContent = 'AUTOTEST FAIL – Schritt ' + step + ': ' + e.message; console.log('AUTOTEST FAIL – Schritt ' + step + ': ' + e.message); document.title = 'AUTOTEST FAIL';
    }
    autoRunning = false;
  }
  $('autoBtn').onclick = () => { runAuto = true; build(); };
  setL(L, true);
  build();
}
</script>
