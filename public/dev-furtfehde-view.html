<!DOCTYPE html>

<title>Furt &amp; Fehde Diorama</title>
<!-- The diorama: real FurtWorld.make(seed) + FurtView (games/furtfehde/render.js + terrain.js) + a scripted fake actor state in the exact
     actor-state shape of docs/FURTFEHDE.md. Needs no glue, no phones.
     ?seed=1 &dayT=0.45 &level=0..1 (fixed) &flood=1 (loop: L = 1 for 6 s, recedes over 25 s, holds 15 s, rises over 4 s) &quality=high|low
     &cam=ford|bridge|castle|stream|x,y,dist,el,az  &actors=0  &lords=2|3|4  &units=N (peasants per lord, 46)  &bldg=N (buildings per lord, 10)
     &t=<s> (jump in fake time, then freeze unless live=1)  &w=1280 &h=800  &pause=1  &ui=0 (hide the bar)  &auto=1 (dayT advances)
     &test=fx,qswitch,dispose (smoke tests: a dummy window.FurtFx driven by the view / quality switches / dispose; result line on the canvas)
     &labels=1 (names at the crossings and keeps, drawn from view.project(): a check of the projection)
     Phase 1 (fx + sound): &fx=0 (fx.js loaded but switched off) &nofxjs=1 (fx.js not loaded: the view's fire stand-in shows) &snd=0 (no events to FurtSound)
     &inset=1 (Kampf-Kamera on the Westfurt fight, high only) &fxdbg=1 (fx pool counters on the canvas) &nodecks=1 (water shader without the flooded-deck whitewater)
     &test=keeps,sound,trig,brecs (keeps: gates face the river · sound: every FurtSound name creates nodes without errors, needs a running AudioContext · trig: every trigger + odd events, no fx exception).
     The fake sim now also scripts Phase 1 events through view.event() (and FurtSound.event()), as a loop of CYCLE = 90 s (jump with &t=):
        continuous  the Westfurt fight: shot every 0.17 s, clash every 0.2 s, hit, a death every 3.3 s (16 soldiers, only while the ford is open)
        4 order (lord 0 banner 1, Westfurt) 5.3 order (lord 1 banner 2) 6.4 order (lord 3 banner 1) (all three show at 6.8)  | 8..25 a building rises, buildDone at 25 (lord 1)
        12 ignite (lord 1's farm) -> it burns up, ruined at 36   | 15 crossingOpen Westfurt (sweep)  | 26..30 the house under siege (lord 2) loses its keep hp
        29 attack  30 plunder of lord 2's keep by lord 0 (prot = 60 s: the dome, until 90, protEnd at 89.9)  33 crown (lord 0)
        40 fireOut (lord 0's hut) .. 70 it is lit again  | 45 pactOn lords 0+1, 60 pactOff 'broken' by lord 0 (lord 1 gets zorn = 60 s)
        flood=1 adds crossingOpen for every crossing as the water falls below its `open` value; phase follows the level
     Screenshot recipes (blit=1, dayT=0.45): battle &cam=ford&t=36 · fire &t=26 · plunder &cam=castle&t=31.3 (dome: &t=50) · orders &t=6.8 · flood &cam=bridge&level=1|0.6
        · inset &inset=1&t=36 · sweep &cam=ford&t=16.2 · pact &t=47
     &bench=N (warm up, render N frames as fast as possible, print a BENCH line)  &blit=1 (draw the WebGL canvas into a visible 2D canvas
     every frame: headless Firefox does not capture WebGL canvases in the DOM)  &dbg=1 (draw-call breakdown)
     firefox --headless --no-remote --profile /tmp/p --window-size=1600,1000 --screenshot out.png \
        "http://localhost:3983/dev-furtfehde-view.html?blit=1&ui=0&w=1600&h=1000&dayT=0.45&level=0&t=40" -->
<style>
  html,body { margin:0; background:#10150f; color:#dbe8cf; font:13px/1.3 system-ui,sans-serif; }
  #bar { display:flex; flex-wrap:wrap; gap:5px 9px; align-items:center; padding:5px 8px; background:#1b2618; }
  #bar button, #bar select, #bar input[type=number] { font:inherit; background:#33472b; color:#eef7e2; border:1px solid #587a48; border-radius:5px; padding:2px 7px; cursor:pointer; }
  #bar input[type=number] { width:56px; cursor:text; }
  #bar button.on { background:#6c9a45; }
  #bar label { display:flex; gap:4px; align-items:center; }

  #err { display:none; position:fixed; left:0; right:0; top:0; z-index:9; background:#6a0d0d; color:#fff; font:12px/1.35 monospace; padding:6px 10px; white-space:pre-wrap; max-height:35vh; overflow:auto; }
  canvas#c, #host canvas { display:block; max-width:100vw; height:auto; background:#000; }
  /* interactive mode (no blit): the view fills the whole window, the bar floats on top */
  body.fill { overflow:hidden; }
  body.fill #host { position:fixed; inset:0; background:#000; }
  body.fill #host canvas { width:100vw; height:100vh; max-width:none; }
  body.fill #bar { position:fixed; top:0; left:0; right:0; z-index:5; background:rgba(27,38,24,.82); transition:opacity .4s; }
  body.fill.barHidden #bar { opacity:0; pointer-events:none; }
  #benchBox { display:none; position:fixed; left:50%; top:60px; transform:translateX(-50%); z-index:6; background:rgba(16,21,15,.92);
              color:#ffe9a0; border:1px solid #587a48; border-radius:10px; padding:12px 20px; font:16px/1.5 system-ui,sans-serif; text-align:center; }
  #benchBox b { font-size:22px; }
  #benchBox small { color:#cfdcbf; }
  #snd { display:none; position:fixed; left:8px; bottom:8px; z-index:7; max-width:min(560px,96vw); background:rgba(16,21,15,.93); border:1px solid #587a48; border-radius:10px; padding:8px 10px; }
  #snd.open { display:block; }
  #snd h4 { margin:2px 0 4px; font:600 12px system-ui; color:#9fe3b0; }
  #snd button { font:inherit; background:#33472b; color:#eef7e2; border:1px solid #587a48; border-radius:5px; padding:2px 7px; margin:2px; cursor:pointer; }
  #snd button.on { background:#6c9a45; } #snd button.err { background:#7a2a2a; }
  #snd .row { display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; } #snd .out { font:11px monospace; color:#ffe9a0; white-space:pre-wrap; max-height:150px; overflow:auto; }
  #insetLabel { display:none; position:fixed; z-index:4; color:#fff; font:700 14px system-ui; text-shadow:0 0 4px #000,0 0 2px #000; pointer-events:none; text-align:center; }

<body>
<div id="err"></div>
<div id="bar"></div>
<div id="host"><canvas id="c" width="1280" height="800" style="display:none"></canvas></div>
<div id="benchBox"></div>

<script src="games/furtfehde/sound.js" onerror="void 0"></script>
<script>if (/[?&]test=[^&]*sound/.test(location.search) && window.FurtSound) window.FurtSound.unlock();   // test=sound: start the context early so it runs by the time the tests do</script>
<script src="games/furtfehde/render.js"></script>
<script type="module">import * as THREE from './vendor/three.module.min.js'; window.THREE = THREE;</script>
<script type="module">
const errBox = document.getElementById('err');
const showErr = (m) => { errBox.style.display = 'block'; if (errBox.textContent.length < 3000) errBox.textContent += m + '\n'; };
window.addEventListener('error', (e) => showErr('JS-Fehler: ' + e.message + (e.error && e.error.stack ? '\n' + e.error.stack : '')));
window.addEventListener('unhandledrejection', (e) => showErr('Promise: ' + (e.reason && e.reason.stack || e.reason)));
{ const ow = console.warn.bind(console), oe = console.error.bind(console);
  console.warn = (...a) => { showErr('warn: ' + a.map((x) => (x && x.stack ? x.stack : String(x))).join(' ').slice(0, 500)); ow(...a); };
  console.error = (...a) => { showErr('error: ' + a.map((x) => (x && x.stack ? x.stack : String(x))).join(' ').slice(0, 500)); oe(...a); }; }
try {
  const FW = window.FurtWorld, THREE_ = window.THREE;
  const q = new URLSearchParams(location.search), P = (k, d) => (q.has(k) ? q.get(k) : d);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const fract = (x) => x - Math.floor(x), hash = (n) => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453);
  const lerpAngle = (a, b, t) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return a + d * t; };
  const W = parseInt(P('w', '1280'), 10), H = parseInt(P('h', '800'), 10), DT = 1 / 30;
  const seed = parseInt(P('seed', '1'), 10) | 0;
  const world = FW.make(seed);
  const COLORS = ['#ff2d55', '#0a84ff', '#30d158', '#ffd60a'], NAMES = ['Haus Rubin', 'Haus Saphir', 'Haus Smaragd', 'Haus Gold'];
  const NL = clamp(parseInt(P('lords', '4'), 10) | 0, 2, 4);
  const SITES = NL === 2 ? [0, 3] : NL === 3 ? [0, 1, 3] : [0, 1, 2, 3];
  const lords = SITES.map((s, i) => ({ i, site: s, color: COLORS[i], name: NAMES[i], emblem: i, crown: false, ruhm: 0, people: 0, soldiers: 0, prot: 0, zorn: 0, hunger: 0 }));   // prot / zorn = seconds left
  const O = { dayT: parseFloat(P('dayT', '0.45')), level: parseFloat(P('level', '0')), flood: P('flood', '0') === '1', actors: P('actors', '1') !== '0', auto: P('auto', '0') === '1' };
  const bench = parseInt(P('bench', '0'), 10) | 0, blit = P('blit', '0') === '1';
  let quality = P('quality', 'high') === 'low' ? 'low' : 'high', paused = P('pause', '0') === '1';
  let fxOn = P('fx', '1') !== '0', sndOn = P('snd', '1') !== '0', insetOn = P('inset', '0') === '1';

  // =====================================================================
  // fake simulation: steps at 1/30 s; the actor state is built from it every step (exact shape of docs/FURTFEHDE.md)
  // =====================================================================
  const GW = FW.GW, GH = FW.GH, BK = Object.keys(FW.BUILDINGS);
  const NB = clamp(parseInt(P('bldg', '10'), 10) | 0, 4, 14), NP = clamp(parseInt(P('units', '46'), 10) | 0, 0, 120);
  let simT = 0, tick = 0, nextId = 1, treeV = 0, L = 0;
  const trees = new Float32Array(world.trees.length).fill(1), stumpAt = new Map();
  const newId = () => nextId++;
  const levelAt = (T) => {
    if (O.flood) { const c = T % 50; return c < 6 ? 1 : c < 31 ? 1 - (c - 6) / 25 : c < 46 ? 0 : (c - 46) / 4; }
    return O.level;
  };
  const cellAt = (x, y) => FW.cellOf(x, y);
  const walkAt = (x, y, Lv) => { const k = cellAt(x, y); return k < 0 ? 0 : FW.walk(world, k, Lv); };
  function snapWalk(x, y, Lv) {
    if (walkAt(x, y, Lv) > 0) return { x, y };
    for (let r = 1; r <= 6; r++) for (let a = 0; a < 8 * r; a++) { const ang = a / (8 * r) * TAU, px = x + Math.cos(ang) * r * 0.8, py = y + Math.sin(ang) * r * 0.8; if (walkAt(px, py, Lv) > 0) return { x: px, y: py }; }
    return { x, y };
  }
  const pathCache = new Map();
  function route(a, b, Lv, cache) {
    if (!cache) return FW.path(world, a, b, Lv);
    const key = a.x.toFixed(1) + ',' + a.y.toFixed(1) + '>' + b.x.toFixed(1) + ',' + b.y.toFixed(1) + '@' + Math.round(Lv * 60);
    if (pathCache.has(key)) return pathCache.get(key);
    const p = FW.path(world, a, b, Lv); pathCache.set(key, p); return p;
  }

  // ---- buildings: 10 per lord via FurtWorld.suggest on a growing occupancy, in mixed states ----
  const SEQ = ['hof', 'huette', 'holzfaeller', 'kornspeicher', 'lager', 'kaserne', 'hof', 'steinbruch', 'huette', 'brunnen', 'wachturm', 'hof', 'huette', 'lager'];
  const buildings = [], byLord = [];
  for (const l of lords) {
    const site = world.sites[l.site], occ = new Uint8Array(GW * GH), mine = [];
    buildings.push({ id: newId(), lord: l.i, kind: 'bergfried', i: site.keep.i, j: site.keep.j, rot: 0, build: 1, hp: 1, fire: 0, burnt: 0, ruined: false, growth: 1 });
    byLord[l.i] = { site, mine, gate: snapWalk(site.x, site.y + 4.6, 0) };
    for (const kind of SEQ) {
      if (mine.length >= NB) break;
      const sp = FW.suggest(world, kind, l.site, { L: 0, occ });
      if (!sp) continue;
      const fp = FW.footprintOf(kind, sp.rot), code = 1 + BK.indexOf(kind);
      for (let dj = 0; dj < fp[1]; dj++) for (let di = 0; di < fp[0]; di++) occ[(sp.j + dj) * GW + sp.i + di] = code;
      const b = { id: newId(), lord: l.i, kind, i: sp.i, j: sp.j, rot: sp.rot, build: 1, hp: 1, fire: 0, burnt: 0, ruined: false, growth: 1 };
      const cx = -72 + sp.i + fp[0] / 2, cy = -45 + sp.j + fp[1] / 2, d = (sp.rot ? fp[0] : fp[1]) / 2 + 0.9;   // door: art convention, fronts face +z at rot 0, -x at rot 1
      b.door = snapWalk(cx - d * sp.rot, cy + d * (1 - sp.rot), 0); b.cx = cx; b.cy = cy;
      mine.push(b); buildings.push(b);
    }
    const hofs = mine.filter((b) => b.kind === 'hof'), rest = mine.filter((b) => b.kind !== 'hof' && b.kind !== 'holzfaeller' && b.kind !== 'steinbruch');
    hofs.forEach((b, n) => { b.growth = [0.2, 0.6, 1][(n + l.i) % 3]; });
    if (rest.length > 3) { rest[(1 + l.i) % rest.length].build = 0.3; rest[(3 + l.i) % rest.length].build = 0.8; }   // one at 0.3, one at 0.8
    const done = (kinds) => mine.find((b) => kinds.includes(b.kind) && b.build >= 1);
    if (l.i === 0) { const b = done(['huette']); if (b) { b.fire = 0.6; b.hp = 0.7; } }                                               // burning
    else if (l.i === 1) { const b = done(['kornspeicher', 'lager']); if (b) { b.burnt = 1; b.ruined = true; b.hp = 0.2; } }          // burnt down
    else if (l.i === 2) { const f = hofs[hofs.length - 1]; if (f) { f.burnt = 1; f.growth = 0.9; } }                                // burnt field
    else { const b = done(['holzfaeller', 'huette']); if (b) { b.fire = 0.6; b.hp = 0.6; } }
  }
  const bState = () => buildings.map((b) => ({ id: b.id, lord: b.lord, kind: b.kind, i: b.i, j: b.j, rot: b.rot, build: b.build, hp: b.hp, fire: b.fire, burnt: b.burnt, ruined: b.ruined, growth: b.growth }));

  // ---- walkers (peasants, woodcutters, torch-bearers): a loop of stops, walking along FurtWorld.path between them ----
  const walkers = [];
  const SPEED = { bauer: 1.7, fackel: 3.0, speer: 2.0, bogen: 2.0, ritter: 3.6 };
  function mkWalker(lord, kind, pos, stops, o) {
    const w = Object.assign({ id: newId(), lord, kind, x: pos.x, y: pos.y, px: pos.x, py: pos.y, h: hash(nextId) * TAU, ph: 0, anim: 'idle', carry: null, stops, si: 0, mode: 'wait', wait: hash(nextId * 3.1) * 2, path: null, pi: 0, home: pos, retry: 0 }, o || {});
    w.ph = w.h; walkers.push(w); return w;
  }
  const nearest = (list, x, y) => list.reduce((best, b) => (!best || Math.hypot(b.cx - x, b.cy - y) < Math.hypot(best.cx - x, best.cy - y) ? b : best), null);
  const woodTrees = (lordIdx) => {
    const L0 = byLord[lordIdx], hut = L0.mine.filter((b) => b.kind === 'holzfaeller'), out = [];
    world.trees.forEach((t, id) => { if ((t.kind === 'laub' || t.kind === 'nadel') && t.k >= 0 && world.cls[t.k] === FW.CI.T && hut.some((h) => Math.hypot(h.cx - t.x, h.cy - t.y) < 10)) out.push(id); });
    return out;
  };
  for (const l of lords) {
    const B = byLord[l.i], mine = B.mine, gate = B.gate, doors = mine.map((b) => b.door);
    const stores = mine.filter((b) => (b.kind === 'kornspeicher' || b.kind === 'lager') && b.build >= 1);
    const storeDoor = (kinds, x, y) => { const s = nearest(stores.filter((b) => kinds.includes(b.kind)), x, y); return s ? s.door : gate; };
    let count = 0;
    for (const b of mine) {
      if (b.build < 1) { for (let n = 0; n < 2; n++) { const a = n * 3.1 + 0.8, p = snapWalk(b.cx + Math.cos(a) * 2.6, b.cy + Math.sin(a) * 2.2, 0); mkWalker(l.i, 'bauer', p, [{ x: p.x, y: p.y, anim: 'work', dur: 1e9 }]); count++; } continue; }
      if (b.ruined) continue;
      if (b.kind === 'hof') {
        const sd = storeDoor(['kornspeicher'], b.cx, b.cy), fx = snapWalk(b.cx + 1.2, b.cy + 0.6, 0);
        mkWalker(l.i, 'bauer', fx, [{ x: fx.x, y: fx.y, anim: 'work', dur: 3.5, after: 'korn' }, { x: sd.x, y: sd.y, anim: 'idle', dur: 1.2, after: null }]); count++;
      } else if (b.kind === 'holzfaeller') {
        const cand = woodTrees(l.i), sd = storeDoor(['lager'], b.cx, b.cy);
        for (let n = 0; n < 2 && cand.length; n++) {
          const w = mkWalker(l.i, 'bauer', b.door, [{ x: b.door.x, y: b.door.y, anim: 'idle', dur: 0.8 }, { tree: true, anim: 'work', dur: 4.5, after: 'holz' }, { x: sd.x, y: sd.y, anim: 'idle', dur: 1.0, after: null }], { cand, hut: b });
          w.wait = n * 2.5; count++;
        }
      } else if (b.kind === 'steinbruch') {
        const sd = storeDoor(['lager'], b.cx, b.cy);
        for (let n = 0; n < 2; n++) { const p = snapWalk(b.cx + (n ? 2.4 : -2.4), b.cy + 0.5, 0); mkWalker(l.i, 'bauer', p, [{ x: p.x, y: p.y, anim: 'work', dur: 3.2, after: 'stein' }, { x: sd.x, y: sd.y, anim: 'idle', dur: 1.0, after: null }]); count++; }
      } else if (b.kind === 'brunnen') {
        const huts = mine.filter((q) => q.kind === 'huette' && q.build >= 1);
        for (let n = 0; n < 2 && huts.length; n++) { const h = huts[(n + l.i) % huts.length]; mkWalker(l.i, 'bauer', b.door, [{ x: b.door.x, y: b.door.y, anim: 'idle', dur: 1.0, after: 'eimer' }, { x: h.door.x, y: h.door.y, anim: 'work', dur: 1.8, after: null }]); count++; }
      }
    }
    // everyone else walks between doors and the keep gate
    for (let n = count, g = 0; n < NP && doors.length; n++, g++) {
      const a = doors[(n * 5 + l.i) % doors.length], b = n % 3 === 0 ? gate : doors[(n * 3 + 1 + l.i) % doors.length];
      mkWalker(l.i, 'bauer', a, [{ x: a.x, y: a.y, anim: 'idle', dur: 1 + hash(n + l.i * 50) * 3 }, { x: b.x, y: b.y, anim: 'idle', dur: 1 + hash(n * 2.3) * 2.5, after: g % 4 === 0 ? 'korn' : null }, { x: gate.x, y: gate.y, anim: 'idle', dur: 1.5, after: null }]);
    }
  }
  function nextStop(w) {
    const st = w.stops[w.si];
    if (st.tree) {   // pick a standing tree near the hut and stand at its foot, facing the hut
      const live = w.cand.filter((id) => trees[id] >= 1);
      if (!live.length) { w.mode = 'wait'; w.wait = 3; return; }
      const id = live[Math.floor(hash(w.id * 9.7 + tick * 0.01) * live.length)], t = world.trees[id], a = Math.atan2(w.hut.cy - t.y, w.hut.cx - t.x);
      const p = snapWalk(t.x + Math.cos(a) * 1.0, t.y + Math.sin(a) * 1.0, L); st.x = p.x; st.y = p.y; st.id = id;
    }
    const p = route({ x: w.x, y: w.y }, st, L, true);
    if (!p) { w.mode = 'blocked'; w.retry = 1.2; w.anim = 'idle'; return; }
    w.path = p; w.pi = 1; w.mode = 'walk';
  }
  function stepWalker(w, dt) {
    w.px = w.x; w.py = w.y; w.ph = w.h;
    if (w.stay) { w.anim = w.stay; return; }
    const k = cellAt(w.x, w.y);
    if (k >= 0 && FW.walk(world, k, L) === 0) {   // swallowed by the flood: back to the starting place
      w.x = w.home.x; w.y = w.home.y; w.px = w.x; w.py = w.y; w.path = null; w.mode = 'wait'; w.wait = 2; w.anim = 'idle'; w.si = 0; return;
    }
    if (w.stops.length === 1) { w.anim = w.stops[0].anim; return; }
    if (w.mode === 'wait') {
      const st = w.stops[w.si]; w.anim = st.anim || 'idle'; w.wait -= dt;
      if (w.wait <= 0) {
        if (st.tree && st.id != null && trees[st.id] >= 1) { trees[st.id] = 0; stumpAt.set(st.id, simT); treeV++; }
        if (st.after !== undefined) w.carry = st.after;
        w.si = (w.si + 1) % w.stops.length; nextStop(w);
      }
      return;
    }
    if (w.mode === 'blocked') { w.anim = 'idle'; w.retry -= dt; if (w.retry <= 0) nextStop(w); return; }
    // walking
    let rem = (SPEED[w.kind] || 1.7) * walkAt(w.x, w.y, L) * dt, moved = false;
    while (rem > 1e-4 && w.pi < w.path.length) {
      const tg = w.path[w.pi], dx = tg.x - w.x, dy = tg.y - w.y, d = Math.hypot(dx, dy);
      const f = Math.min(1, rem / (d || 1)), nx = w.x + dx * f, ny = w.y + dy * f;
      if (walkAt(nx, ny, L) === 0) { w.mode = 'blocked'; w.retry = 1.0; break; }
      w.h = lerpAngle(w.h, Math.atan2(dy, dx), Math.min(1, dt * 10)); w.x = nx; w.y = ny; moved = true;
      if (d <= rem) { rem -= d; w.pi++; } else rem = 0;
    }
    w.anim = moved ? 'walk' : 'idle';
    if (w.mode === 'walk' && w.pi >= w.path.length) { w.mode = 'wait'; w.wait = w.stops[w.si].dur; }

        { t: 'order', lord: 7, n: 9, x: 5, y: 5 }, { t: 'order' }, { t: 'plunder', lord: 9, by: 3 }, { t: 'plunder', lord: 0 }, { t: 'protEnd', lord: 12 }, { t: 'crossingOpen', id: 'nope' }, { t: 'crossingOpen' }, { t: 'chop', tree: -1 }, { t: 'chop', tree: 1e9 },
        { t: 'pactOn', a: 0 }, { t: 'pactOff', reason: 'broken' }, { t: 'crown', lord: 9 }, { t: 'attack' }, { t: 'buildDone', id: 5 }, { t: 'harvest', id: 5 }, { t: 'sow', id: -3 }, { t: 'unknown' }, {}, null];
      for (const ev of odd) view.event(ev, state);
      for (let i = 0; i < 40; i++) { advance(); vnow += 33; drawFrame(1, 33, false, i === 39); }
      lines.push(`trig: ${Object.keys(TRIG).length} triggers + ${odd.length} odd events, fx exceptions ${(view._fxErr | 0) - e0}, ${view.fx ? JSON.stringify(view.fx.stats) : 'no fx'}`);
    }
    if (tests.has('brecs') && view.fx) lines.push('brecs ' + view.fx.brecs.size + ' active ' + [...view.fx.brecs.values()].filter((r) => r.until > view.fx.now).length + ' now ' + view.fx.now.toFixed(0) + ' conB.build ' + (conB && conB.build.toFixed(3)));
    if (tests.has('keeps')) {      // the gates face the river: sites 0/1 open south (+z), sites 2/3 north (-z); anchors follow the rotation
      const v = new THREE_.Vector3(), c = new THREE_.Vector3();
      for (const l of lords) {
        const k = view.keepObj(l.i); if (!k) continue; k.group.updateMatrixWorld(true);
        const gate = k.anchors.gate.getWorldPosition(v).clone(), top = k.anchors.top.getWorldPosition(c).clone(), s0 = world.sites[l.site], dz = gate.z - s0.y, ok = l.site < 2 ? dz > 2 : dz < -2;
        lines.push(`keep ${l.i} site ${l.site} rotY ${k.group.rotation.y.toFixed(2)} gate dz ${dz.toFixed(2)} top (${(top.x - s0.x).toFixed(2)}, ${top.y.toFixed(1)}, ${(top.z - s0.y).toFixed(2)}) ${ok ? 'OK river side' : 'WRONG'}`);
      }
    }
    if (tests.has('sound')) { const r = testAllSounds(); console.log(r); document.title = 'SOUND ' + (r.includes('SOUND TEST OK') ? 'OK' : 'FAIL'); if (blit) { ctx.font = '13px monospace'; ctx.textBaseline = 'top'; r.split('\n').forEach((l, i) => { ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillRect(4, 130 + i * 18, ctx.measureText(l).width + 12, 17); ctx.fillStyle = '#9ff'; ctx.fillText(l, 9, 132 + i * 18); }); } }
    if (tests.has('dispose')) { const pre = view.renderer.info.memory; view.dispose(); lines.push(`dispose ok, fx disposed ${fxLog.disposed}`); document.title = 'DISPOSED'; }
    if (blit && lines.length) { ctx.font = '14px monospace'; ctx.textBaseline = 'top'; lines.forEach((l, i) => { ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(4, 80 + i * 22, ctx.measureText(l).width + 12, 20); ctx.fillStyle = '#9ff'; ctx.fillText(l, 9, 83 + i * 22); }); }
    console.log(lines.join(' | '));
  }
  if (tests.size && target > 0) runTests();
  function loop() {
    looping = true;
    let last = performance.now(), acc = 0, fn = 0, ft = last;
    (function f() {
      const n = performance.now(), dt = Math.min(100, n - last); last = n;
      if (!paused) { vnow += dt; acc += dt / 1000; let steps = 0; while (acc >= DT && steps++ < 6) { acc -= DT; advance(); } if (acc > DT * 3) acc = 0; showDay(); if (O.flood) { lsl.value = L; lv.textContent = L.toFixed(2); } }
      drawFrame(clamp(acc / DT, 0, 1), paused ? 0 : dt, false);
      fn++; if (n - ft > 500) { showStats(fn * 1000 / (n - ft)); fn = 0; ft = n; }
      requestAnimationFrame(f);
    })();
  }
} catch (e) { showErr('Boot-Fehler: ' + (e.stack || e.message)); }
</script>
