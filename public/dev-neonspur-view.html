<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Neonspur View Dev</title>
<!-- Renderer-only preview: drives NeonspurView with a scripted fake state (no real sim).
     ?n=1..4  ?layout=split|overview  ?cam=pov|chase  ?quality=high|low  ?pid=1..5 (first view's rider)  ?sim=<ms fast-forward, fake clock>  ?freeze=1
     ?bench=1 (with sim=): after the fast-forward, time 90 more frames and print the average in the overlay
     Fake state covers Phase 2: subticks (mp/ms), Turbo + grind sparks (riders 1 and 4), items of all kinds
     (one picked up by rider 2, shield by rider 3 -> breaks a wall at ~4.0 s, blast at ~4.3 s), trailRev.
     firefox --headless --no-remote --profile /tmp/ffp --window-size=980,620 \
       --screenshot out.png "http://localhost:3000/dev-neonspur-view.html?n=2&sim=4000&freeze=1" -->
<style>
  html,body { margin:0; background:#0a0a14; }
  canvas { background:#0d0d1a; border-radius:10px; box-shadow:0 0 50px rgba(120,90,255,.18);
           max-width:calc(100vw - 20px); max-height:calc(100vh - 84px); width:auto; height:auto; }
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<script src="games/neonspur/render.js"></script>
<script type="module">import * as THREE from './vendor/three.module.min.js'; window.THREE = THREE;</script>
<script type="module">
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function devFail(msg) {
  ctx.fillStyle = '#300'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'left';
  String(msg).match(/.{1,80}/g).forEach((line, i) => ctx.fillText(line, 20, 50 + i * 26));
  console.error(msg);
}
window.addEventListener('error', (e) => devFail('JS-Fehler: ' + e.message));
try {
  const q = new URLSearchParams(location.search);
  const N = Math.max(1, Math.min(4, parseInt(q.get('n') || '2', 10)));
  const LAYOUT = q.get('layout') === 'overview' ? 'overview' : 'split';
  const CAM = q.get('cam') === 'chase' ? 'chase' : 'pov';
  const simMs = parseInt(q.get('sim') || '0', 10), freeze = q.get('freeze') === '1';
  const realNow = performance.now.bind(performance);
  let fake = 1000;
  if (simMs > 0) performance.now = () => fake;
  const clock = () => (simMs > 0 ? fake : realNow());

  // ---- mini map parser (legend from docs/NEONSPUR.md) ----
  const CONST = { TRAIL_H: 0.8, JUMP_H: 1.6, JUMP_LEN: 4, WALL_H: 3 };
  const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  function parseMap(def) {
    const h = def.rows.length, w = def.rows[0].length;
    const m = { key: def.key, label: def.label, w, h, theme: def.theme, floor: new Float32Array(w * h), wall: new Uint8Array(w * h), rampDir: new Int8Array(w * h).fill(-1), pad: new Uint8Array(w * h), spawns: def.spawns };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = def.rows[y][x], i = y * w + x;
      if (ch === '#') m.wall[i] = 1;
      else if (ch === '=') m.floor[i] = 1;
      else if ('>v<^'.includes(ch)) { m.floor[i] = 0.5; m.rampDir[i] = '>v<^'.indexOf(ch); }
      else if (ch === '*') m.pad[i] = 1;
      else if (ch === '+') { m.pad[i] = 1; m.floor[i] = 1; }
    }
    return m;
  }
  // ---- 32x32 test arena with every element ----
  const G = Array.from({ length: 32 }, (_, y) => Array.from({ length: 32 }, (_, x) => (x === 0 || y === 0 || x === 31 || y === 31 ? '#' : '.')));
  const put = (x0, y0, x1, y1, ch) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) G[y][x] = ch; };
  put(6, 6, 8, 8, '#'); put(22, 6, 23, 9, '#'); put(10, 22, 10, 26, '#'); put(11, 26, 13, 26, '#');
  put(18, 16, 25, 23, '='); put(17, 19, 17, 20, '>'); G[20][22] = '+'; G[28][10] = '*'; G[12][4] = '*';
  put(28, 12, 28, 13, '#');
  const map = parseMap({ key: 'test', label: 'Test', rows: G.map((r) => r.join('')),
    theme: { floor: '#05060f', grid: '#1b2a6b', wall: '#0b0f24', edge: '#3d6bff', raised: '#0a1030', sky: '#020208' },
    spawns: [] });
  const w = map.w, h = map.h, fl = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 9 : map.floor[y * w + x]);

  // ---- scripted fake riders: one char per MOVE (S straight, L/R turn+move, J jump from this move) ----
  const LOOK = { 1: { color: '#ff2d55', name: 'Anna' }, 2: { color: '#0a84ff', name: 'Ben' }, 3: { color: '#30d158', name: 'Cleo' }, 4: { color: '#ffd60a', name: 'Dino' }, 5: { color: '#bf5af2', name: 'Eli' } };
  const rep = (c, n) => c.repeat(n);
  // boost: [fromMove, toMove) windows in which the rider holds Turbo
  const SCRIPT = {
    1: { x: 3, y: 1, dir: 0, s: rep('S', 23) + 'R' + rep('S', 9) + 'L' + rep('S', 10), boost: [[7, 16]] },       // grinds the north wall, boosts
    2: { x: 14, y: 16, dir: 3, s: 'SSJSSS' + 'SSS' + rep('S', 5) + 'R' + rep('S', 16), boost: [] },   // jumps, picks up a battery, runs into rider 1's wall
    3: { x: 8, y: 19, dir: 0, s: rep('S', 20) + 'R' + rep('S', 7) + 'R' + rep('S', 12), boost: [] },              // shield, breaks through a wall, blast
    4: { x: 3, y: 30, dir: 0, s: rep('S', 40), boost: [[4, 12]] },                                      // grinds the south wall, boosts
    5: { x: 22, y: 29, dir: 3, s: rep('S', 12), boost: [] }                                                       // lays a wall column that crashes into the terrace
  };
  // items lying around from the start + two that spawn later
  const ITEMS0 = [{ id: 1, kind: 'boost', x: 14, y: 7 }, { id: 2, kind: 'shield', x: 12, y: 19 }, { id: 3, kind: 'jump', x: 20, y: 12 }, { id: 4, kind: 'blast', x: 20, y: 26 }];
  const SPAWNS = [{ at: 1500, id: 5, kind: 'boost', x: 24, y: 12 }, { at: 2000, id: 6, kind: 'shield', x: 6, y: 16 }];
  const SUB = 60;            // ms per subtick (a normal move = 2 subticks)
  const state = { map, tick: 0, time: 0, speed: 8.3, over: false, winner: null, riders: [], items: [], extras: true };
  const occ = new Map();   // cell -> [{ pid, h }]
  const ids = [1, 2, 3, 4, 5];
  let events = [];
  function initState() {
    occ.clear(); state.tick = 0; state.time = 0;
    state.items = ITEMS0.map((it) => ({ ...it, h: fl(it.x, it.y) }));
    state.riders = ids.map((pid, slot) => {
      const s = SCRIPT[pid];
      const r = { pid, slot, bot: false, alive: true, x: s.x, y: s.y, dir: s.dir, alt: fl(s.x, s.y), px: s.x, py: s.y, pdir: s.dir, palt: fl(s.x, s.y), air: false, jumpReadyAt: 0, trail: [], deadAt: null, killer: null,
        mp: 2, ms: 0, boost: 0, boosting: false, grind: 0, shield: false, trailRev: 0,
        _k: 0, _base: 0, _jump: false, _brk: true, _i: 0 };
      lay(r); return r;
    });
  }
  const altAt = (base, k) => base + CONST.JUMP_H * 4 * (k / CONST.JUMP_LEN) * (1 - k / CONST.JUMP_LEN);
  function lay(r) {
    r.trail.push([r.x, r.y, r.alt, r._brk ? 1 : 0]); r._brk = false;
    const key = r.y * w + r.x; if (!occ.has(key)) occ.set(key, []); occ.get(key).push({ pid: r.pid, h: r.alt });
  }
  function crash(r, x, y, alt, by) {
    r.alive = false; r.deadAt = state.tick; r.boosting = false; r.shield = false; r.grind = 0; r.killer = by; events.push({ t: 'crash', pid: r.pid, x, y, alt, by });
  }
  // erase light-wall cells like the sim does: drop the points, the next survivor starts a new run, trailRev++
  function erase(pred) {
    for (const r of state.riders) {
      let gap = false, any = false; const keep = [];
      for (const p of r.trail) {
        if (pred(p, r)) {
          gap = true; any = true;
          const k = p[1] * w + p[0], list = occ.get(k); if (list) { const f = list.filter((o) => o.pid !== r.pid); if (f.length) occ.set(k, f); else occ.delete(k); }
        } else { if (gap) p[3] = 1; gap = false; keep.push(p); }
      }
      if (any) { r.trail = keep; r.trailRev++; }
    }
  }
  const solid = (x, y) => x < 0 || y < 0 || x >= w || y >= h || map.wall[y * w + x] === 1 || occ.has(y * w + x);
  function setBoosting(r, on) { if (r.boosting !== on) { r.boosting = on; events.push({ t: 'boost', pid: r.pid, on }); const np = on ? 1 : 2; r.ms = Math.floor(r.ms * np / r.mp); r.mp = np; } }
  function move(r) {
    const sc = SCRIPT[r.pid], c = sc.s[r._i] || 'S';
    // Turbo input window (script) -> boosting needs charge, like the sim
    const want = sc.boost.some(([a, b]) => r._i >= a && r._i < b);
    if (want && r.boost <= 0 && !r.boosting) r.boost = 0.6;
    setBoosting(r, want && r.boost > 0);
    r._i++;
    r.ms = 0;
    r.px = r.x; r.py = r.y; r.palt = r.alt; r.pdir = r.dir;
    if (c === 'L') r.dir = (r.dir + 3) % 4; else if (c === 'R') r.dir = (r.dir + 1) % 4;
    if (c === 'L' || c === 'R') events.push({ t: 'turn', pid: r.pid, dir: r.dir });
    if (c === 'J') r._jump = true;
    const nx = r.x + DX[r.dir], ny = r.y + DY[r.dir], fb = fl(nx, ny), fa = r.alt;
    if (r._jump && !r.air) { r.air = true; r._k = 0; r._base = r.alt; r._jump = false; events.push({ t: 'jump', pid: r.pid, pad: false }); }
    let a;
    if (r.air) { r._k++; a = altAt(r._base, r._k); } else a = r.alt;
    r.grind = 0;
    if (fb === 9) { crash(r, nx, ny, a, 'edge'); return; }
    if (map.wall[ny * w + nx] && a < CONST.WALL_H) { crash(r, nx, ny, a, 'wall'); return; }
    const hit = (occ.get(ny * w + nx) || []).filter((o) => a < o.h + CONST.TRAIL_H);
    if (hit.length) {
      if (r.shield) { r.shield = false; events.push({ t: 'shield', pid: r.pid, x: nx, y: ny }); erase((p) => p[0] === nx && p[1] === ny); }
      else { crash(r, nx, ny, a, 'wall'); return; }
    }
    if (r.air) {
      if (a <= fb) {
        if (altAt(r._base, r._k - 1) >= fb - 0.01) { r.air = false; r.x = nx; r.y = ny; r.alt = fb; r._brk = true; events.push({ t: 'land', pid: r.pid }); lay(r); pickup(r); }
        else crash(r, nx, ny, a, 'wall');
      } else { r.x = nx; r.y = ny; r.alt = a; }
      return;
    }
    if (fb - fa > 0.5) { crash(r, nx, ny, a, 'wall'); return; }
    r.x = nx; r.y = ny; r.alt = fb;
    if (fb - fa <= -1) events.push({ t: 'drop', pid: r.pid });
    lay(r);
    for (const [bit, sd] of [[1, (r.dir + 3) % 4], [2, (r.dir + 1) % 4]]) if (solid(r.x + DX[sd], r.y + DY[sd])) { r.grind |= bit; r.boost = Math.min(1, r.boost + 0.04); }
    if (r.boosting) { r.boost = Math.max(0, r.boost - 0.07); if (r.boost <= 0) setBoosting(r, false); }
    pickup(r);
    if (map.pad[ny * w + nx]) { r.air = true; r._k = 0; r._base = fb; events.push({ t: 'jump', pid: r.pid, pad: true }); }
  }
  function pickup(r) {
    const k = state.items.findIndex((it) => it.x === r.x && it.y === r.y);
    if (k < 0) return;
    const it = state.items.splice(k, 1)[0];
    events.push({ t: 'item', pid: r.pid, kind: it.kind, id: it.id, x: it.x, y: it.y });
    if (it.kind === 'boost') r.boost = 1; else if (it.kind === 'shield') r.shield = true;
    else if (it.kind === 'blast') {
      events.push({ t: 'blast', pid: r.pid, x: r.x, y: r.y, r: 3 });
      erase((p, o) => Math.max(Math.abs(p[0] - r.x), Math.abs(p[1] - r.y)) <= 3 && !(state.riders.some((q) => q.alive && q.x === p[0] && q.y === p[1])));
    }
  }
  function step() {
    events = []; state.tick++; state.time += SUB;
    for (const sp of SPAWNS) if (!sp.done && state.time >= sp.at) { sp.done = true; const it = { id: sp.id, kind: sp.kind, x: sp.x, y: sp.y, h: fl(sp.x, sp.y) }; state.items.push(it); events.push({ t: 'itemSpawn', ...it }); }
    for (const r of state.riders) {
      if (!r.alive) { r.ms = 0; continue; }
      r.ms++;
      if (r.ms >= r.mp) move(r);
    }
  }

  // ---- view ----
  const QUALITY = q.get('quality') === 'low' ? 'low' : 'high';
  const view = new window.NeonspurView(window.THREE, { width: 960, height: 600, quality: QUALITY });
  window.__view = view;
  initState();
  view.setRound(state, LOOK);
  const TICK = SUB;
  let acc = 0, last = clock(), frameMs = 0;
  const first = Math.max(1, Math.min(5, parseInt(q.get('pid') || '1', 10))), order = ids.map((_, i) => ids[(first - 1 + i) % ids.length]);
  const views = order.slice(0, N).map((pid) => ({ pid, cam: CAM }));
  function frame(adv) {
    acc += adv;
    while (acc >= TICK) { acc -= TICK; step(); for (const ev of events) view.event(ev, state); }
    const t0 = realNow();
    view.render(state, acc / TICK, { layout: LAYOUT, views, now: clock() });
    ctx.drawImage(view.canvas, 0, 0);
    frameMs = realNow() - t0;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(4, 4, 260, 18);
    ctx.fillStyle = '#9fe'; ctx.font = '12px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`calls ${view.drawCalls}  frame ${frameMs.toFixed(1)}ms  n=${N} ${CAM} ${QUALITY}`, 8, 7);
  }
  if (simMs > 0) {
    const STEP = 50;
    for (let t = 0; t < simMs; t += STEP) { fake += STEP; frame(STEP); }
    if (q.get('bench') === '1') {
      const ts = []; for (let k = 0; k < 90; k++) { fake += 16.7; frame(16.7); ts.push(frameMs); }
      ts.shift(); const avg = ts.reduce((a, b) => a + b, 0) / ts.length, mx = Math.max(...ts);
      ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(4, 26, 320, 18); ctx.fillStyle = '#ff9'; ctx.fillText(`BENCH avg ${avg.toFixed(2)}ms max ${mx.toFixed(1)}ms calls ${view.drawCalls}`, 8, 29);
      console.log('BENCH', avg, mx, view.drawCalls);
    }
    if (!freeze) (function loop() { fake += 16.7; frame(16.7); requestAnimationFrame(loop); })();
  } else {
    (function loop() { const n = clock(); frame(Math.min(100, n - last)); last = n; requestAnimationFrame(loop); })();
  }
  document.title = 'NSVIEW-RUNNING';
} catch (e) { devFail('Boot-Fehler: ' + (e.stack || e.message)); }
</script>
</body>
</html>
