<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Racer Dev</title>
<!-- Micro Racer without lobby or phones: four bots drive (Dino badly, to show eliminations).
     ?track=desert|snow|beach|vulkan|city|toy|random  ?items=off  ?sim=<ms> fast-forwards with a fake clock.
     With ?sim the page shows the Mitschauen copy (a 2D canvas) instead of the WebGL canvas, because a headless
     screenshot cannot see WebGL:
     firefox --headless --no-remote --profile /tmp/ffp --window-size=980,620 \
       --screenshot out.png "http://localhost:3000/dev-racer.html?track=vulkan&sim=20000" -->
<style>
  html,body { margin:0; background:#0a0a14; }
  /* identisch zur canvas-Regel in screen.html — deckt CSS-Konflikte im Test auf */
  canvas { background:#0d0d1a; border-radius:10px; box-shadow:0 0 50px rgba(120,90,255,.18);
           max-width:calc(100vw - 20px); max-height:calc(100vh - 20px); width:auto; height:auto;
           width:min(calc(100vw - 20px), calc((100vh - 20px) * 1.6)); }
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<script>window.__AC_ROLE__ = 'screen';</script>
<script src="core/sfx.js"></script>
<script src="core/game-registry.js"></script>
<script>
  // Shell-Stubs für isoliertes Testen des Racer-Moduls
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const players = {
    1: { color: '#ff2d55', name: 'Anna', named: true },
    2: { color: '#0a84ff', name: 'Ben', named: true },
    3: { color: '#30d158', name: 'Cleo', named: true },
    4: { color: '#ffd60a', name: 'Dino', named: true }
  };
  const nameOf = (id) => players[id] ? players[id].name : 'Spieler ' + id;
  const shortName = nameOf;
  const hostId = () => 1;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function setBanner(t) { console.log('BANNER:', t); }
  function reportWinners(ids) { console.log("Sieger:", ids); }
  function endToLobby(m) { document.title = 'LOBBY:' + m; console.log('endToLobby:', m); }
  function rr(o, x, y, w, h, r) { o.beginPath(); o.moveTo(x + r, y); o.arcTo(x + w, y, x + w, y + h, r); o.arcTo(x + w, y + h, x, y + h, r); o.arcTo(x, y + h, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath(); }
  const sent = [];
  const ac = { message(to, d) { sent.push([to, d]); if (sent.length > 400) sent.shift(); }, broadcast(d) { sent.push([null, d]); } };
  window.__sent = sent;
</script>
<script src="core/kit3d.js"></script>
<script src="games/racer/meta.js"></script>
<script src="games/racer/tracks.js"></script>
<script src="games/racer/sim.js"></script>
<script src="games/racer/render.js"></script>
<script src="games/racer/screen.js"></script>
<script>
  const logError = console.error.bind(console);
  console.error = (...a) => devFail(a.join(' '));     // errors the game catches itself show up in the screenshot too
  function devFail(msg) {
    let box = document.getElementById('devFail');
    if (!box) {
      box = document.createElement('pre'); box.id = 'devFail';
      box.style.cssText = 'position:fixed; left:0; top:0; right:0; margin:0; padding:14px; z-index:9; background:#400; color:#fff; font:bold 15px monospace; white-space:pre-wrap;';
      document.body.appendChild(box);
    }
    box.textContent += msg + '\n';
    logError(msg);
  }
  window.addEventListener('error', (e) => devFail('JS-Fehler: ' + e.message));
  // Wird vom Module-Script aufgerufen — läuft synchron VOR dem load-Event,
  // damit ein Headless-Screenshot schon Inhalt sieht.
  window.__bootRacer = function () {
    try {
      const q = new URLSearchParams(location.search);
      const simMs = parseInt(q.get('sim') || '0', 10);
      window.RacerView.keepBuffer = true;   // or a headless screenshot shows an empty 3D canvas
      const game = window.GAMES.racer();
      window.__game = game;

      // Simulierte Zeit: Physik läuft synchron vor dem load-Event,
      // damit der Headless-Screenshot mitten im Rennen landet.
      let fake = 1000;
      if (simMs > 0) performance.now = () => fake;

      game.start([1, 2, 3, 4], { track: q.get('track') || 'desert', targetPoints: +q.get('target') || 5, items: q.get('items') || 'on' });
      if (document.title.startsWith('LOBBY:')) { devFail('start() -> ' + document.title); return; }

      // Dino faehrt schlecht -> faellt aus dem Bild; die anderen fahren sauber auf verschiedenen Spuren
      const SKILL = { 1: { look: 14 }, 2: { look: 13, lane: 1.6 }, 3: { look: 16, lane: -1.6, gain: 2.2 }, 4: { look: 9, gain: 0.5, brake: false } };
      function bots() {
        const dbg = game._debug();
        if (!dbg) return;
        for (const id of [1, 2, 3, 4]) {
          const r = dbg.racers[id];
          if (!r || !r.alive) continue;
          const i = RacerSim.autoSteer(dbg.sim, id, SKILL[id]);
          game.onMessage(id, { t: 'raceSteer', s: i.s, b: i.b });
          if (Math.random() < 0.004) game.onMessage(id, { t: 'raceNitro' });
          if (r.item && Math.random() < 0.02) game.onMessage(id, { t: 'raceItem' });
        }
      }

      if (simMs > 0) {
        for (let t = 0; t < simMs; t += 16.7) { fake += 16.7; bots(); game.render(); }
        (function loop() { fake += 16.7; bots(); game.render(); requestAnimationFrame(loop); })();
      } else {
        for (let i = 0; i < 5; i++) game.render();
        (function loop() { bots(); game.render(); requestAnimationFrame(loop); })();
      }
      if (simMs > 0) { racerStage.wrap.style.display = 'none'; cv.style.display = ''; }
      document.title = 'RACER-RUNNING';
    } catch (e) { devFail('Boot-Fehler: ' + (e.stack || e.message)); }
  };
</script>
<script type="module">
  import * as THREE from './vendor/three.module.min.js';
  window.THREE = THREE;
  window.__bootRacer();
</script>
</body>
</html>
