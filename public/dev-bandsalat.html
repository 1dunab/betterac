<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bandsalat Dev</title>
<!-- Bandsalat without lobby or phones: bots play drums, keyboard, bass, a step pattern and the shaker, so one
     person hears a whole band. Click the page once to unlock the sound.
     ?stil=lofi|funk|techno|lager  ?raster=16|8|aus  ?begleitung=aus|klick|beat  ?n=1..8 players
     ?phone=pick|drums|keys|bass|perc|seq  adds the real phone UI as player 1 (play with mouse or the keys A S D F …)
     ?tab=tone  the pattern's tone page   ?only=1  the phone alone (for screenshots)   ?host=0  phone is not the host
     ?sim=<ms> fast-forwards with a fake clock, ?over=1 ends the song there:
     firefox --headless --no-remote --profile /tmp/ffp --window-size=980,620 \
       --screenshot out.png "http://localhost:3000/dev-bandsalat.html?stil=funk&sim=20000"
     firefox --headless --no-remote --profile /tmp/ffp --window-size=390,844 \
       --screenshot phone.png "http://localhost:3000/dev-bandsalat.html?phone=keys&only=1&sim=8000" -->
<style>
  html, body { margin:0; height:100%; font-family:system-ui,sans-serif; color:#fff; background:#1a1a24;
               -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center; gap:14px; }
  /* identisch zur canvas-Regel in screen.html */
  #c { background:#0d0d1a; border-radius:10px; box-shadow:0 0 50px rgba(120,90,255,.18); min-width:0; flex:1 1 auto;
       max-width:calc(100vw - 20px); max-height:calc(100vh - 20px); width:auto; height:auto; object-fit:contain; }
  body:not(.phone) #c { width:min(calc(100vw - 20px), calc((100vh - 20px) * 1.6)); flex:none; }
  /* die Shell-Klassen aus controller.html */
  #phone { display:none; position:relative; width:390px; max-width:100%; height:min(100%, 844px); flex:none; touch-action:none; overflow:hidden; }
  body.phone #phone { display:block; }
  body.only #c { display:none; } body.only #phone { width:100%; height:100%; }
  .view { display:none; flex-direction:column; height:100%; box-sizing:border-box; }
  .view.on { display:flex; }
  .bar { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .word { font-size:22px; font-weight:800; }
  .btn { border:none; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:700; background:#3a3a48; color:#fff; }
  .btn.go { background:#30d158; color:#06250f; flex:1; }
  .center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; }
  .muted { opacity:.75; font-size:15px; }
  #abortBtn { position:absolute; top:8px; right:8px; z-index:1000; display:none; border:none; border-radius:10px;
              padding:8px 12px; font-weight:800; font-size:15px; background:#ff3b30; color:#fff; }
</style>
</head>
<body>
<div id="phone"><button id="abortBtn">✕ Abbrechen</button></div>
<canvas id="c" width="960" height="600"></canvas>
<script>window.__AC_ROLE__ = 'screen';</script>
<script src="core/sfx.js"></script>
<script src="core/game-registry.js"></script>
<script>
  // Shell-Stubs für beide Seiten: der Fernseher und (mit ?phone=) ein Handy auf derselben Seite
  const q = new URLSearchParams(location.search);
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const NAMES = ['Anna', 'Ben', 'Cleo', 'Dino', 'Eva', 'Finn', 'Gül', 'Hugo'];
  const COLORS = ['#ff2d55', '#0a84ff', '#30d158', '#ffd60a', '#bf5af2', '#ff9f0a', '#64d2ff', '#ff6482'];
  const players = {};
  const N = Math.max(1, Math.min(8, +q.get('n') || 5));
  for (let i = 1; i <= N; i++) players[i] = { color: COLORS[i - 1], name: NAMES[i - 1], named: true };
  const nameOf = (id) => players[id] ? players[id].name : 'Spieler ' + id;
  const shortName = nameOf;
  const HUMAN = q.get('phone') ? 1 : null;
  const hostId = () => (q.get('host') === '0' ? 2 : 1);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function setBanner(t) { console.log('BANNER:', t); }
  function reportWinners(ids) { console.log('Sieger:', ids); }
  function endToLobby(m) { document.title = 'LOBBY:' + m; console.log('endToLobby:', m); }
  function rr(o, x, y, w, h, r) { o.beginPath(); o.moveTo(x + r, y); o.arcTo(x + w, y, x + w, y + h, r); o.arcTo(x + w, y + h, x, y + h, r); o.arcTo(x, y + h, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath(); }
  function fitFont(o, text, max, start) { let f = start; o.font = 'bold ' + f + 'px system-ui,sans-serif'; while (o.measureText(text).width > max && f > 10) { f -= 2; o.font = 'bold ' + f + 'px system-ui,sans-serif'; } }
  const $ = (id) => document.getElementById(id);
  const VIEWS = [];
  function showView(v) { VIEWS.forEach(n => $('v-' + n).classList.toggle('on', n === v)); }
  const AirConsole = { SCREEN: 0 };
  const copy = (d) => JSON.parse(JSON.stringify(d));
  const ac = { message(to, d) {
    if (to === 0) { if (window.__game) window.__game.onMessage(HUMAN, copy(d)); }
    else if (to === HUMAN && window.CONTROLLERS.bandsalat) window.CONTROLLERS.bandsalat.onMessage(copy(d));
  } };
</script>
<script src="games/bandsalat/meta.js"></script>
<script src="games/bandsalat/music.js"></script>
<script src="games/bandsalat/synth.js"></script>
<script src="games/bandsalat/screen.js"></script>
<script src="games/bandsalat/controller.js"></script>
<script>
  const logError = console.error.bind(console);
  function devFail(msg) {
    let box = document.getElementById('devFail');
    if (!box) {
      box = document.createElement('pre'); box.id = 'devFail';
      box.style.cssText = 'position:fixed; left:0; top:0; right:0; margin:0; padding:14px; z-index:2000; background:#400; color:#fff; font:bold 15px monospace; white-space:pre-wrap;';
      document.body.appendChild(box);
    }
    box.textContent += msg + '\n';
    logError(msg);
  }
  console.error = (...a) => devFail(a.join(' '));
  window.addEventListener('error', (e) => devFail('JS-Fehler: ' + e.message));
  try {
    const simMs = parseInt(q.get('sim') || '0', 10);
    let fake = 1000;
    if (simMs > 0) performance.now = () => fake;

    ['bspick', 'bsplay'].forEach(v => $('phone').appendChild($('v-' + v)));
    if (HUMAN) document.body.classList.add('phone');
    if (q.get('only')) document.body.classList.add('only');
    $('abortBtn').style.display = HUMAN && hostId() === 1 ? 'block' : 'none';

    const game = window.GAMES.bandsalat();
    window.__game = game;
    game.start(Object.keys(players).map(Number), { stil: q.get('stil') || 'lofi', raster: q.get('raster') || '16', begleitung: q.get('begleitung') || 'klick' });
    const band = () => game._debug().band;
    const say = (id, m) => game.onMessage(id, m);

    // ---- the phone, if there is one ----
    if (HUMAN) {
      window.CONTROLLERS.bandsalat.activate();
      const inst = q.get('phone');
      if (inst !== 'pick') ac.message(0, { t: 'bsPick', inst });
      if (inst === 'seq') { ac.message(0, { t: 'bsSeqPreset', k: 'beat' }); ac.message(0, { t: 'bsSeqPreset', k: 'tone' }); }
      if (q.get('tab') === 'tone') document.querySelector('#bsOpts .bstab[data-k="tone"]').click();
    }

    // ---- bots: each one taps a little before the grid line, like a person who feels the beat ----
    const roles = ['drums', 'keys', 'bass', 'seq', 'perc'], bots = [];
    Object.keys(players).map(Number).filter(id => id !== HUMAN).forEach((id, i) => { if (roles[i]) bots.push({ id, role: roles[i], held: [] }); });
    bots.forEach(b => {
      say(b.id, { t: 'bsPick', inst: b.role });
      if (b.role === 'keys') say(b.id, { t: 'bsSet', sound: 'epiano' });
      if (b.role === 'seq') { say(b.id, { t: 'bsSeqPreset', k: 'tone' }); }
    });
    const let_go = (b) => { b.held.forEach(n => say(b.id, { t: 'bsOff', n })); b.held = []; };
    const hold = (b, n) => { say(b.id, { t: 'bsOn', n }); b.held.push(n); };
    function botStep(b, s) {
      const col = s % 16, hi = band().barInfo(performance.now() / 1000 + 0.05).hi;
      if (b.role === 'drums') {
        if (s === 12) say(b.id, { t: 'bsRec' });                       // records the second bar as a loop …
        if (s < 32) { if (col % 8 === 0) say(b.id, { t: 'bsOn', n: 0 }); if (col % 8 === 4) say(b.id, { t: 'bsOn', n: 1 }); if (col % 2 === 0) say(b.id, { t: 'bsOn', n: 2 }); }
        else { if (col === 14) say(b.id, { t: 'bsOn', n: 4 }); if (s % 64 === 0) say(b.id, { t: 'bsOn', n: 5 }); }   // … then only fills over it
      } else if (b.role === 'keys') {
        if (col === 0) { let_go(b); hold(b, hi[0]); hold(b, hi[2] === undefined ? hi[1] : hi[2]); }
        if (col === 6) { let_go(b); hold(b, hi[1]); }
        if (col === 10) { let_go(b); hold(b, hi[hi.length - 1]); }
        if (col === 14) let_go(b);
      } else if (b.role === 'bass') {
        if (col === 0 || col === 6 || col === 8) { let_go(b); hold(b, 0); }
        if (col === 3 || col === 7 || col === 13) let_go(b);
        if (col === 11) { let_go(b); hold(b, 2); }
        if (col === 14) { let_go(b); hold(b, 4); }
      } else if (b.role === 'perc') {
        if (col % 2 === 1) say(b.id, { t: 'bsOn', n: 0 });
        if (col === 4 || col === 12) say(b.id, { t: 'bsOn', n: 3 });
      }
    }
    let last = -1;
    function frame() {
      const b = band();
      if (!b.state.over) {
        const s = Math.floor(b.stepOf(performance.now() / 1000) + 0.4);
        for (; last < s; last++) bots.forEach(bot => botStep(bot, last + 1));
      }
      game.render();
    }
    if (simMs > 0) for (let t = 0; t < simMs; t += 16.7) { fake += 16.7; frame(); }
    if (q.get('over')) { say(hostId(), { t: 'bsFinale' }); for (let i = 0; i < 400; i++) { fake += 16.7; frame(); } }
    (function loop() { if (simMs > 0) fake += 16.7; frame(); requestAnimationFrame(loop); })();
    document.title = 'BANDSALAT-RUNNING';
  } catch (e) { devFail('Boot-Fehler: ' + (e.stack || e.message)); }
</script>
</body>
</html>
