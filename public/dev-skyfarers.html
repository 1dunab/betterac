<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Skyfarers Dev</title>
<!-- Full TV harness: real sim + renderer + fx + glue; the human captains are bot "phones" that send
     skStick/skBoost/skAct/skBuild through game.onMessage like real phones.
     ?n=0..8 humans (default 2)  ?bots=0..3 (default 1)  ?dauer=kurz|normal|lang  ?schwierigkeit=leicht|normal|heftig
     ?quality=auto|high|low  ?seed=<int>  ?sim=<ms fast-forward, fake clock>  ?freeze=1 (stop after fast-forward)
     ?blit=1 (show cv instead of the WebGL wrapper — needed for headless Firefox screenshots, cv is 1440x900)
     ?bench=N (after fast-forward: average ms/frame of N frames, printed top-left)  ?end=1 (run on until the end screen)
     ?phones=0 (humans idle)  ?fx=0 ... (reserved)
     firefox --headless --no-remote --profile /tmp/ffp --window-size=1600,1000 \
       --screenshot out.png "http://localhost:3995/dev-skyfarers.html?blit=1&freeze=1&sim=110000&dauer=normal" -->
<style>
  html,body { margin:0; background:#0a0a14; }
  canvas { background:#0d0d1a; border-radius:10px; box-shadow:0 0 50px rgba(120,90,255,.18);
           max-width:calc(100vw - 20px); max-height:calc(100vh - 84px); width:auto; height:auto; }
  #bench { position:fixed; left:8px; top:8px; z-index:9; font:bold 16px monospace; color:#9f9; background:rgba(0,0,0,.7); padding:4px 8px; display:none; }
  #err { position:fixed; left:8px; right:8px; top:40px; z-index:10; font:bold 16px monospace; color:#fff; background:#a00; padding:8px; white-space:pre-wrap; display:none; }
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<div id="bench"></div><div id="err"></div>
<script>window.__AC_ROLE__ = 'screen';</script>
<script src="core/sfx.js"></script>
<script src="core/game-registry.js"></script>
<script>
  // ---- shell stubs ----
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const players = {
    1: { color: '#ff2d55', name: 'Anna', named: true }, 2: { color: '#0a84ff', name: 'Ben', named: true },
    3: { color: '#30d158', name: 'Cleo', named: true }, 4: { color: '#ffd60a', name: 'Dino', named: true },
    5: { color: '#bf5af2', name: 'Eva', named: true }, 6: { color: '#ff9f0a', name: 'Finn', named: true },
    7: { color: '#64d2ff', name: 'Gina', named: true }, 8: { color: '#ac8e68', name: 'Hugo', named: true }
  };
  const nameOf = (id) => players[id] ? players[id].name : 'Spieler ' + id;
  const shortName = nameOf;
  const hostId = () => 1;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function setBanner(t) { console.log('BANNER:', t); }
  function reportWinners(ids) { console.log('Sieger:', ids); window.__winners = ids; document.title = 'WINNERS:' + ids; }
  function endToLobby(m) { document.title = 'LOBBY:' + m; console.log('endToLobby:', m); devFail('endToLobby: ' + m); }
  function rr(o, x, y, w, h, r) { o.beginPath(); o.moveTo(x + r, y); o.arcTo(x + w, y, x + w, y + h, r); o.arcTo(x + w, y + h, x, y + h, r); o.arcTo(x, y + h, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath(); }
  const phones = {};            // id → { msgs: {t: last message} }, for inspection from the console
  const ac = { message(id, d) { (phones[id] = phones[id] || {})[d.t] = d; if (d.t === 'skPhase' || d.t === 'skInfo' || d.t === 'skToast') console.log('->', id, JSON.stringify(d).slice(0, 200)); } };

  function devFail(msg) {
    cv.style.display = '';
    ctx.fillStyle = '#300'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    String(msg).match(/.{1,80}/g).forEach((line, i) => ctx.fillText(line, 20, 50 + i * 26));
    const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = String(msg).slice(0, 600);
    console.error(msg);
  }
  window.addEventListener('error', (e) => devFail('JS-Fehler: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  window.addEventListener('unhandledrejection', (e) => devFail('Promise-Fehler: ' + (e.reason && e.reason.stack || e.reason)));
</script>
<script src="games/skyfarers/meta.js"></script>
<script src="games/skyfarers/world.js"></script>
<script src="games/skyfarers/sim.js"></script>
<script src="games/skyfarers/art.js"></script>
<script src="games/skyfarers/fx.js"></script>
<script src="games/skyfarers/render.js"></script>
<script src="games/skyfarers/sound.js"></script>
<script src="games/skyfarers/screen.js"></script>
<script type="module">import * as THREE from './vendor/three.module.min.js'; window.THREE = THREE;</script>
<script type="module">
  try {
    const q = new URLSearchParams(location.search);
    const P = (k, d) => q.get(k) == null ? d : q.get(k);
    const N = Math.max(0, Math.min(8, parseInt(P('n', '2'), 10)));
    const simMs = parseInt(P('sim', '0'), 10), freeze = P('freeze', '0') === '1', bench = parseInt(P('bench', '0'), 10);
    const blit = P('blit', '0') === '1';
    const realNow = performance.now.bind(performance);
    if (P('seed', '')) {   // mulberry32 → reproducible cosmetic randomness
      let a = parseInt(P('seed', '1'), 10) | 0;
      Math.random = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    }
    let fake = 1000;
    if (simMs > 0 || P('end', '0') === '1') performance.now = () => fake;
    if (blit) { cv.width = 1440; cv.height = 900; }

    const ids = [1, 2, 3, 4, 5, 6, 7, 8].slice(0, N);
    const cfg = {
      dauer: P('dauer', 'normal'), schwierigkeit: P('schwierigkeit', 'normal'), bots: parseInt(P('bots', '1'), 10),
      quality: P('quality', 'auto'), seed: parseInt(P('seed', '0'), 10) || 0
    };
    const game = window.GAMES.skyfarers();
    window.__game = game;
    if (N === 0) { devFail('n=0: Skyfarers braucht mindestens einen Menschen'); throw new Error('n=0'); }
    game.start(ids, cfg);

    // ---- bot phones: fly like a human would, only through the phone protocol ----
    const Wd = window.SkyfarersWorld, Sim = window.SkyfarersSim, PLAN = [['windrad', 1], ['zisterne', 1], ['kanone', 1], ['werkstatt', 1], ['sternwarte', 3], ['kanone', 2], ['windrad', 2]];
    const brain = {};
    ids.forEach((id) => { brain[id] = { stick: [0, 0], boost: false, act: false, buildAt: 0, nextThink: 0 }; });
    function send(id, m) { game.onMessage(id, m); }
    function nextBuild(st) {
      const count = (k) => k === 'sternwarte' ? (st.slots[0].kind === 'sternwarte' ? st.slots[0].stage : 0) : st.slots.filter((s) => s.kind === k).length;
      for (const [k, n] of PLAN) {
        if (count(k) >= n) continue;
        if (k === 'sternwarte' && st.slots[0].kind && st.slots[0].build < 1) return null;   // wait for the stage in progress
        const c = Wd.BUILDINGS[k].cost;
        return st.stock.holz >= c.holz && st.stock.kristall >= c.kristall ? k : null;
      }
      return null;
    }
    function think(id, now) {
      const dbg = game._debug(); if (!dbg.sim || dbg.phase === 'end') return;
      const st = dbg.sim.state, s = st.ships.find((x) => x.pid === id), b = brain[id];
      if (!s) return;
      const cargo = s.cargo.holz + s.cargo.kristall, ang = Math.atan2(s.y, s.x);
      const dock = [Math.cos(ang) * 19, Math.sin(ang) * 19];
      const soon = st.event || (st.next && st.next.at - st.t < 18);
      const home = cargo >= s.cap || (cargo > 0 && soon);
      let tgt = dock, act = false;
      // fires first (like a human watching the screen): spray from the burning slot's side, else fetch rain water
      const fireSl = st.slots.filter((x) => x.kind && !x.ruined && x.fire > 0).sort((a, b) => b.fire - a.fire)[0];
      const hs = fireSl && dbg.sim.world.home.slots[fireSl.i];
      let fireJob = false;
      if (fireSl && s.water > 0.3) {
        const a = fireSl.i ? hs.angle : ang, R = Sim.CONST.BOT_SPRAY_R;
        tgt = [Math.cos(a) * R, Math.sin(a) * R]; act = true; fireJob = true;
      } else if (fireSl && st.clouds.length) {
        let c = st.clouds[0]; for (const o of st.clouds) if (Math.hypot(o.x - s.x, o.y - s.y) < Math.hypot(c.x - s.x, c.y - s.y)) c = o;
        tgt = [c.x, c.y]; act = true; fireJob = true;
      }
      if (fireJob) { /* already steering */ } else if (!home && !(soon && cargo === 0 && st.event)) {
        const want = st.stock.kristall <= st.stock.holz ? 'kristall' : 'holz';
        let best = null, bd = 1e9;
        for (const isl of st.islets) {
          if (isl.amount < 1 || (isl.kind !== want && st.islets.some((o) => o.kind === want && o.amount >= 1))) continue;
          const d = Math.hypot(isl.x - s.x, isl.y - s.y);
          if (d < bd) { bd = d; best = isl; }
        }
        if (best) {
          const r = dbg.sim.world.islets.find((w) => w.id === best.id).r, dx = s.x - best.x, dy = s.y - best.y, L = Math.hypot(dx, dy) || 1;
          tgt = [best.x + dx / L * (r + 2.6), best.y + dy / L * (r + 2.6)];
          act = true;
        }
      } else act = true;      // heading home: like a human, keep the context button held (shield, spray, repair, horn)
      if (s.docked) act = true;   // docked: repair / extinguish / shield only happen while the button is held
      const dx = tgt[0] - s.x, dy = tgt[1] - s.y, dist = Math.hypot(dx, dy);
      const mag = clamp(dist / 7, 0, 1);
      const stick = dist < 0.8 ? [0, 0] : [dx / dist * mag, dy / dist * mag];
      if (Math.abs(stick[0] - b.stick[0]) > 0.04 || Math.abs(stick[1] - b.stick[1]) > 0.04) { b.stick = stick; send(id, { t: 'skStick', x: stick[0], y: stick[1] }); }
      const boost = dist > 25 && s.boost > 0.25;
      if (boost !== b.boost) { b.boost = boost; send(id, { t: 'skBoost', on: boost }); }
      if (act !== b.act) { b.act = act; send(id, { t: 'skAct', on: act }); }
      if (s.docked && now - b.buildAt > 1500) {
        b.buildAt = now;
        const k = nextBuild(st);
        if (k) send(id, { t: 'skBuild', kind: k });
      }
    }
    const phonesOn = P('phones', '1') !== '0';

    let last = 0;
    const step = () => {
      fake += 16.7;
      if (phonesOn && fake - last >= 120) { last = fake; ids.forEach((id) => think(id, fake)); }
      game.render();
    };
    const stopAtEnd = P('end', '0') === '1';
    if (simMs > 0 || stopAtEnd) {
      game._fast(true);
      const until = stopAtEnd ? 1e9 : simMs;
      let t = 0;
      for (; t < until; t += 16.7) { step(); if (stopAtEnd && game._debug().phase === 'end') break; }
      game._fast(false);
      for (let i = 0; i < 40; i++) step();              // let weather and camera settle on the target state
      if (stopAtEnd) { for (let i = 0; i < 120; i++) step(); }
      if (bench > 0) {
        const t0 = realNow();
        for (let i = 0; i < bench; i++) { step(); }
        const ms = (realNow() - t0) / bench, v = game._debug().view;
        const el = document.getElementById('bench'); el.style.display = 'block';
        el.textContent = 'bench ' + bench + ' frames: ' + ms.toFixed(1) + ' ms/frame  calls ' + (v && v.drawCalls) + '  tris ' + (v && Math.round(v.triangles / 1000)) + 'k  ' + (v && v.W) + 'x' + (v && v.H);
        document.title = 'BENCH ' + ms.toFixed(1);
      }
      if (!freeze) (function loop() { step(); requestAnimationFrame(loop); })();
    } else {
      (function loop() { if (phonesOn) { const n = realNow(); if (n - last >= 120) { last = n; ids.forEach((id) => think(id, n)); } } game.render(); requestAnimationFrame(loop); })();
    }
    if (!document.title.startsWith('LOBBY')) document.title = (document.title.startsWith('BENCH') ? document.title : 'DEV-RUNNING ') + ' ' + game._debug().phase;
  } catch (e) { devFail('Boot-Fehler: ' + (e.stack || e.message)); }
</script>
</body>
</html>
