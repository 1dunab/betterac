<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Furt &amp; Fehde Karte</title>
<!-- 2D preview of FurtWorld.make(seed): layers, seed browser, level slider, crossings, path tool, fairness table.
     URL: ?seed=&layer=classes,shade,owner,flow,water,trees,deco,roads,sites,cross,cells&L=&grid=1&a=x,y&b=x,y&panel=0&s=px/unit&view=x0,y0,x1,y1&ex=shade-exaggeration
     firefox --headless --no-remote --profile /tmp/ffp --window-size=1500,760 --screenshot out.png "http://localhost:3981/dev-furtfehde-map.html?seed=3&L=0" -->
<style>
  html,body { margin:0; background:#15181c; color:#dfe6ee; font:13px/1.35 system-ui,sans-serif; }
  #app { display:flex; gap:10px; padding:8px; align-items:flex-start; }
  canvas { background:#223; border-radius:6px; cursor:crosshair; flex:none; }
  #panel { width:390px; flex:none; }
  h1 { font-size:16px; margin:0 0 6px; } h2 { font-size:12px; margin:10px 0 3px; color:#9fb3c8; text-transform:uppercase; letter-spacing:.06em; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:3px 0; }
  button,input { font:inherit; background:#26303a; color:#dfe6ee; border:1px solid #3a4856; border-radius:4px; padding:2px 7px; }
  input[type=number] { width:70px; } input[type=range] { width:200px; padding:0; }
  label { white-space:nowrap; margin-right:6px; }
  table { border-collapse:collapse; width:100%; } td,th { padding:1px 5px; text-align:right; border-bottom:1px solid #2a323b; } th { color:#9fb3c8; font-weight:600; } td:first-child,th:first-child { text-align:left; }
  .bad { color:#ff7a7a; } .good { color:#8fe08f; } .dim { color:#8796a6; }
  #status { min-height:1.4em; color:#b9c7d6; font-family:monospace; font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="panel">
    <h1>🏰 Furt &amp; Fehde — Karte</h1>
    <div class="row"><button id="prev">◀</button><input id="seed" type="number" value="1"><button id="next">▶</button><button id="rnd">🎲</button><span id="gen" class="dim"></span></div>
    <div class="row">Pegel L <input id="L" type="range" min="0" max="1" step="0.005" value="0"><b id="Lv">0.00</b> <button id="ebb">🌊 ablaufen</button></div>
    <div class="row" id="layers"></div>
    <div id="status">&nbsp;</div>
    <h2>Burgen (Fairness)</h2><div id="fair"></div>
    <h2>Wege Burg ↔ Burg bei L = 0</h2><div id="pairs"></div>
    <h2>Übergänge</h2><div id="cross"></div>
    <h2>Wegewerkzeug</h2><div class="dim">Klick = Start, zweiter Klick = Ziel, dritter = neu</div><div id="pathinfo">&nbsp;</div>
  </div>
</div>
<script src="games/furtfehde/world.js"></script>
<script>
(function () {
  const W = FurtWorld, X0 = -84, Y0 = -57, HX = W.HX, HY = W.HY;
  const q = new URLSearchParams(location.search);
  const S = parseFloat(q.get('s') || '6') || 6, vw = (q.get('view') || '-84,-57,84,57').split(',').map(Number);   // px per unit; view = x0,y0,x1,y1 in world units
  const EX = parseFloat(q.get('ex') || '1') || 1;   // hillshade exaggeration
  const VX0 = vw[0], VY0 = vw[1], EW = vw[2] - vw[0], EH = vw[3] - vw[1];
  const LAYERS = ['classes', 'shade', 'owner', 'flow', 'water', 'trees', 'deco', 'roads', 'sites', 'cross', 'cells', 'build'];
  const num2 = (s) => { if (!s) return null; const p = s.split(',').map(Number); return p.length === 2 && p.every(isFinite) ? { x: p[0], y: p[1] } : null; };
  const st = { seed: parseInt(q.get('seed') || '1', 10) || 1, L: parseFloat(q.get('L') || '0') || 0, grid: q.get('grid') === '1',
    layers: new Set((q.get('layer') || 'classes,shade,water,trees,roads,sites,cross').split(',')), a: num2(q.get('a')), b: num2(q.get('b')) };
  if (q.get('panel') === '0') document.getElementById('panel').style.display = 'none';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  cv.width = EW * S; cv.height = EH * S;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v)), AB = ['NW', 'NO', 'SW', 'SO'], LORD = ['#e0453a', '#3a7be0', '#e6b830', '#9a4ad8'], $ = (id) => document.getElementById(id);
  const rgb = (hex) => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  const CC = W.CLASSES.map(c => rgb(c.color));
  let world = null, shade = null, makeMs = 0;

  function mk() {
    const t0 = performance.now();
    world = W.make(st.seed);
    makeMs = performance.now() - t0;
    const h = world.heights, n = HX * HY;
    shade = new Float32Array(n);
    const lx = -0.5, ly = -0.55, lz = 0.67, ln = Math.hypot(lx, ly, lz), flat = lz / ln;
    for (let v = 0; v < HY; v++) for (let u = 0; u < HX; u++) {
      const sx = (h[v * HX + Math.min(HX - 1, u + 1)] - h[v * HX + Math.max(0, u - 1)]), sy = (h[Math.min(HY - 1, v + 1) * HX + u] - h[Math.max(0, v - 1) * HX + u]);
      const nx = -sx * EX, ny = -sy * EX, nz = 1, nn = Math.hypot(nx, ny, nz);
      shade[v * HX + u] = Math.max(0, (nx * lx + ny * ly + nz * lz) / (nn * ln)) / flat;
    }
  }
  const P = (x, y) => [(x - VX0) * S, (y - VY0) * S];

  function draw() {
    const w = world, L = st.L, img = ctx.createImageData(cv.width, cv.height), d = img.data, hq = w.hq, cls = w.cls, owner = w.owner, hts = w.heights;
    const showCls = st.layers.has('classes'), showShade = st.layers.has('shade'), showWater = st.layers.has('water'), showOwner = st.layers.has('owner');
    for (let py = 0; py < cv.height; py++) {
      const y = VY0 + (py + 0.5) / S, v = clamp(Math.round((y - Y0) * 2), 0, HY - 1);
      for (let px = 0; px < cv.width; px++) {
        const x = VX0 + (px + 0.5) / S, u = clamp(Math.round((x - X0) * 2), 0, HX - 1), vi = v * HX + u, k = W.cellOf(x, y);
        const h = hts[vi];
        let c, depth;
        if (k >= 0) {
          c = showCls ? CC[cls[k]] : [150, 150, 150];
          depth = L * 1.2 - hq[k] * 0.1;
        } else {   // decorative border: colour from the height only
          c = h < -0.45 ? CC[0] : h < 0 ? CC[1] : h < 0.2 ? CC[2] : h < 1.2 ? CC[5] : h < 2.4 ? CC[6] : [Math.max(60, 150 - h * 12), Math.max(70, 160 - h * 12), Math.max(50, 100 - h * 8)];
          if (showCls && k < 0) c = [c[0] * 0.8, c[1] * 0.8, c[2] * 0.8];
          depth = L * 1.2 - h;
        }
        let r = c[0], g = c[1], b = c[2];
        if (showShade) { const f = Math.max(0.55, Math.min(1.45, shade[vi])); r *= f; g *= f; b *= f; }
        if (showOwner && k >= 0 && owner[k] >= 0) { const o = rgb(LORD[owner[k]]); r = r * 0.68 + o[0] * 0.32; g = g * 0.68 + o[1] * 0.32; b = b * 0.68 + o[2] * 0.32; }
        if (showWater && depth > 0) {
          const t = Math.min(1, depth / 1.6), a = 0.55 + 0.4 * t;
          const wr = 124 + (30 - 124) * t, wg = 195 + (88 - 195) * t, wb = 207 + (135 - 207) * t, f = showShade ? 0.9 + 0.1 * shade[vi] : 1;
          r = r * (1 - a) + wr * a * f; g = g * (1 - a) + wg * a * f; b = b * (1 - a) + wb * a * f;
          if (depth <= 0.45 && k >= 0) { r = r * 0.85 + 255 * 0.15; g = g * 0.85 + 255 * 0.15; b = b * 0.85 + 255 * 0.15; }   // wadeable: lighter
        }
        const o = (py * cv.width + px) * 4;
        d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    // grid and playable frame
    if (st.grid) {
      ctx.lineWidth = 1;
      for (let i = 0; i <= 144; i++) { ctx.strokeStyle = i % 10 === 0 ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.12)'; const [gx] = P(-72 + i, 0); ctx.beginPath(); ctx.moveTo(gx, P(0, -45)[1]); ctx.lineTo(gx, P(0, 45)[1]); ctx.stroke(); }
      for (let j = 0; j <= 90; j++) { ctx.strokeStyle = j % 10 === 0 ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.12)'; const gy = P(0, -45 + j)[1]; ctx.beginPath(); ctx.moveTo(P(-72, 0)[0], gy); ctx.lineTo(P(72, 0)[0], gy); ctx.stroke(); }
    }
    ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.2;
    ctx.strokeRect(P(-72, -45)[0], P(-72, -45)[1], 144 * S, 90 * S); ctx.setLineDash([]);
    if (st.layers.has('build')) {   // demo: 12 buildings per lord, each placed with FurtWorld.suggest on the growing occupancy
      const seq = ['hof', 'huette', 'holzfaeller', 'steinbruch', 'kornspeicher', 'lager', 'kaserne', 'huette', 'wachturm', 'brunnen', 'hof', 'huette'], keys = Object.keys(W.BUILDINGS);
      ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let lord = 0; lord < 4; lord++) {
        const occ = new Uint8Array(W.GW * W.GH);
        for (const kind of seq) {
          const sp = W.suggest(w, kind, lord, { L: st.L, occ });
          if (!sp) continue;
          const [bw, bh] = W.footprintOf(kind, sp.rot), [x, y] = P(sp.i - 72, sp.j - 45), B = W.BUILDINGS[kind];
          for (let dj = 0; dj < bh; dj++) for (let di = 0; di < bw; di++) occ[(sp.j + dj) * W.GW + sp.i + di] = 1 + keys.indexOf(kind);
          ctx.fillStyle = B.mat === 'holz' ? 'rgba(190,140,80,.92)' : 'rgba(170,175,185,.95)'; ctx.fillRect(x, y, bw * S, bh * S);
          ctx.strokeStyle = LORD[lord]; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, bw * S - 2, bh * S - 2);
          ctx.fillStyle = '#000'; ctx.fillText(B.icon, x + bw * S / 2, y + bh * S / 2);
        }
      }
    }
    if (st.layers.has('cells')) {
      ctx.fillStyle = 'rgba(255,0,200,.35)';
      for (const c of w.crossings) for (const k of c.cells) { const p = W.cellXY(k); ctx.fillRect(P(p.x - 0.5, p.y - 0.5)[0], P(p.x - 0.5, p.y - 0.5)[1], S, S); }
    }
    if (st.layers.has('flow')) {
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 1;
      for (let fj = 1; fj < W.FY; fj += 3) for (let fi = 1; fi < W.FX; fi += 3) {
        const o = (fj * W.FX + fi) * 2, vx = w.flow[o], vy = w.flow[o + 1], sp = Math.hypot(vx, vy);
        if (sp < 0.05) continue;
        const [cx, cy] = P(X0 + fi + 0.5, Y0 + fj + 0.5), ex = cx + vx * S * 2.4, ey = cy + vy * S * 2.4, a = Math.atan2(vy, vx);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.lineTo(ex - Math.cos(a - 0.5) * 3, ey - Math.sin(a - 0.5) * 3); ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(a + 0.5) * 3, ey - Math.sin(a + 0.5) * 3); ctx.stroke();
      }
    }
    if (st.layers.has('roads')) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const r of w.roads) { ctx.beginPath(); r.forEach((p, i) => { const [x, y] = P(p.x, p.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.strokeStyle = 'rgba(120,88,48,.9)'; ctx.lineWidth = 3.2; ctx.stroke(); ctx.strokeStyle = 'rgba(214,184,128,.9)'; ctx.lineWidth = 1.7; ctx.stroke(); }
    }
    if (st.layers.has('trees')) {
      const col = { laub: '#2f8a3c', nadel: '#1d5a3c', weide: '#9bbf44' };
      for (const t of w.trees) { const [x, y] = P(t.x, t.y); ctx.fillStyle = col[t.kind]; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(x, y, Math.max(1.6, 0.55 * t.s * S * (t.kind === 'weide' ? 1.1 : 0.9)), 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1; ctx.fillStyle = '#9b9ba2';
      for (const r of w.rocks) { const [x, y] = P(r.x, r.y); ctx.beginPath(); ctx.arc(x, y, Math.max(1.8, 0.55 * r.s * S), 0, 7); ctx.fill(); }
    }
    if (st.layers.has('deco')) {
      const col = { schilf: '#d8d27a', blume: '#fff07a', stein: '#bdbdc4', busch: '#3f9a4a' };
      for (const e of w.deco) { const [x, y] = P(e.x, e.y); ctx.fillStyle = col[e.kind]; ctx.fillRect(x - 1, y - 1, 2.2, 2.2); }
    }
    if (st.layers.has('sites')) {
      ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const s of w.sites) {
        const [x, y] = P(s.keep.i - 72, s.keep.j - 45);
        ctx.fillStyle = LORD[s.s] + 'cc'; ctx.fillRect(x, y, 6 * S, 6 * S); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(x, y, 6 * S, 6 * S);
        ctx.fillStyle = '#fff'; ctx.fillText('🏰', x + 3 * S, y + 3 * S);
        ctx.fillStyle = '#000'; ctx.fillText(s.name, x + 3 * S + 1, y + 7.4 * S + 1); ctx.fillStyle = '#fff'; ctx.fillText(s.name, x + 3 * S, y + 7.4 * S);
      }
      const wd = w.werder, [tx, ty] = P(wd.tower.x, wd.tower.y);
      ctx.fillStyle = '#fff'; ctx.fillText('🗼', tx, ty);
    }
    if (st.layers.has('cross')) {
      ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const c of w.crossings) {
        const [x, y] = P(c.x, c.y), lab = c.name + ' ' + c.open.toFixed(3), tw = ctx.measureText(lab).width + 8;
        const oy = c.kind === 'furt' && c.water === 'fluss' ? -22 : -14;
        ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(x - tw / 2, y + oy - 8, tw, 16);
        ctx.fillStyle = c.kind === 'furt' ? '#8fe3ff' : c.kind === 'steg' ? '#ffd38f' : '#ffb0b0'; ctx.fillText(lab, x, y + oy);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.stroke();
        for (const e of c.ends) { const [ex, ey] = P(e.x, e.y); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(ex, ey, 2.2, 0, 7); ctx.fill(); }
      }
    }
    if (st.a) { const [x, y] = P(st.a.x, st.a.y); ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); ctx.strokeStyle = '#000'; ctx.stroke(); }
    if (st.b) { const [x, y] = P(st.b.x, st.b.y); ctx.fillStyle = '#ff4fd8'; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); ctx.strokeStyle = '#000'; ctx.stroke(); }
    let info = '&nbsp;';
    if (st.a && st.b) {
      const p = W.path(w, st.a, st.b, st.L);
      if (p) {
        ctx.beginPath(); p.forEach((pt, i) => { const [x, y] = P(pt.x, pt.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.strokeStyle = '#000'; ctx.lineWidth = 4.5; ctx.stroke(); ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 2.2; ctx.stroke();
        info = 'Länge <b>' + p.len.toFixed(1) + '</b> · Zeit <b>' + p.time.toFixed(1) + '</b> (Faktor ' + (p.time / p.len).toFixed(2) + ') · ' + (p.length - 1) + ' Teilstücke' + (p.time / p.len > 1.12 ? ' · 💦 nasse Strecke' : '');
      } else info = '<span class="bad">kein Weg bei L = ' + st.L.toFixed(2) + '</span>';
    }
    $('pathinfo').innerHTML = info;
  }

  function panel() {
    const w = world, sites = w.stats.sites, pairs = w.stats.pairs;
    const mean = (f) => sites.reduce((a, s) => a + f(s), 0) / sites.length;
    const row = (name, f, rule) => {
      const m = mean(f), dev = Math.max(...sites.map(s => Math.abs(f(s) - m) / m)), ok = rule(sites.map(f), dev);
      return '<tr><td>' + name + '</td>' + sites.map(s => '<td>' + f(s) + '</td>').join('') + '<td class="' + (ok ? 'good' : 'bad') + '">±' + (dev * 100).toFixed(1) + '%</td></tr>';
    };
    $('fair').innerHTML = '<table><tr><th></th>' + w.sites.map(s => '<th style="color:' + LORD[s.s] + '">' + AB[s.s] + '</th>').join('') + '<th>Abw.</th></tr>' +
      row('Fläche', s => s.area, (a, d) => d <= 0.08) + row('Bauland', s => s.build, (a, d) => d <= 0.10) + row('Aue', s => s.aue, (a, d) => Math.min(...a) >= 60 && d <= 0.25) +
      row('Wald ≤30', s => s.forest, (a, d) => Math.min(...a) >= 120 && d <= 0.20) + row('Fels ≤34', s => s.rock, (a, d) => Math.min(...a) >= 30 && d <= 0.25) + '</table>';
    const types = ['bach', 'fluss', 'diagonal'];
    $('pairs').innerHTML = '<table>' + types.map(t => {
      const ps = pairs.filter(p => p.type === t), lens = ps.map(p => p.len), m = lens.reduce((a, b) => a + b, 0) / lens.length, sp = (Math.max(...lens) - Math.min(...lens)) / m;
      return '<tr><td>' + t + '</td><td>' + ps.map(p => AB[p.a] + '–' + AB[p.b] + ' ' + p.len.toFixed(1)).join(' · ') + '</td><td class="' + (sp <= 0.12 ? 'good' : 'bad') + '">' + (sp * 100).toFixed(1) + '%</td></tr>';
    }).join('') + '</table>';
    $('cross').innerHTML = '<table><tr><th>Name</th><th>Art</th><th>open</th><th>len</th><th>Zellen</th><th>verbindet</th></tr>' + w.crossings.map(c =>
      '<tr><td>' + c.name + '</td><td>' + c.kind + '</td><td>' + c.open.toFixed(3) + '</td><td>' + c.len.toFixed(1) + '</td><td>' + c.cells.length + '</td><td>' + c.joins.map(j => AB[j]).join('–') + '</td></tr>').join('') + '</table>';
    $('gen').innerHTML = makeMs.toFixed(0) + ' ms · Versuch ' + (w.stats.attempts || '?') + (w.unfair ? ' · <b class="bad">UNFAIR</b>' : '') + ' · ' + w.trees.length + ' Bäume';
    $('seed').value = st.seed; $('L').value = st.L; $('Lv').textContent = st.L.toFixed(2);
  }

  // controls
  $('layers').innerHTML = LAYERS.map(l => '<label><input type="checkbox" data-l="' + l + '"' + (st.layers.has(l) ? ' checked' : '') + '> ' + l + '</label>').join('') + '<label><input type="checkbox" id="grid"' + (st.grid ? ' checked' : '') + '> grid</label>';
  function sync() {
    const p = new URLSearchParams(); p.set('seed', st.seed); p.set('L', st.L); p.set('layer', [...st.layers].join(',')); if (st.grid) p.set('grid', 1);
    if (st.a) p.set('a', st.a.x.toFixed(1) + ',' + st.a.y.toFixed(1)); if (st.b) p.set('b', st.b.x.toFixed(1) + ',' + st.b.y.toFixed(1));
    try { history.replaceState(null, '', '?' + p); } catch (e) { /* ignore */ }
  }
  const refresh = (regen) => { if (regen) { mk(); panel(); } $('Lv').textContent = st.L.toFixed(2); draw(); sync(); };
  const setSeed = (s) => { st.seed = Math.max(0, s | 0); st.a = st.b = null; refresh(true); };
  $('prev').onclick = () => setSeed(st.seed - 1); $('next').onclick = () => setSeed(st.seed + 1); $('rnd').onclick = () => setSeed(1 + Math.floor(Math.random() * 99999));
  $('seed').onchange = (e) => setSeed(parseInt(e.target.value, 10) || 1);
  $('L').oninput = (e) => { st.L = parseFloat(e.target.value); refresh(false); };
  $('layers').onchange = (e) => { if (e.target.id === 'grid') st.grid = e.target.checked; else if (e.target.checked) st.layers.add(e.target.dataset.l); else st.layers.delete(e.target.dataset.l); refresh(false); };
  let ebbT = 0;
  $('ebb').onclick = () => { clearInterval(ebbT); st.L = 1; ebbT = setInterval(() => { st.L = Math.max(0, st.L - 0.01); $('L').value = st.L; refresh(false); if (st.L <= 0) clearInterval(ebbT); }, 60); };
  document.addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT' && e.target.type === 'number') return; if (e.key === 'ArrowLeft') setSeed(st.seed - 1); if (e.key === 'ArrowRight') setSeed(st.seed + 1); });
  const at = (e) => { const r = cv.getBoundingClientRect(); return { x: VX0 + (e.clientX - r.left) * cv.width / r.width / S, y: VY0 + (e.clientY - r.top) * cv.height / r.height / S }; };
  cv.onclick = (e) => { const p = at(e); if (!st.a || (st.a && st.b)) { st.a = p; st.b = null; } else st.b = p; refresh(false); };
  cv.onmousemove = (e) => {
    const p = at(e), k = W.cellOf(p.x, p.y), h = W.heightAt(world, p.x, p.y);
    $('status').textContent = 'x ' + p.x.toFixed(1) + '  y ' + p.y.toFixed(1) + '  h ' + h.toFixed(2) + (k >= 0 ? '  Zelle ' + k + ' (' + (k % 144) + ',' + Math.floor(k / 144) + ') ' + W.CLASSES[world.cls[k]].name + ' hq ' + world.hq[k] + ' Burg ' + world.owner[k] + ' walk ' + W.walk(world, k, st.L).toFixed(2) : '  (Rand)');
  };
  refresh(true);
  window.__ff = { st, get world() { return world; }, refresh };
})();
</script>
