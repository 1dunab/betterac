<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Furt &amp; Fehde Art Gallery</title>
<!-- Model gallery for games/furtfehde/art.js: every model on a turntable, tris + draw calls next to it.
     ?only=all|buildings|sites|ruins|burnt|keep|<kind>|units|carry|column|banners|trees|rocks|deco|bridges|ruin|props
        <kind> = huette hof kornspeicher lager holzfaeller steinbruch kaserne wachturm brunnen (construction stages, damage, burnt,
        ruined; hof also growth stages). units = 5 kinds x 4 animations in 4 lord colours.
     ?cell=<index> (show only that model of the section, large)  ?pick=<i,j,k> (several, large)   ?shadow=1   ?quality=low   ?spin=0   ?t=<seconds> (freezes the clock at t; add &anim=1 to keep it running)   ?night=1
     ?el=<elevation deg>  ?zoom=<factor>  ?fov=<deg>  ?team=<0..3 colour index of the first cell>
     firefox --headless --no-remote --profile /tmp/ffp --window-size=1600,1000 --screenshot out.png \
       "http://localhost:3982/dev-furtfehde-art.html?only=huette&t=2" -->
<style>
  html,body { margin:0; background:#1b2418; color:#e9f1d8; font:13px/1.3 system-ui,sans-serif; }
  #bar { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:5px 10px; background:#26331f; height:30px; box-sizing:border-box; overflow:hidden; }
  #bar select, #bar button { font:inherit; background:#3a4d2f; color:#f1f7e2; border:1px solid #5d7a49; border-radius:5px; padding:1px 6px; }
  #bar button.on { background:#7aa04f; }
  #bar label { display:flex; gap:4px; align-items:center; }
  canvas#view { display:block; width:100vw; max-width:100%; height:auto; }
</style>
</head>
<body>
<div id="bar">
  <label>Abschnitt <select id="selOnly"></select></label>
  <button id="btnLow">low</button><button id="btnSpin">Drehen</button><button id="btnNight">Nacht</button>
  <span id="info"></span>
</div>
<canvas id="view" width="1600" height="968"></canvas>
<script src="games/furtfehde/art.js"></script>
<script type="module">import * as THREE from './vendor/three.module.min.js'; window.THREE = THREE;</script>
<script type="module">
const cv = document.getElementById('view'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const errs = [];
for (const k of ['error', 'warn']) { const orig = console[k].bind(console); console[k] = (...a) => { errs.push(k + ': ' + a.map(String).join(' ').slice(0, 600)); orig(...a); }; }
function devFail(msg) {
  ctx.fillStyle = '#400'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'left';
  String(msg).split('\n').forEach((ln, i) => (ln.match(/.{1,120}/g) || ['']).forEach((l2, j) => ctx.fillText(l2, 20, 40 + (i * 3 + j) * 24)));
  console.log('FAIL ' + msg);
}
window.addEventListener('error', (e) => devFail('JS-Fehler: ' + e.message + '\n' + (e.error && e.error.stack || '')));
try {
  const q = new URLSearchParams(location.search), A = window.FurtArt, T = window.THREE;
  const S = {
    only: q.get('only') || 'all', quality: q.get('quality') === 'low' ? 'low' : 'high', spin: q.get('spin') !== '0',
    t0: parseFloat(q.get('t') || '0'), frozen: q.has('t') && q.get('anim') !== '1', night: q.get('night') === '1',
    shadow: q.get('shadow') === '1', el: parseFloat(q.get('el') || '38'), zoom: parseFloat(q.get('zoom') || '1'), fov: parseFloat(q.get('fov') || '30'), team: parseInt(q.get('team') || '0', 10) || 0
  };
  const Q = S.quality;
  const TEAM = ['#ff2d55', '#0a84ff', '#30d158', '#ffd60a'], teamHex = (i) => parseInt(TEAM[((i % 4) + 4) % 4].slice(1), 16);
  const tc = (i) => TEAM[(((i + S.team) % 4) + 4) % 4];
  const gl = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  gl.setPixelRatio(1); gl.setSize(W, H, false); gl.setScissorTest(true);
  gl.toneMapping = T.ACESFilmicToneMapping; gl.toneMappingExposure = 1.0;
  const scene = new T.Scene();
  const sun = new T.DirectionalLight('#fff0d0', 2.7), hemi = new T.HemisphereLight('#cfe6ff', '#8a7a5c', 1.05);
  if (S.shadow) { gl.shadowMap.enabled = true; gl.shadowMap.type = T.PCFShadowMap; sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; }
  scene.add(sun, sun.target, hemi);
  const cam = new T.PerspectiveCamera(S.fov, 1, 0.05, 400);
  const kit = A.units(T, { quality: Q });
  const groundMat = new T.MeshLambertMaterial({ color: '#7fae4f' }), waterMat = new T.MeshLambertMaterial({ color: '#3f9cc0' });
  const ground = (R, y, mat) => { const m = new T.Mesh(new T.CircleGeometry(R, 40), mat || groundMat); m.rotation.x = -Math.PI / 2; m.position.y = y == null ? -0.02 : y; m.receiveShadow = true; return m; };

  // ---------- cell factories: () => { group, fit: [boundingRadius, centreY], update(t), stats?() } ----------
  const FIT = { huette: [2.0, 1.2], hof: [3.4, 0.9], kornspeicher: [2.5, 1.6], lager: [2.3, 0.7], holzfaeller: [2.3, 1.0], steinbruch: [2.6, 1.2], kaserne: [3.0, 1.5], wachturm: [3.9, 3.4], brunnen: [1.5, 0.9], keep: [7.4, 5.4] };
  const KINDS = ['huette', 'hof', 'kornspeicher', 'lager', 'holzfaeller', 'steinbruch', 'kaserne', 'wachturm', 'brunnen'];
  const cellB = (kind, label, color, o) => ({ name: label, mk: () => {
    o = o || {};
    const b = A.building(T, kind, { color, quality: Q, rot: o.rot || 0 });
    b.setBuild(o.build == null ? 1 : o.build); b.setDamage(o.hp == null ? 1 : o.hp); b.setBurnt(o.burnt || 0); b.setRuined(!!o.ruined); b.setGrowth(o.growth == null ? 1 : o.growth);
    const g = new T.Group(); g.add(b.group); g.add(ground(FIT[kind][0] * 1.05));
    return { group: g, stat: b.group, fit: FIT[kind], update: (t) => b.animate(t, { working: o.working !== false, night: S.night ? 1 : 0 }) };
  } });
  const cellK = (label, color, emblem, o) => ({ name: label, mk: () => {
    o = o || {};
    const k = A.keep(T, { color, emblem, quality: Q });
    k.setDamage(o.hp == null ? 1 : o.hp); k.setBurnt(o.burnt || 0); k.setRuined(!!o.ruined);
    const g = new T.Group(); g.add(k.group); g.add(ground(FIT.keep[0] * 0.78));
    return { group: g, stat: k.group, fit: FIT.keep, update: () => {} };
  } });
  const SPACING = { ritter: 2.5, bauer: 1.05, speer: 1.1, bogen: 1.1, fackel: 1.1 };
  const ANIMS = ['idle', 'walk', 'fight', 'work'];
  const cellU = (kind, anim, label, o) => ({ name: label || `${kind} ${ANIMS[anim]}`, mk: () => {
    o = o || {};
    const n = o.n || 4, sp = SPACING[kind], u = kit.create(kind, Math.max(n, 4));
    for (let i = 0; i < n; i++) u.set(i, (i - (n - 1) / 2) * sp, 0, 0, o.yaw || 0, anim, i * 0.37, teamHex(i + S.team), o.carry == null ? 0 : o.carry);
    u.count(n); u.commit();
    u.mesh.castShadow = S.shadow;
    const g = new T.Group(); g.add(u.mesh); g.add(ground(sp * n * 0.62));
    return { group: g, fit: [sp * n * 0.58 + 0.6, kind === 'ritter' ? 0.8 : 0.4], update: () => {}, stats: () => { u.count(1); const s = A.stats(u.mesh); u.count(n); return s; } };
  } });
  const cellMix = (anim, label) => ({ name: label, mk: () => {
    const g = new T.Group(), ms = [];
    ['bauer', 'speer', 'bogen', 'fackel', 'ritter'].forEach((k, i) => { const u = kit.create(k, 1); u.set(0, (i - 2) * 1.35 + (i === 4 ? 0.5 : 0), 0, 0, 0, anim, i * 0.31, teamHex(i + S.team), 0); u.count(1); u.commit(); g.add(u.mesh); ms.push(u); });
    g.add(ground(4.0));
    return { group: g, fit: [4.0, 0.7], update: () => {}, stats: () => ({ tris: ms.reduce((a, u) => a + A.stats(u.mesh).tris, 0), calls: ms.length }) };
  } });
  const cellColumn = () => ({ name: 'Marschkolonne 20 Speertraeger', mk: () => {
    const u = kit.create('speer', 20), g = new T.Group(); g.add(u.mesh); g.add(ground(6.2));
    const hash = (i) => { const s = Math.sin(i * 91.7) * 4375.85; return s - Math.floor(s); };
    return { group: g, fit: [6.4, 0.6], update: (t) => {
      for (let i = 0; i < 20; i++) { const r = i % 2, c = (i - r) / 2, x = (c - 4.5) * 0.78 + r * 0.25 + ((t * 0.9) % 1.6 - 0.8), z = (r - 0.5) * 1.0;
        u.set(i, x, 0, z, 0, 1, hash(i), teamHex((i >> 1) % 4 === 3 ? 0 : S.team), 0); }
      u.count(20); u.commit();
    }, stats: () => { u.count(1); const s = A.stats(u.mesh); u.count(20); return s; } };
  } });
  const cellBanner = (emblem, color, label, moving) => ({ name: label, mk: () => {
    const b = A.banner(T, { color, emblem, quality: Q }), g = new T.Group(); g.add(b.group); g.add(ground(1.9));
    return { group: g, stat: b.group, fit: [2.4, 1.7], update: (t) => b.animate(t, { moving: !!moving }) };
  } });
  // instanced natural things: a few copies so the instancing path (sway phase, tint) is exercised
  const cellInst = (label, geo, mat, fitR, opts) => ({ name: label, mk: () => {
    opts = opts || {};
    const N = opts.n || 3, im = new T.InstancedMesh(geo, mat, N), m = new T.Matrix4(), g = new T.Group();
    const pos = opts.pos || [[0, 0, 0], [1.5, 0, 0.8], [-1.3, 0, 0.9]], sc = opts.sc || [1, 0.8, 0.9];
    for (let i = 0; i < N; i++) { m.compose(new T.Vector3(...pos[i]), new T.Quaternion().setFromEuler(new T.Euler(0, i * 2.1, 0)), new T.Vector3(sc[i], sc[i], sc[i])); im.setMatrixAt(i, m); if (opts.tint) im.setColorAt(i, new T.Color(opts.tint[i % opts.tint.length])); }
    g.add(im); g.add(ground(fitR * 0.95));
    return { group: g, fit: [fitR, opts.cy || 1.6], update: () => {}, stats: () => ({ tris: geo.attributes.position.count / 3, calls: 1 }) };
  } });
  const cellObj = (label, mkObj, fitR, cy, groundR) => ({ name: label, mk: () => { const o = mkObj(), g = new T.Group(); g.add(o); if (groundR) g.add(ground(groundR)); return { group: g, stat: o, fit: [fitR, cy], update: () => {} }; } });
  const cellBridge = (kind, len) => ({ name: `Bruecke ${kind} len ${len}`, mk: () => {
    const b = A.bridge(T, { kind, len, quality: Q }), g = new T.Group(); g.add(b.group);
    const w = ground(len * 0.75, -1.7, waterMat); g.add(w);
    const bank = new T.Mesh(new T.BoxGeometry(len * 0.5, 1.7, 5), groundMat); bank.position.set(-len / 2 - len * 0.22, -0.85, 0); const bank2 = bank.clone(); bank2.position.x = len / 2 + len * 0.22; g.add(bank, bank2);
    return { group: g, stat: b.group, fit: [len * 0.62 + 1.2, -0.4], update: () => {} };
  } });

  // ---------- sections ----------
  const treeCells = () => ['laub', 'nadel', 'weide'].flatMap((k) => {
    const t = A.tree(T, k, { quality: Q });
    return [cellInst(`Baum ${k}`, t.geometry, t.material, 3.3, { cy: 1.9, tint: ['#ffffff', '#f0f8e0', '#e6efd8'] }), cellInst(`Stumpf ${k}`, t.stump.geometry, t.stump.material, 1.8, { cy: 0.3 })];
  });
  const rockCells = () => [0, 1, 2].map((v) => { const r = A.rock(T, { variant: v, quality: Q }); return cellInst(`Fels ${v}`, r.geometry, r.material, 2.8, { cy: 0.5, sc: [1.3, 1, 0.8] }); });
  const decoCells = () => ['schilf', 'blume', 'stein', 'busch'].map((k) => {
    const d = A.deco(T, k, { quality: Q }), pos = [[0, 0, 0], [0.9, 0, 0.7], [-0.8, 0, 0.8], [0.3, 0, -0.9], [-0.9, 0, -0.6]];
    return cellInst(`Deko ${k}`, d.geometry, d.material, 2.2, { n: 5, pos, sc: [1.4, 1.2, 1.5, 1.1, 1.3], cy: 0.5, tint: ['#ffffff', '#f4ffe6'] });
  });
  const propCells = () => ['korn', 'holz', 'stein', 'eimer'].map((k) => cellObj(`Prop ${k}`, () => A.prop(T, k, { quality: Q }), 1.3, 0.3, 1.2));
  const unitCells = () => {
    const out = [];
    ['bauer', 'speer', 'bogen', 'fackel', 'ritter'].forEach((k) => ANIMS.forEach((a, ai) => out.push(cellU(k, ai))));
    return out;
  };
  const SECTIONS = {
    all: () => [
      cellK('Bergfried', tc(0), 0), ...KINDS.map((k, i) => cellB(k, k, tc(i + 1))),
      cellMix(1, 'Einheiten laufen'), cellMix(2, 'Einheiten kaempfen'), cellBanner(1, tc(1), 'Banner'),
      ...['laub', 'nadel', 'weide'].map((k) => { const t = A.tree(T, k, { quality: Q }); return cellInst(`Baum ${k}`, t.geometry, t.material, 3.3, { cy: 1.9 }); }),
      (() => { const r = A.rock(T, { variant: 0, quality: Q }); return cellInst('Fels', r.geometry, r.material, 2.8, { cy: 0.5, sc: [1.3, 1, 0.8] }); })(),
      (() => { const d = A.deco(T, 'schilf', { quality: Q }); return cellInst('Schilf', d.geometry, d.material, 2.2, { n: 5, pos: [[0, 0, 0], [0.9, 0, 0.7], [-0.8, 0, 0.8], [0.3, 0, -0.9], [-0.9, 0, -0.6]], sc: [1.4, 1.2, 1.5, 1.1, 1.3], cy: 0.7 }); })(),
      cellBridge('stein', 10), cellBridge('steg', 8), cellObj('Ruine', () => A.ruin(T, { quality: Q }).group, 3.6, 2.3, 3.0), cellObj('Prop holz', () => A.prop(T, 'holz', { quality: Q }), 1.3, 0.3, 1.2)
    ],
    buildings: () => [cellK('Bergfried', tc(0), 0), ...KINDS.map((k, i) => cellB(k, k, tc(i + 1)))],
    sites: () => KINDS.map((k, i) => cellB(k, `${k} Bau 0.6`, tc(i), { build: 0.6, working: false })),
    ruins: () => KINDS.map((k, i) => cellB(k, `${k} Ruine`, tc(i), { ruined: true })),
    burnt: () => KINDS.map((k, i) => cellB(k, `${k} verbrannt 0.7`, tc(i), { burnt: 0.7 })),
    keep: () => [cellK('Bergfried rot / Balken', TEAM[0], 0), cellK('blau / Kreuz', TEAM[1], 1), cellK('gruen / Sparren', TEAM[2], 2), cellK('gelb / Kreis', TEAM[3], 3),
      cellK('Schaden hp 0.4', TEAM[1], 1, { hp: 0.4 }), cellK('verbrannt 0.7', TEAM[2], 2, { burnt: 0.7 }), cellK('Ruine', TEAM[3], 3, { ruined: true })],
    units: unitCells,
    carry: () => [0, 1, 2, 3, 4].map((c) => cellU('bauer', 1, `Bauer walk carry ${c}`, { carry: c })).concat([cellU('bauer', 3, 'Bauer work'), cellU('fackel', 1, 'Fackel walk'), cellU('fackel', 2, 'Fackel fight'), cellU('ritter', 1, 'Ritter gallop')]),
    column: () => [cellColumn(), cellMix(1, 'Einheiten laufen'), cellMix(2, 'Einheiten kaempfen'), cellMix(0, 'Einheiten idle')],
    banners: () => [0, 1, 2, 3].map((e) => cellBanner(e, tc(e), `Banner Emblem ${e}`)).concat([0, 1, 2, 3].map((e) => cellBanner(e, tc(e + 2), `Banner ${e} moving`, true))),
    trees: treeCells, rocks: rockCells, deco: decoCells, props: propCells,
    bridges: () => [cellBridge('stein', 5), cellBridge('stein', 10), cellBridge('stein', 16), cellBridge('steg', 6), cellBridge('steg', 12)],
    ruin: () => [cellObj('Ruine', () => A.ruin(T, { quality: Q }).group, 3.6, 2.3, 3.0)]
  };
  for (const k of KINDS) SECTIONS[k] = () => {
    const c = (i) => tc(i), cells = [];
    [0, 0.25, 0.5, 0.75, 1].forEach((b, i) => cells.push(cellB(k, `${k} Bau ${b}`, c(i), { build: b, working: false })));
    cells.push(cellB(k, `${k} Schaden hp 0.4`, c(1), { hp: 0.4 }), cellB(k, `${k} verbrannt 0.7`, c(2), { burnt: 0.7 }), cellB(k, `${k} Ruine`, c(3), { ruined: true }));
    if (k === 'hof') [0, 0.3, 0.6, 1].forEach((g, i) => cells.push(cellB(k, `hof Wachstum ${g}`, c(i), { growth: g })));
    if (k === 'hof') cells.push(cellB(k, 'hof Wachstum 1 + verbrannt 1', c(2), { growth: 1, burnt: 1 }));
    cells.push(cellB(k, `${k} rot 1 (90 Grad)`, c(0), { rot: 1 }), cellB(k, `${k} arbeitet`, c(1), { working: true }));
    return cells;
  };
  const selOnly = document.getElementById('selOnly');
  const names = ['all', 'buildings', 'sites', 'ruins', 'burnt', 'keep', ...KINDS, 'units', 'carry', 'column', 'banners', 'trees', 'rocks', 'deco', 'bridges', 'ruin', 'props'];
  for (const k of names) selOnly.add(new Option(k, k));
  selOnly.value = S.only;
  const go = (patch) => { const u = new URLSearchParams(location.search); for (const [k, v] of Object.entries(patch)) { if (v == null) u.delete(k); else u.set(k, v); } location.search = u.toString(); };
  selOnly.onchange = () => go({ only: selOnly.value });
  const bl = document.getElementById('btnLow'), bs = document.getElementById('btnSpin'), bn = document.getElementById('btnNight');
  bl.classList.toggle('on', Q === 'low'); bl.onclick = () => go({ quality: Q === 'low' ? null : 'low' });
  bs.classList.toggle('on', S.spin); bs.onclick = () => go({ spin: S.spin ? '0' : null });
  bn.classList.toggle('on', S.night); bn.onclick = () => go({ night: S.night ? null : '1' });

  let defs = (SECTIONS[S.only] || SECTIONS.all)();
  if (q.has('cell')) { const ci = parseInt(q.get('cell'), 10) || 0; defs = [defs[Math.min(ci, defs.length - 1)]]; }
  if (q.has('pick')) defs = q.get('pick').split(',').map((i) => defs[Math.min(parseInt(i, 10) || 0, defs.length - 1)]);
  const cells = defs.map((d) => { const m = d.mk(); m.name = d.name; m.group.visible = false; scene.add(m.group); m.s = m.stats ? m.stats() : A.stats(m.stat || m.group); return m; });
  const nC = cells.length, cols = nC <= 1 ? 1 : nC <= 4 ? 2 : nC <= 6 ? 3 : nC <= 12 ? 4 : nC <= 15 ? 5 : nC <= 20 ? 5 : nC <= 24 ? 6 : 7, rows = Math.ceil(nC / cols);
  const cw = Math.floor(W / cols), ch = Math.floor(H / rows);
  const fmt = cells.map((m) => `${m.name}: ${m.s.tris} tris, ${m.s.calls} calls`);
  console.log('[gallery] ' + fmt.join(' | '));
  document.getElementById('info').textContent = `${nC} Modelle, ${Q}${S.night ? ', Nacht' : ''}`;
  document.title = 'Furt&Fehde Art ' + S.only + ' ' + fmt.join(' | ');
  const sky = S.night ? new T.Color('#141a30') : new T.Color('#b9d9ee');

  function frame(now) {
    const t = S.frozen ? S.t0 : S.t0 + now / 1000;
    A.tick(t); A.setNight(S.night ? 1 : 0);
    if (S.night) { sun.color.set('#9db4ff'); sun.intensity = 0.9; hemi.intensity = 0.7; hemi.color.set('#4a5aa0'); hemi.groundColor.set('#201a30'); }
    gl.setClearColor(sky); gl.setViewport(0, 0, W, H); gl.setScissor(0, 0, W, H); gl.clear();
    cells.forEach((m, i) => {
      const cx = (i % cols) * cw, cy = H - (Math.floor(i / cols) + 1) * ch;
      m.update(t);
      if (!m.stats) m.s = A.stats(m.stat || m.group);
      m.group.visible = true; m.group.rotation.y = S.spin ? t * 0.35 + i * 0.9 : 0.5;
      const R = m.fit[0] / S.zoom, el = S.el * Math.PI / 180, sc = sun.shadow.camera;
      if (S.shadow) { sc.left = -R * 1.5; sc.right = R * 1.5; sc.top = R * 1.5; sc.bottom = -R * 1.5; sc.near = 0.5; sc.far = 70; sc.updateProjectionMatrix(); }
      const d = (R * 1.15) / Math.sin(S.fov * Math.PI / 360);
      cam.aspect = cw / ch; cam.fov = S.fov; cam.updateProjectionMatrix();
      cam.position.set(0, m.fit[1] + Math.sin(el) * d, Math.cos(el) * d); cam.lookAt(0, m.fit[1], 0);
      sun.position.set(-7, 11, 6); sun.target.position.set(0, 0, 0);
      gl.setViewport(cx, cy, cw, ch); gl.setScissor(cx, cy, cw, ch);
      gl.render(scene, cam);
      m.group.visible = false;
    });
    ctx.drawImage(gl.domElement, 0, 0);
    ctx.font = 'bold 14px system-ui,sans-serif'; ctx.textAlign = 'left';
    cells.forEach((m, i) => {
      const cx = (i % cols) * cw, cy = Math.floor(i / cols) * ch, txt = `${m.name}  ${m.s.tris} tris / ${m.s.calls} call${m.s.calls === 1 ? '' : 's'}`;
      const wTxt = Math.min(cw - 10, ctx.measureText(txt).width + 14);
      ctx.fillStyle = 'rgba(20,32,14,.66)'; ctx.fillRect(cx + 5, cy + 5, wTxt, 21);
      ctx.fillStyle = '#fff'; ctx.fillText(txt, cx + 11, cy + 20, cw - 22);
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.strokeRect(cx + .5, cy + .5, cw - 1, ch - 1);
    });
    if (errs.length) {
      ctx.fillStyle = 'rgba(120,0,0,.85)'; ctx.fillRect(0, H - Math.min(errs.length, 8) * 18 - 8, W, Math.min(errs.length, 8) * 18 + 8);
      ctx.fillStyle = '#fff'; ctx.font = '12px monospace';
      errs.slice(0, 8).forEach((e, i) => ctx.fillText(e.replace(/\s+/g, ' ').slice(0, 220), 8, H - Math.min(errs.length, 8) * 18 + i * 18 + 8));
    }
    if (!S.frozen) requestAnimationFrame(frame);
  }
  frame(0);
  if (!S.frozen) requestAnimationFrame(frame);
} catch (e) { devFail('Fehler: ' + e.message + '\n' + (e.stack || '')); }
