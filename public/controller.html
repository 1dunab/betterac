<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Party Hub — Controller</title>
<style>
  html, body { margin:0; height:100%; font-family:system-ui,sans-serif; color:#fff; background:#1a1a24;
               -webkit-user-select:none; user-select:none; touch-action:none; }
  .view { display:none; flex-direction:column; height:100%; box-sizing:border-box; }
  .view.on { display:flex; }
  .bar { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .word { font-size:22px; font-weight:800; }
  .timer { font-size:22px; font-weight:800; min-width:46px; text-align:right; }
  canvas { background:#fff; flex:1; border-radius:10px; margin:0 10px; touch-action:none; }
  .tools { display:flex; gap:8px; padding:10px; flex-wrap:wrap; align-items:center; }
  .sw { width:34px; height:34px; border-radius:50%; border:3px solid transparent; }
  .sw.sel { border-color:#fff; }
  .btn { border:none; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:700; background:#3a3a48; color:#fff; }
  .btn.go { background:#30d158; color:#06250f; flex:1; }
  .btn:active { filter:brightness(1.2); }
  .center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; }
  input[type=text] { font-size:20px; padding:14px; border-radius:12px; border:none; width:100%; max-width:340px; box-sizing:border-box; }
  .step { display:flex; align-items:center; gap:14px; }
  .step button { width:48px; height:48px; border-radius:12px; border:none; background:#3a3a48; color:#fff; font-size:24px; font-weight:800; }
  .big { font-size:26px; font-weight:800; }
  .muted { opacity:.75; font-size:15px; }
  .modes, .games { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .modebtn, .gamebtn { padding:8px 12px; border-radius:10px; border:none; background:#3a3a48; color:#fff; font-weight:700; font-size:14px; }
  .modebtn.sel { background:#bf5af2; }
  .gamebtn.sel { background:#0a84ff; }
  #abortBtn { position:fixed; top:8px; right:8px; z-index:1000; display:none; border:none; border-radius:10px;
              padding:8px 12px; font-weight:800; font-size:15px; background:#ff3b30; color:#fff; }
</style>
</head>
<body>

<button id="abortBtn">✕ Abbrechen</button>

<!-- NAME -->
<div id="v-name" class="view">
  <div class="center">
    <div class="big">Wie heißt du? 🙋</div>
    <input id="nameInput" type="text" placeholder="Dein Name…" autocomplete="off" maxlength="14">
    <button id="joinBtn" class="btn go" style="width:100%; max-width:340px">Beitreten</button>
  </div>
</div>

<!-- ZENTRALE LOBBY -->
<div id="v-shelllobby" class="view">
  <div class="center">
    <div id="helloName" class="big">Lobby</div>
    <div id="hostLobby" style="display:none; width:100%; max-width:360px;">
      <div class="muted" style="margin-bottom:6px">Spiel wählen:</div>
      <div class="games" id="gamePicker"></div>
      <div id="gameSettings" style="margin-top:16px"></div>
      <button id="startBtn" class="btn go" style="margin-top:22px; width:100%">START</button>
      <div id="needPlayers" class="muted" style="margin-top:10px"></div>
    </div>
    <div id="guestLobby" class="muted" style="display:none"></div>
  </div>
</div>

<!-- SPECTATE -->
<div id="v-spectate" class="view"><div class="center"><div class="big">Ein Spiel läuft 🎮</div><div class="muted">Du bist in der nächsten Runde dabei.</div></div></div>

<!-- Spiel-Views injizieren die Module selbst (siehe games/README.md) -->

<script>window.__AC_ROLE__ = 'controller';</script>
<script src="airconsole-local.js"></script>
<script src="core/game-registry.js"></script>
<script>
  const ac = new AirConsole();
  const $ = (id) => document.getElementById(id);
  const VIEWS = ['name','shelllobby','spectate'];
  function showView(v) { VIEWS.forEach(n => $('v-' + n).classList.toggle('on', n === v)); }
  function shade(hex) { const n = parseInt(hex.slice(1), 16); return 'rgb(' + Math.round(((n >> 16) & 255) * 0.4) + ',' + Math.round(((n >> 8) & 255) * 0.4) + ',' + Math.round((n & 255) * 0.4) + ')'; }

  let inGame = false, myHost = false, activeC = null, gamesMeta = [];
  function updateAbort() { $('abortBtn').style.display = (inGame && myHost) ? 'block' : 'none'; }
  $('abortBtn').addEventListener('click', () => ac.message(AirConsole.SCREEN, { t: 'shellAbort' }));

  // ---------- Name ----------
  function joinLobby() { ac.message(AirConsole.SCREEN, { t: 'shellName', name: $('nameInput').value.trim() }); }
  $('joinBtn').addEventListener('click', joinLobby);
  $('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinLobby(); });

  // ---------- Shell-Lobby (Host) ----------
  let curCfg = {}, selected = 'lightcycles';
  function sendSelect(g) { ac.message(AirConsole.SCREEN, { t: 'shellSelect', game: g }); }
  function sendCfg() { ac.message(AirConsole.SCREEN, { t: 'shellConfig', game: selected, cfg: curCfg }); }
  function buildPicker() {
    const wrap = $('gamePicker'); wrap.innerHTML = '';
    gamesMeta.forEach(g => { const b = document.createElement('button'); b.className = 'gamebtn' + (g.key === selected ? ' sel' : ''); b.textContent = g.label; b.addEventListener('click', () => sendSelect(g.key)); wrap.appendChild(b); });
  }
  // Settings-UI generisch aus dem Schema des gewählten Spiels (meta.js)
  function renderSettings() {
    const wrap = $('gameSettings'); wrap.innerHTML = '';
    const schema = (window.GAME_META[selected] || {}).settings || {};
    for (const f in schema) {
      const def = schema[f];
      if (def.type === 'choice') {
        const row = document.createElement('div'); row.className = 'modes'; row.style.marginBottom = '14px';
        (def.options || []).forEach(o => {
          const b = document.createElement('button'); b.className = 'modebtn' + (curCfg[f] === o.v ? ' sel' : ''); b.textContent = o.label;
          b.addEventListener('click', () => { curCfg[f] = o.v; renderSettings(); sendCfg(); });
          row.appendChild(b);
        });
        wrap.appendChild(row);
      } else if (def.type === 'number') {
        const row = document.createElement('div'); row.className = 'step'; row.style.marginBottom = '12px';
        const lab = document.createElement('span'); lab.style.flex = '1'; lab.textContent = def.label;
        const minus = document.createElement('button'); minus.textContent = '−';
        const val = document.createElement('span'); val.className = 'big'; val.textContent = curCfg[f] + (def.unit || '');
        const plus = document.createElement('button'); plus.textContent = '+';
        const bump = (dir) => { curCfg[f] = Math.max(def.min, Math.min(def.max, (curCfg[f] | 0) + dir * def.step)); val.textContent = curCfg[f] + (def.unit || ''); sendCfg(); };
        minus.addEventListener('click', () => bump(-1)); plus.addEventListener('click', () => bump(1));
        row.append(lab, minus, val, plus); wrap.appendChild(row);
      } else if (def.type === 'text') {
        const row = document.createElement('div'); row.style.marginBottom = '12px';
        const lab = document.createElement('div'); lab.className = 'muted'; lab.style.marginBottom = '6px'; lab.textContent = def.label + ':';
        const inp = document.createElement('input');
        inp.type = 'text'; inp.autocomplete = 'off'; inp.style.maxWidth = 'none'; inp.style.fontSize = '16px';
        inp.maxLength = def.max || 100; inp.value = curCfg[f] || ''; inp.placeholder = def.default || '';
        inp.addEventListener('change', () => { curCfg[f] = inp.value; sendCfg(); });
        row.append(lab, inp); wrap.appendChild(row);
      }
    }
  }
  $('startBtn').addEventListener('click', () => ac.message(AirConsole.SCREEN, { t: 'shellStart' }));

  // ---------- Countdown (Drawing) ----------
  let timerInt = null, endAt = 0, onZero = null, tEl = null;
  function startTimer(ms, el, cb) {
    clearInterval(timerInt); endAt = performance.now() + ms; tEl = el; onZero = cb;
    const upd = () => { const s = Math.max(0, Math.ceil((endAt - performance.now()) / 1000)); tEl.textContent = s; if (s <= 0) { clearInterval(timerInt); if (onZero) { const c = onZero; onZero = null; c(); } } };
    upd(); timerInt = setInterval(upd, 200);
  }
  function stopTimer() { clearInterval(timerInt); onZero = null; }

  </script>
<script src="games/lightcycles/meta.js"></script>
<script src="games/lightcycles/controller.js"></script>
<script src="games/slither/meta.js"></script>
<script src="games/slither/controller.js"></script>
<script src="games/drawing/meta.js"></script>
<script src="games/drawing/controller.js"></script>
<script src="games/geoguess/meta.js"></script>
<script src="games/geoguess/mapdata.js"></script>
<script src="games/geoguess/controller.js"></script>
<script src="games/spy/meta.js"></script>
<script src="games/spy/controller.js"></script>
<script src="games/fakeartist/meta.js"></script>
<script src="games/fakeartist/controller.js"></script>
<script src="games/reaction/meta.js"></script>
<script src="games/reaction/controller.js"></script>
<script src="games/categories/meta.js"></script>
<script src="games/categories/controller.js"></script>
<script src="games/artillery/meta.js"></script>
<script src="games/artillery/controller.js"></script>
<script src="games/bumpergems/meta.js"></script>
<script src="games/bumpergems/controller.js"></script>
<script src="games/codebreakers/meta.js"></script>
<script src="games/codebreakers/controller.js"></script>
<script>
  const MODULES = window.CONTROLLERS;

  // ============ Nachrichten ============
  ac.onReady = () => { /* Name-Ansicht aktiv */ };
  ac.onMessage = (from, d) => {
    if (!d) return;
    if (d.t === 'shell') {
      if (d.cmd === 'name') { inGame = false; activeC = null; updateAbort(); showView('name'); setTimeout(() => $('nameInput').focus(), 50); }
      else if (d.cmd === 'lobby') {
        inGame = false; activeC = null; updateAbort();
        $('helloName').textContent = 'Hallo, ' + (d.name || 'Spieler') + '!';
        document.body.style.background = shade(d.color || '#0a84ff');
        gamesMeta = d.games || []; selected = d.selected; buildPicker();
        curCfg = d.cfg || {};
        if (d.host) renderSettings();
        $('hostLobby').style.display = d.host ? 'block' : 'none';
        $('guestLobby').style.display = d.host ? 'none' : 'block';
        if (d.host) { $('startBtn').disabled = !d.minOk; $('startBtn').style.opacity = d.minOk ? 1 : 0.5; $('needPlayers').textContent = d.minOk ? (d.playerCount + ' Spieler bereit') : 'Mehr Spieler nötig…'; }
        else { const lab = (gamesMeta.find(g => g.key === d.selected) || {}).label || d.selected; $('guestLobby').textContent = 'Host wählt: ' + lab + ' — warte auf Start…'; }
        showView('shelllobby');
      }
      else if (d.cmd === 'enterGame') { inGame = true; myHost = d.host; updateAbort(); activeC = MODULES[d.game] || null; if (activeC) activeC.activate(); }
      else if (d.cmd === 'spectate') { inGame = true; myHost = d.host; updateAbort(); activeC = null; showView('spectate'); }
      else if (d.cmd === 'host') { myHost = d.host; updateAbort(); }
    } else if (activeC && activeC.onMessage) {
      activeC.onMessage(d);
    }
  };
  showView('name');
</script>
</body>
</html>
