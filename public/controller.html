<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Party Hub — Controller</title>
<style>
  html, body { margin:0; height:100%; font-family:system-ui,sans-serif; color:#fff; background:#1a1a24;
               -webkit-user-select:none; user-select:none; touch-action:none; }
  .view { display:none; flex-direction:column; height:100%; box-sizing:border-box; }
  .view.on { display:flex; }
  /* ---- Lobby: Spiele-Katalog zum Blättern, unten die Leiste des Hosts ---- */
  #v-shelllobby { overflow:hidden; }
  #lobHead { display:flex; align-items:center; gap:10px; padding:12px 14px 6px; }
  #lobDot { width:16px; height:16px; border-radius:50%; flex:none; background:#0a84ff; }
  #helloName { font-size:21px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #lobInfo { font-size:13px; white-space:nowrap; }
  #gameCats { display:flex; gap:6px; padding:4px 12px 8px; overflow-x:auto; touch-action:pan-x; flex:none; scrollbar-width:none; }
  #gameCats::-webkit-scrollbar { display:none; }
  .catchip { border:none; border-radius:16px; padding:7px 12px; font-size:14px; font-weight:700; background:#2c2c3a; color:#fff; white-space:nowrap; flex:none; }
  .catchip.sel { background:#fff; color:#10141a; }
  #gamePicker { flex:1; min-height:0; overflow-y:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column;
                flex-wrap:nowrap; justify-content:flex-start; gap:8px; padding:2px 12px 12px; }
  #lobTools { display:flex; gap:8px; flex:none; }
  #lobTools .gamebtn { flex:1; padding:10px 8px; }
  .gcard { display:grid; grid-template-columns:104px 1fr auto; gap:0 10px; align-items:start; background:#24242f; border-radius:14px; padding:8px;
           border:2px solid transparent; flex:none; text-align:left; }
  .gcard.cur { border-color:#ffd60a; background:#2d2a22; }
  .gcard.far { opacity:.55; }
  .gcard img { width:104px; height:65px; border-radius:9px; object-fit:cover; background:#15151d; display:block; }
  .gcard .gamebtn { background:none; padding:0; font-size:17px; font-weight:800; text-align:left; display:block; margin-bottom:2px; }
  .gcard .gamebtn.sel { background:none; color:#ffd60a; }
  .gabout { font-size:13px; line-height:1.3; opacity:.8; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .gmeta { font-size:12px; opacity:.55; margin-top:3px; }
  .gwish { border-radius:14px; padding:8px 10px; font-size:15px; font-weight:800; background:#33333f; white-space:nowrap; }
  .gwish.on { background:#ff2d55; }
  .gcard #gameSettings { grid-column:1 / -1; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.12); text-align:center; }
  #lobBar { flex:none; padding:10px 12px 12px; background:#15151d; border-top:1px solid rgba(255,255,255,.08); }
  #guestLobby { text-align:center; padding:4px 0; }
  #hostMore { max-height:38vh; overflow-y:auto; touch-action:pan-y; margin-bottom:10px; }
  #lobRow { display:flex; gap:8px; align-items:stretch; }
  #moreBtn { flex:none; }
  .bar { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .word { font-size:22px; font-weight:800; }
  .timer { font-size:22px; font-weight:800; min-width:46px; text-align:right; }
  /* min-height:0 erlaubt Flex-Schrumpfen unter die intrinsische Canvas-Höhe —
     sonst schiebt z.B. der Rate-Canvas (600x520) Eingabefeld und Button aus dem Screen */
  canvas { background:#fff; flex:1; min-height:0; border-radius:10px; margin:0 10px; touch-action:none; }
  .tools { display:flex; gap:8px; padding:10px; flex-wrap:wrap; align-items:center; }
  .sw { width:34px; height:34px; border-radius:50%; border:3px solid transparent; }
  .sw.sel { border-color:#fff; }
  .btn { border:none; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:700; background:#3a3a48; color:#fff; }
  .btn.go { background:#30d158; color:#06250f; flex:1; }
  .btn:active { filter:brightness(1.2); }
  .center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; }
  input[type=text] { font-size:20px; padding:14px; border-radius:12px; border:none; width:100%; max-width:340px; box-sizing:border-box; }
  .step { display:flex; align-items:center; gap:14px; }
  .step button { width:48px; height:48px; border-radius:12px; border:none; background:#3a3a48; color:#fff; font-size:24px; font-weight:800; }
  .big { font-size:26px; font-weight:800; }
  .muted { opacity:.75; font-size:15px; }
  .modes, .games { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .modebtn, .gamebtn { padding:8px 12px; border-radius:10px; border:none; background:#3a3a48; color:#fff; font-weight:700; font-size:14px; }
  .modebtn.sel { background:#bf5af2; }
  .gamebtn.sel { background:#0a84ff; }
  #abortBtn { position:fixed; top:8px; right:8px; z-index:1000; display:none; border:none; border-radius:10px;
              padding:8px 12px; font-weight:800; font-size:15px; background:#ff3b30; color:#fff; }
</style>

<!-- ZENTRALE LOBBY: oben wer ich bin, in der Mitte der Spiele-Katalog (alle blättern und wünschen, der Host wählt),
     unten die Leiste: beim Host Einstellungen-Rest und START, bei den anderen, was der Host gerade ansieht -->
<div id="v-shelllobby" class="view">
  <div id="lobHead"><span id="lobDot"></span><div id="helloName" class="big">Lobby</div><span id="lobInfo" class="muted"></span></div>
  <div id="gameCats"></div>
  <div class="games" id="gamePicker"></div>

    <div id="guestLobby" class="muted" style="display:none"></div>

        <button id="moreBtn" class="btn">👥</button>

<!-- Spiel-Views injizieren die Module selbst (siehe games/README.md) -->

<script>window.__AC_ROLE__ = 'controller';</script>
<script src="airconsole-local.js?v=20260920-ffa-1"></script>
<script src="core/wakelock.js"></script>
<script src="core/snap.js"></script>

<script>
  const ac = new AirConsole({ deferConnect: true });
  const $ = (id) => document.getElementById(id);
  const VIEWS = ['name','shelllobby','spectate'];
  function showView(v) { VIEWS.forEach(n => $('v-' + n).classList.toggle('on', n === v)); document.documentElement.style.touchAction = document.body.style.touchAction = v === 'shelllobby' || v === 'name' ? 'pan-y' : 'none'; }
  function shade(hex) { const n = parseInt(hex.slice(1), 16); return 'rgb(' + Math.round(((n >> 16) & 255) * 0.4) + ',' + Math.round(((n >> 8) & 255) * 0.4) + ',' + Math.round((n & 255) * 0.4) + ')'; }

  let inGame = false, myHost = false, activeC = null, gamesMeta = [];
  function updateAbort() { $('abortBtn').style.display = (inGame && myHost) ? 'block' : 'none'; }
  $('abortBtn').addEventListener('click', () => ac.message(AirConsole.SCREEN, { t: 'shellAbort' }));

  // ---------- Name ----------
  // Letzten Namen merken: beim nächsten Besuch ist Beitreten nur noch ein Tap
  try { $('nameInput').value = localStorage.getItem('playerName') || ''; } catch (e) {}
  function joinLobby() {
    const name = $('nameInput').value.trim();
    try { if (name) localStorage.setItem('playerName', name); } catch (e) {}
    ac.message(AirConsole.SCREEN, { t: 'shellName', name });
  }
  $('joinBtn').addEventListener('click', joinLobby);
  $('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinLobby(); });

  // ---------- Shell-Lobby (Host) ----------
  let curCfg = {}, selected = 'lightcycles', playerCount = 0;
  function sendSelect(g) { ac.message(AirConsole.SCREEN, { t: 'shellSelect', game: g }); }
  function sendCfg() { ac.message(AirConsole.SCREEN, { t: 'shellConfig', game: selected, cfg: curCfg }); }
  // Der Katalog: eine Karte pro Spiel mit Bild, einem Satz und 👍. Der Titel ist der Knopf, mit dem der Host wählt
  // (bei allen anderen wünscht ein Tipp auf die Karte). Gebaut wird einmal; danach ändern sich nur Markierungen.
  let cat = 'alle', builtFor = '', lobby = { wish: {}, mine: [], host: false };
  const catsOf = () => (window.GAME_CATS || []);
  const sortedGames = () => { const keys = catsOf().map(c => c.key), ci = (g) => Math.max(0, keys.indexOf(g.cat)); return gamesMeta.map((g, i) => ({ g, i })).sort((a, b) => ci(a.g) - ci(b.g) || a.i - b.i).map(x => x.g); };
  function sendWish(g) { ac.message(AirConsole.SCREEN, { t: 'shellWish', game: g }); }
  function buildPicker() {
    const wrap = $('gamePicker'), sig = gamesMeta.map(g => g.key).join();
    if (sig !== builtFor) {
      builtFor = sig;
      $('v-shelllobby').appendChild($('gameSettings'));           // parken, bevor die Karten neu entstehen
      wrap.innerHTML = '';
      // nur für den Host: würfeln, oder nehmen, was sich die meisten wünschen
      const tools = document.createElement('div'); tools.id = 'lobTools';
      const rnd = document.createElement('button'); rnd.className = 'gamebtn'; rnd.style.background = '#6e2a5e'; rnd.textContent = '🎲 Zufall';
      rnd.addEventListener('click', () => {
        // 🎲 Zufall: würfelt ein Spiel, das mit der aktuellen Spielerzahl startbar ist
        const pool = gamesMeta.filter(g => playerCount >= (g.min || 1) && g.key !== selected);
        if (pool.length) sendSelect(pool[Math.floor(Math.random() * pool.length)].key);
      });
      const top = document.createElement('button'); top.className = 'gamebtn'; top.id = 'wishTop'; top.style.background = '#7a2440'; top.textContent = '👍 Meistgewünscht';
      top.addEventListener('click', () => {
        const best = sortedGames().filter(g => lobby.wish[g.key]).sort((a, b) => lobby.wish[b.key] - lobby.wish[a.key])[0];
        if (best) sendSelect(best.key);
      });
      tools.append(rnd, top); wrap.appendChild(tools);
      sortedGames().forEach(g => {
        const card = document.createElement('div'); card.className = 'gcard'; card.dataset.key = g.key; card.dataset.cat = g.cat || '';
        const img = document.createElement('img'); img.alt = ''; img.src = 'covers/' + g.key + '.jpg';
        img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
        const body = document.createElement('div');
        const b = document.createElement('button'); b.className = 'gamebtn'; b.textContent = g.label;
        const about = document.createElement('div'); about.className = 'gabout'; about.textContent = g.about || '';
        const meta = document.createElement('div'); meta.className = 'gmeta';
        body.append(b, about, meta);
        const wish = document.createElement('span'); wish.className = 'gwish'; wish.setAttribute('role', 'button');
        wish.addEventListener('click', (e) => { e.stopPropagation(); sendWish(g.key); });
        // der Host wählt mit einem Tipp auf die Karte; alle anderen wünschen damit
        card.addEventListener('click', (e) => { if (e.target.closest('#gameSettings')) return; if (lobby.host) sendSelect(g.key); else sendWish(g.key); });
        card.append(img, body, wish); wrap.appendChild(card);
      });
      const chips = $('gameCats'); chips.innerHTML = '';
      [{ key: 'alle', label: 'Alle' }, { key: 'wunsch', label: '👍 Gewünscht' }].concat(catsOf()).forEach(c => {
        const b = document.createElement('button'); b.className = 'catchip'; b.dataset.cat = c.key; b.textContent = c.label;
        b.addEventListener('click', () => { cat = c.key; refreshPicker(); $('gamePicker').scrollTop = 0; });
        chips.appendChild(b);
      });
    }
    refreshPicker();
  }
  function refreshPicker() {
    const wrap = $('gamePicker'), labels = {}; catsOf().forEach(c => { labels[c.key] = c.label; });
    $('lobTools').style.display = lobby.host ? 'flex' : 'none';
    $('wishTop').style.display = Object.keys(lobby.wish).length ? '' : 'none';
    [...$('gameCats').children].forEach(b => b.classList.toggle('sel', b.dataset.cat === cat));
    let cur = null;
    wrap.querySelectorAll('.gcard').forEach(card => {
      const key = card.dataset.key, g = gamesMeta.find(x => x.key === key) || {}, n = lobby.wish[key] || 0, mine = lobby.mine.includes(key), need = g.min || 1;
      const on = key === selected;
      card.style.display = cat === 'alle' || cat === card.dataset.cat || (cat === 'wunsch' && n > 0) || on ? '' : 'none';
      card.classList.toggle('cur', on); card.classList.toggle('far', playerCount < need);
      card.querySelector('.gamebtn').classList.toggle('sel', on);
      card.querySelector('.gmeta').textContent = (playerCount < need ? '🔒 braucht ' + need + ' Spieler' : 'ab ' + need + (need > 1 ? ' Spielern' : ' Spieler')) + (labels[g.cat] ? ' · ' + labels[g.cat] : '');
      const w = card.querySelector('.gwish'); w.textContent = '👍' + (n ? ' ' + n : ''); w.classList.toggle('on', mine);
      if (on) cur = card;
    });
    // die Einstellungen des gewählten Spiels klappen beim Host in dessen Karte auf
    if (cur && lobby.host) cur.appendChild($('gameSettings')); else $('v-shelllobby').appendChild($('gameSettings'));
    $('gameSettings').style.display = cur && lobby.host ? '' : 'none';
  }
  // Settings-UI generisch aus dem Schema des gewählten Spiels (meta.js)
  function renderSettings() {
    const wrap = $('gameSettings'); wrap.innerHTML = '';
    const schema = (window.GAME_META[selected] || {}).settings || {};
    for (const f in schema) {
      const def = schema[f];
      if (def.when && !Object.entries(def.when).every(([key, value]) => curCfg[key] === value)) continue;
      if (def.type === 'choice') {
        const row = document.createElement('div'); row.className = 'modes'; row.style.marginBottom = '14px';
        (def.options || []).forEach(o => {
          const b = document.createElement('button'); b.className = 'modebtn' + (curCfg[f] === o.v ? ' sel' : ''); b.textContent = o.label;
          b.addEventListener('click', () => { curCfg[f] = o.v; renderSettings(); sendCfg(); });
          row.appendChild(b);
        });
        wrap.appendChild(row);
      } else if (def.type === 'number') {
        const row = document.createElement('div'); row.className = 'step'; row.style.marginBottom = '12px';
        const lab = document.createElement('span'); lab.style.flex = '1'; lab.textContent = def.label;
        const minus = document.createElement('button'); minus.textContent = '−';
        const val = document.createElement('span'); val.className = 'big'; val.textContent = curCfg[f] + (def.unit || '');
        const plus = document.createElement('button'); plus.textContent = '+';
        const bump = (dir) => { curCfg[f] = Math.max(def.min, Math.min(def.max, (curCfg[f] | 0) + dir * def.step)); val.textContent = curCfg[f] + (def.unit || ''); sendCfg(); };
        minus.addEventListener('click', () => bump(-1)); plus.addEventListener('click', () => bump(1));
        row.append(lab, minus, val, plus); wrap.appendChild(row);
      } else if (def.type === 'text') {
        const row = document.createElement('div'); row.style.marginBottom = '12px';
        const lab = document.createElement('div'); lab.className = 'muted'; lab.style.marginBottom = '6px'; lab.textContent = def.label + ':';
        const inp = document.createElement('input');
        inp.type = 'text'; inp.autocomplete = 'off'; inp.style.maxWidth = 'none'; inp.style.fontSize = '16px';
        inp.maxLength = def.max || 100; inp.value = curCfg[f] || ''; inp.placeholder = def.default || '';
        inp.addEventListener('change', () => { curCfg[f] = inp.value; sendCfg(); });
        row.append(lab, inp); wrap.appendChild(row);
      }
    }
    if (selected === 'breach' && window.BreachWorld) {
      const hint = document.createElement('p'); hint.id = 'br-lobby-mode-hint'; hint.style.cssText = 'font-size:13px;line-height:1.5;color:#c4d9d7';
      hint.textContent = BreachWorld.modes[curCfg.mode]?.description || ''; $('gameSettings').append(hint);
    }
  }
  $('startBtn').addEventListener('click', () => ac.message(AirConsole.SCREEN, { t: 'shellStart' }));
  // 👥: Spieler umbenennen und entfernen, Feierabend — selten gebraucht, deshalb hinter einem Knopf
  $('moreBtn').addEventListener('click', () => { const m = $('hostMore'); m.style.display = m.style.display === 'none' ? 'block' : 'none'; $('moreBtn').textContent = m.style.display === 'none' ? '👥' : '✕'; });

  // Host-Tools: Spielerliste mit Umbenennen (✏️→✓) und Kick (✖ mit Zwei-Tap)
  function renderAdmin(d) {
    const wrap = $('playerAdmin'); wrap.innerHTML = '';
    const roster = d.roster || [];
    if (!d.host || roster.length < 2) return;
    const head = document.createElement('div'); head.className = 'muted'; head.style.marginBottom = '6px'; head.textContent = 'Spieler:';
    wrap.appendChild(head);
    roster.forEach(p => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px';
      const dot = document.createElement('span');
      dot.style.cssText = 'width:14px;height:14px;border-radius:50%;flex:none;background:' + p.color;
      const nm = document.createElement('span'); nm.style.flex = '1'; nm.textContent = p.name + (p.id === d.player ? ' (du)' : '');
      const ed = document.createElement('button'); ed.className = 'gamebtn'; ed.textContent = '✏️';
      let editing = false;
      const inp = document.createElement('input');
      inp.type = 'text'; inp.maxLength = 14; inp.autocomplete = 'off';
      inp.style.cssText = 'flex:1;min-width:0;font-size:16px;padding:8px;max-width:none';
      ed.addEventListener('click', () => {
        if (!editing) { editing = true; inp.value = p.name; row.replaceChild(inp, nm); ed.textContent = '✓'; inp.focus(); }
        else if (inp.value.trim()) ac.message(AirConsole.SCREEN, { t: 'shellRename', id: p.id, name: inp.value });
      });
      row.append(dot, nm, ed);
      if (p.id !== d.player) { // sich selbst kicken geht nicht
        const kick = document.createElement('button');
        kick.className = 'gamebtn'; kick.style.background = '#5a1e1e'; kick.textContent = '✖';
        let armed = 0;
        kick.addEventListener('click', () => {
          if (Date.now() < armed) ac.message(AirConsole.SCREEN, { t: 'shellKick', id: p.id });
          else { armed = Date.now() + 2500; kick.textContent = '✖ sicher?'; setTimeout(() => { if (Date.now() >= armed) kick.textContent = '✖'; }, 2600); }
        });
        row.appendChild(kick);
      }
      wrap.appendChild(row);
    });
  }

  // Vom Host entfernt: Ende der Sitzung auf diesem Gerät (Reload tritt frisch bei)
  ac.onKicked = () => {
    document.body.style.background = '#1a1a24';
    document.body.innerHTML = '<div class="view on"><div class="center"><div class="big">🚪 Der Host hat dich entfernt.</div><div class="muted">Lade die Seite neu, um wieder mitzuspielen.</div></div></div>';
  };

  // Feierabend beendet die Abend-Wertung — Zwei-Tap-Bestätigung gegen Vertipper
  const NIGHT_LABEL = '🌙 Feierabend — Champion küren';
  let nightArm = 0;
  $('nightBtn').addEventListener('click', () => {
    if (Date.now() < nightArm) {
      nightArm = 0; $('nightBtn').textContent = NIGHT_LABEL;
      ac.message(AirConsole.SCREEN, { t: 'shellNight' });
    } else {
      nightArm = Date.now() + 2500;
      $('nightBtn').textContent = 'Wirklich? Nochmal tippen ✓';
      setTimeout(() => { if (Date.now() >= nightArm) $('nightBtn').textContent = NIGHT_LABEL; }, 2600);
    }
  });

  // ---------- Countdown (Drawing) ----------
  let timerInt = null, endAt = 0, onZero = null, tEl = null;
  function startTimer(ms, el, cb) {
    clearInterval(timerInt); endAt = performance.now() + ms; tEl = el; onZero = cb;
    const upd = () => { const s = Math.max(0, Math.ceil((endAt - performance.now()) / 1000)); tEl.textContent = s; if (s <= 0) { clearInterval(timerInt); if (onZero) { const c = onZero; onZero = null; c(); } } };
    upd(); timerInt = setInterval(upd, 200);
  }
  function stopTimer() { clearInterval(timerInt); onZero = null; }

  </script>

<script>
  const MODULES = window.CONTROLLERS;

  // ============ Nachrichten ============
  ac.onReady = () => ac.message(AirConsole.SCREEN, { t: 'shellSync' });
  ac.onMessage = (from, d) => {
    if (!d) return;
    if (d.t === 'shell') {
      if (d.cmd === 'name') { inGame = false; activeC = null; updateAbort(); showView('name'); setTimeout(() => $('nameInput').focus(), 50); }
      else if (d.cmd === 'lobby') {
        inGame = false; activeC = null; updateAbort();
        $('helloName').textContent = 'Hallo, ' + (d.name || 'Spieler') + '!';
        $('lobDot').style.background = d.color || '#0a84ff';
        $('lobInfo').textContent = (d.playerCount || 0) + ' Spieler' + (d.host ? ' · du bist Host ⭐' : '');
        document.body.style.background = '';
        const wasSelected = selected;
        gamesMeta = d.games || []; selected = d.selected; playerCount = d.playerCount || 0;
        lobby = { wish: d.wish || {}, mine: d.mine || [], host: !!d.host };
        curCfg = d.cfg || {};
        if (d.host) renderSettings();
        buildPicker();
        // wechselt die Wahl, rückt die Karte ins Bild — beim Host die eigene, bei allen anderen die des Hosts
        if (wasSelected !== selected) { const cur = $('gamePicker').querySelector('.gcard.cur'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
        $('hostLobby').style.display = d.host ? 'block' : 'none';
        $('guestLobby').style.display = d.host ? 'none' : 'block';
        const lab = (gamesMeta.find(g => g.key === d.selected) || {}).label || d.selected;
        if (d.host) { $('startBtn').disabled = !d.minOk; $('startBtn').style.opacity = d.minOk ? 1 : 0.5; $('startBtn').textContent = '▶ START · ' + lab; $('needPlayers').textContent = d.minOk ? (d.playerCount + ' Spieler bereit') : 'Mehr Spieler nötig…'; }
        else $('guestLobby').textContent = '⭐ ' + (d.hostName || 'Host') + ' wählt: ' + lab + ' · tippe 👍 für deine Wünsche';
        $('nightBtn').style.display = (d.host && d.night) ? 'block' : 'none';
        $('moreBtn').style.display = (d.roster || []).length > 1 || d.night ? '' : 'none';
        renderAdmin(d);
        showView('shelllobby');
      }
      else if (d.cmd === 'enterGame') { inGame = true; myHost = d.host; updateAbort(); activeC = MODULES[d.game] || null; if (activeC) activeC.activate(); }
      else if (d.cmd === 'spectate') { inGame = true; myHost = d.host; updateAbort(); activeC = null; showView('spectate'); }
      else if (d.cmd === 'host') { myHost = d.host; updateAbort(); }
    } else if (activeC && activeC.onMessage) {
      activeC.onMessage(d);
    }
  };
  showView('name');
  // Connect only after every controller and message handler is ready.
  ac._connect();
</script>
