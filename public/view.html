<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Hub — Mitschauen</title>
<!-- Mitschauen: shows the one screen's picture on another device (second room,
     playing from home). The screen sends JPEG frames only while viewers exist;
     viewers are no players and nothing here talks back to the game. -->
<style>
  html,body { margin:0; background:#0a0a14; color:#eee; font-family:system-ui,sans-serif; height:100%; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px; height:100%; box-sizing:border-box; }
  #info { font-size:14px; opacity:.75; text-align:center; }
  canvas { background:#0d0d1a; border-radius:10px; box-shadow:0 0 50px rgba(120,90,255,.18);
           max-width:calc(100vw - 20px); max-height:calc(100vh - 84px); width:auto; height:auto; }
  #fsBtn { position:fixed; top:10px; right:10px; z-index:50; border:none; border-radius:10px; padding:8px 12px;
           font-size:18px; background:rgba(255,255,255,.12); color:#eee; cursor:pointer; }
</style>
</head>
<body>
<button id="fsBtn" title="Vollbild">⛶</button>
<div id="wrap">
  <div id="info">👀 Mitschauen — verbinde…</div>
  <canvas id="c" width="720" height="450"></canvas>
</div>
<script src="core/wakelock.js"></script>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const info = document.getElementById('info');
  const join = location.host + '/controller.html';
  let ws = null, retry = 400, lastFrame = 0, decoding = false, pending = null;

  // Latest frame wins: while one decodes, newer ones replace the queued one.
  function show(src) {
    lastFrame = performance.now();
    if (decoding) { pending = src; return; }
    decoding = true;
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, cv.width, cv.height); next(); };
    img.onerror = next;
    img.src = src;
  }
  function next() {
    decoding = false;
    if (pending) { const p = pending; pending = null; show(p); }
  }

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host);
    ws.onopen = () => { retry = 400; ws.send(JSON.stringify({ type: 'register', role: 'viewer' })); };
    ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'frame' && m.data) show(m.data); };
    ws.onerror = () => ws.close();
    ws.onclose = () => { setTimeout(connect, retry = Math.min(retry * 2, 5000)); };
  }

  setInterval(() => {
    info.textContent = performance.now() - lastFrame < 3000
      ? '👀 Mitschauen — mitspielen mit dem Handy: ' + join
      : '👀 Warte auf den Bildschirm… (er muss auf einem anderen Gerät offen sein)';
  }, 1000);
  document.getElementById('fsBtn').addEventListener('click', () => {
    try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {}
  });
  connect();
</script>
</body>
</html>
